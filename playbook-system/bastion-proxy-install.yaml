# =============================================================================
# bastion-proxy — единый playbook (HAProxy + PROXY Protocol v2, L7 + L4)
# =============================================================================
# Внешний edge-прокси перед кластером: скрывает реальные IP worker-нод,
# обходит лимит Cloudflare 100 MB (grey-cloud -> bastion-proxy).
#   L7 (80/443): mode tcp -> send-proxy-v2 -> Traefik NodePort (Traefik роутит по SNI/Host).
#   L4 (диапазон): bind *:START-END 1-1 -> send-proxy-v2 -> внутренний HAProxy accept_proxy.
#
# Вся декларативная начинка (пакеты, конфиги, haproxy.cfg) — в
# hosts-vars/bastion-proxy-haproxy.yaml. Здесь только структура задач.
# По требованию — без общих tasks-* / include-директив (всё в одном файле).
#
# Серверов может быть несколько (группа bastion_proxy). Всегда белый IP (прямой SSH).
# SSH (22/tcp): из любой сети или только с vpn_ips (bastion_proxy_haproxy_ssh_vpn_only_enabled,
# своя таблица nftables; node-install). При true запускать из VPN. Teleport на bastion
# нет: запасной вход — консоль провайдера.
#
# Теги (линейно): node-install -> haproxy-install -> haproxy-config -> verify
# verify — тег `verify` (НЕ always).
# Usage:
#   ansible-playbook -i hosts-vars/ -i hosts-vars-override/<c>/ playbook-system/bastion-proxy-install.yaml
#   ansible-playbook ... --tags node-install
#   ansible-playbook ... --tags haproxy-install
#   ansible-playbook ... --tags haproxy-config
#   ansible-playbook ... --tags verify
# =============================================================================

---
- name: Setup bastion-proxy (HAProxy edge, L7 + L4)
  hosts: bastion_proxy
  become: true
  gather_facts: false

  tasks:
    # =========================================================================
    # NODE-INSTALL — Linux-пакеты + безопасность
    # =========================================================================
    - name: "[bastion-proxy-node] Current hostname"
      command: hostname
      register: bastion_proxy_current_hostname
      changed_when: false
      check_mode: false
      tags: [node-install]

    - name: "[bastion-proxy-node] Set hostname"
      command: hostnamectl set-hostname {{ new_hostname }}
      when: bastion_proxy_current_hostname.stdout != new_hostname
      tags: [node-install]

    - name: "[bastion-proxy-node] Install SSH public keys (before key-only auth)"
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('file', item) }}"
      loop: "{{ ssh_public_key_paths }}"
      tags: [node-install]

    - name: "[bastion-proxy-node] Install base packages + fail2ban"
      apt:
        name: "{{ bastion_proxy_haproxy_base_packages }}"
        state: present
        update_cache: true
      tags: [node-install]

    - name: "[bastion-proxy-node] Configure fail2ban sshd jail"
      copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        content: "{{ bastion_proxy_haproxy_fail2ban_jail }}"
        mode: '0644'
      register: bastion_proxy_fail2ban_jail_result
      tags: [node-install]

    - name: "[bastion-proxy-node] Enable and start fail2ban"
      systemd:
        name: fail2ban
        enabled: true
        state: started
      tags: [node-install]

    - name: "[bastion-proxy-node] Restart fail2ban if jail changed"
      systemd:
        name: fail2ban
        state: restarted
      when: bastion_proxy_fail2ban_jail_result.changed
      tags: [node-install]

    # Вход только по ключу: блок проверок тот же, что у узлов
    # (prepare-linux-pkgs.yaml, фаза SSHD). Ключ у ansible_user должен быть ДО
    # того, как hardening начнёт действовать, иначе на bastion не зайти.
    - name: "[bastion-proxy-node] Resolve home of {{ ansible_user }}"
      getent:
        database: passwd
        key: "{{ ansible_user }}"
      tags: [node-install]

    - name: "[bastion-proxy-node] Read authorized_keys of {{ ansible_user }}"
      slurp:
        src: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
      register: bastion_proxy_authorized_keys
      failed_when: false
      tags: [node-install]

    - name: "[bastion-proxy-node] Assert key-based login is possible"
      assert:
        that:
          - bastion_proxy_authorized_keys.content is defined
          - >-
            (bastion_proxy_authorized_keys.content | b64decode).splitlines()
            | reject('match', '^[ \t]*(#|$)')
            | select('search', '(^|[ \t])(ssh-|ecdsa-|sk-)') | list | length > 0
        fail_msg: >-
          ~{{ ansible_user }}/.ssh/authorized_keys пуст или отсутствует -
          с отключённым паролем вход на {{ inventory_hostname }} невозможен.
          Проверить ssh_public_key_paths (задача Install SSH public keys выше).
      tags: [node-install]

    - name: "[bastion-proxy-node] Harden sshd (key-only auth)"
      copy:
        dest: /etc/ssh/sshd_config.d/10-bastion-proxy-hardening.conf
        content: "{{ bastion_proxy_haproxy_sshd_hardening }}"
        mode: '0644'
      register: bastion_proxy_sshd_result
      tags: [node-install]

    # След ручной правки 2026-11-09 (как на узлах): /etc/cloud/cloud.cfg.d/
    # 99-ansible-ssh-pwauth.cfg ничего не защищает — ssh_pwauth из user-data
    # провайдера главнее cloud.cfg.d, а 10- и так читается раньше
    # 50-cloud-init.conf. Одноразовая очистка: задачу можно убрать, когда файла нет.
    - name: "[bastion-proxy-node] Remove manual leftover 99-ansible-ssh-pwauth.cfg"
      file:
        path: /etc/cloud/cloud.cfg.d/99-ansible-ssh-pwauth.cfg
        state: absent
      tags: [node-install]

    - name: "[bastion-proxy-node] Validate sshd config"
      command: sshd -t
      changed_when: false
      check_mode: false
      tags: [node-install]

    - name: "[bastion-proxy-node] Reload ssh if config changed"
      systemd:
        name: ssh
        state: reloaded
      when: bastion_proxy_sshd_result.changed
      tags: [node-install]

    - name: "[bastion-proxy-node] Check ssh service is active"
      command: systemctl is-active ssh
      register: bastion_proxy_ssh_active_check
      changed_when: false
      check_mode: false
      tags: [node-install]

    - name: "[bastion-proxy-node] Assert ssh is active"
      assert:
        that:
          - bastion_proxy_ssh_active_check.stdout | trim == 'active'
        fail_msg: "ssh service is NOT active"
        success_msg: "ssh: active"
      tags: [node-install]

    - name: "[bastion-proxy-node] Effective sshd config (sshd -T)"
      command: sshd -T
      changed_when: false
      check_mode: false
      register: bastion_proxy_sshd_effective_install
      tags: [node-install]

    - name: "[bastion-proxy-node] Assert password auth disabled"
      assert:
        that:
          - "'passwordauthentication no' in bastion_proxy_sshd_effective_install.stdout_lines"
          - "'kbdinteractiveauthentication no' in bastion_proxy_sshd_effective_install.stdout_lines"
        fail_msg: "sshd на {{ inventory_hostname }} всё ещё разрешает вход по паролю"
        success_msg: "sshd {{ inventory_hostname }}: passwordauthentication no"
      # в --check файлы не пишутся и reload не выполняется — итог ещё старый
      when: not ansible_check_mode
      tags: [node-install]

    - name: "[bastion-proxy-node] Sysctl for HAProxy range bind (fd limits)"
      copy:
        dest: /etc/sysctl.d/99-bastion-proxy-haproxy.conf
        content: "{{ bastion_proxy_haproxy_sysctl_conf }}"
        mode: '0644'
      register: bastion_proxy_sysctl_result
      tags: [node-install]

    - name: "[bastion-proxy-node] Apply sysctl if changed"
      command: sysctl --system
      changed_when: false
      when: bastion_proxy_sysctl_result.changed
      tags: [node-install]

    # SSH (22/tcp) только с vpn_ips: bastion не k8s-узел, host firewall Cilium
    # его не покрывает — своя таблица nftables inet bastion_ssh
    # (bastion_proxy_haproxy_ssh_vpn_only_enabled). При false файл правил только
    # удаляет таблицу. Проверка vpn_ips стоит здесь, а не в начале node-install,
    # чтобы срабатывать и при запуске с --start-at-task.
    - name: "[bastion-proxy-node] Assert vpn_ips for SSH VPN-only"
      assert:
        that:
          - vpn_ips is sequence
          - vpn_ips is not string
          - vpn_ips | length > 0
          - >-
            vpn_ips
            | reject('match', '^[0-9]{1,3}([.][0-9]{1,3}){3}/[0-9]{1,2}$') | list | length == 0
        fail_msg: >-
          bastion_proxy_haproxy_ssh_vpn_only_enabled: true требует непустой vpn_ips
          из IPv4 CIDR (a.b.c.d/nn), иначе SSH на bastion закрылся бы для всех.
      when: bastion_proxy_haproxy_ssh_vpn_only_enabled | bool
      tags: [node-install]

    - name: "[bastion-proxy-node] Ensure /etc/bastion-proxy"
      file:
        path: /etc/bastion-proxy
        state: directory
        mode: '0755'
      tags: [node-install]

    - name: "[bastion-proxy-node] SSH firewall rules (nftables)"
      copy:
        dest: /etc/bastion-proxy/ssh-firewall.nft
        content: "{{ bastion_proxy_haproxy_ssh_firewall_nft }}"
        mode: '0644'
        validate: nft -c -f %s
      register: bastion_proxy_ssh_fw_rules_result
      tags: [node-install]

    - name: "[bastion-proxy-node] SSH firewall systemd unit"
      copy:
        dest: /etc/systemd/system/bastion-ssh-firewall.service
        content: "{{ bastion_proxy_haproxy_ssh_firewall_unit }}"
        mode: '0644'
      tags: [node-install]

    # В --check файлы не пишутся: юнита может ещё не быть, systemd упал бы.
    - name: "[bastion-proxy-node] Enable and start SSH firewall (+ daemon-reload)"
      systemd:
        name: bastion-ssh-firewall
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
      tags: [node-install]

    # Загрузка правил на каждом прогоне (атомарно, идемпотентно): ядро не
    # расходится с файлом, даже если прошлый прогон оборвался до reload или
    # таблицу удалили руками. changed — только при смене файла.
    - name: "[bastion-proxy-node] Load SSH firewall rules (reload)"
      systemd:
        name: bastion-ssh-firewall
        state: reloaded
      changed_when: bastion_proxy_ssh_fw_rules_result.changed
      when: not ansible_check_mode
      tags: [node-install]

    # =========================================================================
    # HAPROXY-INSTALL — пакет HAProxy (PPA vbernat; версия из bastion-proxy-haproxy.yaml)
    # =========================================================================
    - name: "[bastion-proxy-haproxy] Install software-properties-common"
      apt:
        name: software-properties-common
        state: present
        install_recommends: false
      tags: [haproxy-install]

    - name: "[bastion-proxy-haproxy] Add HAProxy PPA"
      command: add-apt-repository -y ppa:vbernat/haproxy-{{ bastion_proxy_haproxy_package_version }}
      changed_when: false
      tags: [haproxy-install]

    - name: "[bastion-proxy-haproxy] Install haproxy"
      apt:
        name: "haproxy={{ bastion_proxy_haproxy_package_version }}*"
        state: present
        update_cache: true
      tags: [haproxy-install]

    - name: "[bastion-proxy-haproxy] Hold haproxy version"
      command: apt-mark hold haproxy
      changed_when: false
      tags: [haproxy-install]

    - name: "[bastion-proxy-haproxy] Ensure haproxy.service.d override dir"
      file:
        path: /etc/systemd/system/haproxy.service.d
        state: directory
        mode: '0755'
      tags: [haproxy-install]

    - name: "[bastion-proxy-haproxy] systemd override LimitNOFILE"
      copy:
        dest: /etc/systemd/system/haproxy.service.d/override.conf
        content: "{{ bastion_proxy_haproxy_systemd_override }}"
        mode: '0644'
      register: bastion_proxy_haproxy_override_result
      tags: [haproxy-install]

    - name: "[bastion-proxy-haproxy] Enable haproxy (+ daemon-reload)"
      systemd:
        name: haproxy
        enabled: true
        daemon_reload: true
      tags: [haproxy-install]

    - name: "[bastion-proxy-haproxy] Restart haproxy to apply LimitNOFILE"
      systemd:
        name: haproxy
        state: restarted
      when: bastion_proxy_haproxy_override_result.changed
      tags: [haproxy-install]

    # =========================================================================
    # HAPROXY-CONFIG — рендер /etc/haproxy/haproxy.cfg -> validate -> reload
    # =========================================================================
    - name: "[bastion-proxy-config] Render /etc/haproxy/haproxy.cfg"
      copy:
        dest: /etc/haproxy/haproxy.cfg
        content: "{{ bastion_proxy_haproxy_config }}"
        mode: '0644'
      register: bastion_proxy_haproxy_config_result
      tags: [haproxy-config]

    - name: "[bastion-proxy-config] Validate haproxy.cfg"
      command: haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false
      tags: [haproxy-config]

    - name: "[bastion-proxy-config] Graceful reload haproxy (hitless)"
      systemd:
        name: haproxy
        state: reloaded
      when: bastion_proxy_haproxy_config_result.changed
      tags: [haproxy-config]

    # =========================================================================
    # VERIFY (тег verify — НЕ always)
    # =========================================================================
    - name: "[bastion-proxy-verify] HAProxy version"
      command: haproxy -v
      changed_when: false
      register: bastion_proxy_haproxy_version
      tags: [verify]

    - name: "[bastion-proxy-verify] HAProxy is active"
      command: systemctl is-active haproxy
      changed_when: false
      tags: [verify]

    - name: "[bastion-proxy-verify] HAProxy open-files limit"
      shell: "cat /proc/$(systemctl show -p MainPID --value haproxy)/limits"
      changed_when: false
      register: bastion_proxy_haproxy_limits
      tags: [verify]

    - name: "[bastion-proxy-verify] Assert LimitNOFILE applied to running haproxy"
      assert:
        that:
          - "bastion_proxy_haproxy_limits.stdout is search('Max open files\\s+' ~ bastion_proxy_haproxy_limit_nofile)"
        fail_msg: "haproxy Max open files != {{ bastion_proxy_haproxy_limit_nofile }}"
      tags: [verify]

    - name: "[bastion-proxy-verify] Effective sshd config"
      command: sshd -T
      changed_when: false
      register: bastion_proxy_sshd_effective
      tags: [verify]

    - name: "[bastion-proxy-verify] Assert sshd password auth disabled"
      assert:
        that:
          - "'passwordauthentication no' in bastion_proxy_sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in bastion_proxy_sshd_effective.stdout_lines"
        fail_msg: "sshd still allows password authentication"
      tags: [verify]

    - name: "[bastion-proxy-verify] SSH firewall table (nftables)"
      command: nft list table inet bastion_ssh
      changed_when: false
      failed_when: false
      register: bastion_proxy_ssh_fw_table
      tags: [verify]

    - name: "[bastion-proxy-verify] Assert SSH firewall matches bastion_proxy_haproxy_ssh_vpn_only_enabled"
      assert:
        that: >-
          (bastion_proxy_ssh_fw_table.rc == 0
           and 'tcp dport 22 drop' in bastion_proxy_ssh_fw_table.stdout)
          if (bastion_proxy_haproxy_ssh_vpn_only_enabled | bool)
          else (bastion_proxy_ssh_fw_table.rc != 0)
        fail_msg: >-
          nftables inet bastion_ssh не соответствует
          bastion_proxy_haproxy_ssh_vpn_only_enabled={{ bastion_proxy_haproxy_ssh_vpn_only_enabled }}
      tags: [verify]

    - name: "[bastion-proxy-verify] Listening sockets"
      command: ss -ltn
      changed_when: false
      register: bastion_proxy_ss
      tags: [verify]

    - name: "[bastion-proxy-verify] Assert L7 + L4 ports are listening"
      assert:
        that:
          - "':80 ' in bastion_proxy_ss.stdout"
          - "':443 ' in bastion_proxy_ss.stdout"
          - "(':' ~ bastion_proxy_haproxy_l4_range_start ~ ' ') in bastion_proxy_ss.stdout"
          - "(':' ~ bastion_proxy_haproxy_l4_range_end ~ ' ') in bastion_proxy_ss.stdout"
        fail_msg: "expected haproxy to listen on 80, 443 and the L4 range endpoints"
      tags: [verify]
