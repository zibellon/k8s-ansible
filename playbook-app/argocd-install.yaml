# =============================================================================
# Install ArgoCD via local Helm charts
# Steps (numbering matches the STEP banners in the body):
#   1. argocd/crds: CRDs via `kubectl apply --server-side` (CRDs exceed the client-side annotation limit)
#   2. argocd/pre: NetworkPolicies + ESO (ServiceAccount, SecretStore, ExternalSecret)
#   3. argocd/install: ArgoCD manifests via kustomize → Helm
#   4. accounts-sync: local-accounts reconcile (passwords → argocd-secret + Vault mirror)
#   5. accounts-distribute: account creds → extra Vault paths
#   6. argocd/post: Ingress (UI + RPC) + default AppProject
#   7. argocd/cfg: AppProjects + Applications from argocd_git_ops_app_projects + argocd_git_ops_applications
#
# Usage (tags):
#   ansible-playbook argocd-install.yaml              # full install (crds + pre + install + post + cfg)
#   ansible-playbook argocd-install.yaml --tags crds           # only crds (kubectl apply --server-side)
#   ansible-playbook argocd-install.yaml --tags pre     # only pre (NetworkPolicies + ESO)
#   ansible-playbook argocd-install.yaml --tags install
#   ansible-playbook argocd-install.yaml --tags post           # only post (Ingress)
#   ansible-playbook argocd-install.yaml --tags cfg             # only cfg AppProjects + Applications
#   ansible-playbook argocd-install.yaml --tags accounts-sync  # only local-accounts reconcile (rotation entrypoint)
#   ansible-playbook argocd-install.yaml --tags accounts-distribute  # only creds distribution to extra Vault paths
#
# NOTE: Local accounts + custom-admin (passwords) are managed declaratively via
#       --tags accounts-sync (argocd_local_accounts → argocd-secret + Vault mirror).
# =============================================================================

- name: Install ArgoCD via local Helm chart
  hosts: managers
  become: true
  gather_facts: false

  tasks:
    - name: "[argocd-install] Assert component enabled"
      assert:
        that:
          - argocd_enabled | default(false) | bool
        fail_msg: "argocd is disabled (argocd_enabled=false). Set argocd_enabled: true in hosts-vars-override/ to install/configure it."
      run_once: true
      tags: [always]

    - name: "[argocd-install-pre-check] Validate target"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-pre-check.yaml"
      vars:
        dto_label_name: "argocd-install-pre-check"
      tags: [always]

    - name: "[argocd-install-pre-check] Forbid kube-system namespace"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-forbid-kube-system.yaml"
      vars:
        dto_label_name: "argocd-install-pre-check"
        dto_target_namespace: "{{ argocd_namespace }}"
      tags: [always]

    # =========================================================================
    # INIT: Merge ESO integrations and resolve ArgoCD config
    # =========================================================================

    - name: "[argocd-install-init] Verify Vault config"
      include_tasks: "{{ project_root }}/playbook-app/tasks/vault/tasks-vault-config-verify.yaml"
      vars:
        dto_label_name: "argocd-install-init"
      tags: [always]

    - name: "[argocd-install-init] Verify ESO config"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-eso-verify.yaml"
      vars:
        dto_label_name: "argocd-install-init"
        dto_eso_secrets_list: "{{ eso_vault_integration_argocd_secrets + (eso_vault_integration_argocd_secrets_extra | default([])) }}"
        dto_eso_integration_object: "{{ eso_vault_integration_argocd }}"
        dto_namespace: "{{ argocd_namespace }}"
      tags: [always]

    - name: "[argocd-install-init] Validate local-accounts schema (fail-fast before render)"
      set_fact:
        _local_argocd_accounts_validated: "{{ argocd_local_accounts | argocd_accounts_validate }}"
      run_once: true
      tags: [always]

    # =========================================================================
    # STEP 1: ARGOCD/CRDS (CRDs via kubectl apply --server-side)
    # =========================================================================

    - name: "[argocd-install-crds] Copy crds chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argocd-install-crds"
        dto_chart_name: "crds"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argocd/crds/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/crds"
      tags: [crds]

    - name: "[argocd-install-crds] Install argocd-crds via kubectl"
      command: >-
        kubectl apply --server-side --force-conflicts
        -f {{ remote_charts_dir }}/argocd/crds/crds.yaml
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [crds]

    - name: "[argocd-install-crds] Wait for CRDs"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-crds.yaml"
      vars:
        dto_label_name: "argocd-install-crds"
        dto_crds_list: "{{ argocd_crds_list }}"
      tags: [crds]

    # =========================================================================
    # STEP 2: ARGOCD/PRE (NetworkPolicies + ESO resources)
    # =========================================================================

    - name: "[argocd-pre] Copy pre chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argocd-pre"
        dto_chart_name: "pre"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argocd/pre/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/pre"
      tags: [pre]

    - name: "[argocd-pre] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argocd-pre"
        dto_dir: "{{ remote_charts_dir }}/argocd/pre"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argocd_pre_helm_values | to_nice_yaml }}"
      tags: [pre]

    - name: "[argocd-pre] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argocd-pre"
        dto_release_name: "argocd-pre"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/pre"
        dto_values_file_path: "{{ remote_charts_dir }}/argocd/pre/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argocd/pre-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argocd/pre-k"
        dto_patches_list: "{{ argocd_pre_kustomize_patches }}"
        dto_target_namespace: "{{ argocd_namespace }}"
      tags: [pre]

    - name: "[argocd-pre] Install or upgrade via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argocd-pre"
        dto_helm_command: >
          helm upgrade --install argocd-pre {{ remote_charts_dir }}/argocd/pre-k
          --namespace {{ argocd_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argocd_pre_helm_timeout }}
      tags: [pre]

    # =========================================================================
    # STEP 3: ARGOCD/INSTALL (ArgoCD manifests via kustomize → Helm)
    # =========================================================================

    - name: "[argocd-install] Copy install chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argocd-install"
        dto_chart_name: "install"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argocd/install/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/install"
      tags: [install]

    - name: "[argocd-install] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argocd-install"
        dto_dir: "{{ remote_charts_dir }}/argocd/install"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argocd_install_helm_values | to_nice_yaml }}"
      tags: [install]

    - name: "[argocd-install] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argocd-install"
        dto_release_name: "argocd"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/install"
        dto_values_file_path: "{{ remote_charts_dir }}/argocd/install/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argocd/install-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argocd/install-k"
        dto_patches_list: "{{ argocd_install_kustomize_patches }}"
        dto_target_namespace: "{{ argocd_namespace }}"
        dto_kustomize_apply_namespace_transform: true
      tags: [install]

    - name: "[argocd-install] Install or upgrade argocd via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argocd-install"
        dto_helm_command: >
          helm upgrade --install argocd {{ remote_charts_dir }}/argocd/install-k
          --namespace {{ argocd_namespace }}
          --create-namespace
          --cleanup-on-fail
          --skip-crds
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argocd_install_helm_timeout }}
      tags: [install]

    # =========================================================================
    # WAIT FOR ARGOCD TO BE READY
    # =========================================================================

    - name: "[argocd-install] Wait for rollouts"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "argocd-install"
        dto_rollout_namespace: "{{ argocd_namespace }}"
        dto_rollout_timeout: "{{ argocd_rollout_timeout }}"
        dto_rollout_resources_list: "{{ argocd_rollout_resources }}"
      tags: [install]

    # =========================================================================
    # STEP 4: LOCAL ACCOUNTS SYNC
    # =========================================================================

    - name: "[argocd-accounts-sync] Sync local accounts"
      include_tasks: "{{ project_root }}/playbook-app/tasks/argocd/tasks-argocd-accounts-sync.yaml"
      vars:
        dto_label_name: "argocd-accounts-sync"
      tags: [accounts-sync]

    # =========================================================================
    # STEP 5: LOCAL ACCOUNTS DISTRIBUTE (creds → extra Vault paths)
    # =========================================================================

    - name: "[argocd-accounts-distribute] Distribute account creds to extra Vault paths"
      include_tasks: "{{ project_root }}/playbook-app/tasks/argocd/tasks-argocd-accounts-distribute.yaml"
      vars:
        dto_label_name: "argocd-accounts-distribute"
      tags: [accounts-distribute]

    # =========================================================================
    # STEP 6: ARGOCD/POST (Ingress UI + RPC)
    # =========================================================================

    - name: "[argocd-post] Copy post chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argocd-post"
        dto_chart_name: "post"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argocd/post/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/post"
      tags: [post]

    - name: "[argocd-post] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argocd-post"
        dto_dir: "{{ remote_charts_dir }}/argocd/post"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argocd_post_helm_values | to_nice_yaml }}"
      tags: [post]

    - name: "[argocd-post] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argocd-post"
        dto_release_name: "argocd-post"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/post"
        dto_values_file_path: "{{ remote_charts_dir }}/argocd/post/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argocd/post-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argocd/post-k"
        dto_patches_list: "{{ argocd_post_kustomize_patches }}"
        dto_target_namespace: "{{ argocd_namespace }}"
      tags: [post]

    - name: "[argocd-post] Install or upgrade via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argocd-post"
        dto_helm_command: >
          helm upgrade --install argocd-post {{ remote_charts_dir }}/argocd/post-k
          --namespace {{ argocd_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argocd_post_helm_timeout }}
      tags: [post]

    # =========================================================================
    # STEP 7: ARGOCD/CFG (RBAC ArgoCD в кластере + git-ops AppProjects и Applications)
    # Порядок внутри релиза: RBAC — известные helm kind'ы и уходят рано, AppProject
    # и Application — неизвестные и уходят последними.
    # =========================================================================

    - name: "[argocd-cfg-default-project] Ensure /opt/yaml directory exists"
      file:
        path: /opt/yaml
        state: directory
        mode: "0755"
      when: argocd_gitops_default_project_update | length > 0
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[argocd-cfg-default-project] Render default-project lockdown manifest"
      copy:
        dest: "/opt/yaml/argocd-default-appproject.yaml"
        mode: "0644"
        content: "{{ argocd_gitops_default_project_update | to_nice_yaml }}"
      when: argocd_gitops_default_project_update | length > 0
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[argocd-cfg-default-project] Apply default-project lockdown (ArgoCD-owned, raw apply)"
      command: kubectl apply -f /opt/yaml/argocd-default-appproject.yaml
      when: argocd_gitops_default_project_update | length > 0
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[argocd-cfg] Copy cfg chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argocd-cfg"
        dto_chart_name: "cfg"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argocd/cfg/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/cfg"
      tags: [cfg]

    - name: "[argocd-cfg] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argocd-cfg"
        dto_dir: "{{ remote_charts_dir }}/argocd/cfg"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argocd_cfg_helm_values | to_nice_yaml }}"
      tags: [cfg]

    - name: "[argocd-cfg] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argocd-cfg"
        dto_release_name: "argocd-cfg"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argocd/cfg"
        dto_values_file_path: "{{ remote_charts_dir }}/argocd/cfg/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argocd/cfg-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argocd/cfg-k"
        dto_patches_list: "{{ argocd_cfg_kustomize_patches }}"
        dto_target_namespace: "{{ argocd_namespace }}"
      tags: [cfg]

    - name: "[argocd-cfg] Install or upgrade via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argocd-cfg"
        dto_helm_command: >
          helm upgrade --install argocd-cfg {{ remote_charts_dir }}/argocd/cfg-k
          --namespace {{ argocd_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --timeout {{ argocd_cfg_helm_timeout }}
      tags: [cfg]

    - name: "[argocd-cfg] Get Application status"
      command: >
        kubectl get application {{ item.name }}
        -n {{ argocd_namespace }}
        -o jsonpath='{.status.sync.status} / {.status.health.status}'
      register: _local_argocd_cfg_app_status
      changed_when: false
      failed_when: false
      loop: "{{ argocd_git_ops_applications }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[argocd-cfg] Show Application status"
      debug:
        msg: "{{ item.item.name }}: {{ item.stdout }}"
      loop: "{{ _local_argocd_cfg_app_status.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    # =========================================================================
    # VERIFICATION
    # =========================================================================

    - name: "[argocd-verify] Verify Helm releases"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-helm.yaml"
      vars:
        dto_helm_namespace: "{{ argocd_namespace }}"
        dto_label_name: "argocd-verify"
      tags: [always]

    - name: "[argocd-verify] Show pods in {{ argocd_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-pods.yaml"
      vars:
        dto_label_name: "argocd-verify"
        dto_pods_namespace: "{{ argocd_namespace }}"
      tags: [always]

    - name: "[argocd-verify] Show NetworkPolicies in {{ argocd_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-network-policy.yaml"
      vars:
        dto_label_name: "argocd-verify"
        dto_np_namespace: "{{ argocd_namespace }}"
      tags: [always]

    - name: "[argocd-verify] Installation complete"
      debug:
        msg:
          - "argocd-pre + argocd + argocd-post + argocd-cfg + accounts-sync: OK"
          - "Local-account passwords are stored in Vault mirror: {{ eso_vault_integration_argocd.kv_engine_path }}{{ argocd_accounts_vault_path }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [always]
