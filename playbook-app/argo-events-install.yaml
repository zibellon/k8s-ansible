# =============================================================================
# Install Argo Events (event-driven automation: EventSource → EventBus → Sensor)
# Steps:
#   1. argo-events/crds:    CustomResourceDefinitions (kubectl apply)
#   2. argo-events/pre:     NetworkPolicies + cert-manager Issuer + ESO resources
#   3. argo-events/install: vendored upstream manifest v1.9.11 (controller + RBAC)
#   4. argo-events/webhook: vendored validating admission webhook
#   5. argo-events/rbac:    ServiceAccounts + Roles + bindings for EventSource/Sensor pods
#   6. argo-events/cr:      EventBus + EventSources + Sensors
#   7. argo-events/post:    PodMonitors
#
# Usage (tags):
#   ansible-playbook -i hosts-vars/ -i hosts-vars-override/<cluster>/ playbook-app/argo-events-install.yaml
#   ansible-playbook ... --tags crds
#   ansible-playbook ... --tags pre
#   ansible-playbook ... --tags install
#   ansible-playbook ... --tags webhook
#   ansible-playbook ... --tags rbac
#   ansible-playbook ... --tags cr
#   ansible-playbook ... --tags post
#
# Prerequisites:
#   - Cilium installed (NetworkPolicy enforcement)
#   - Vault installed/unsealed; Vault policies+roles synced (argo-events.eso-main)
#   - External Secrets Operator installed
#   - Storage class available for the JetStream EventBus PVCs
#   - mon-system installed if PodMonitors are enabled
#
# NOTE: контроллер ставится cluster-wide и видит CR во всех namespace, но
#       EventBus/EventSource/Sensor держим только в argo-events: шина namespaced,
#       а чужому namespace нужен ещё и свой комплект NetworkPolicy.
#       Собственного UI у argo-events нет.
#       Фаза webhook гейтится argo_events_webhook_enabled. Перевод тумблера в
#       false пропускает фазу, но уже установленный релиз не удаляет — для этого
#       нужен `helm uninstall argo-events-webhook -n argo-events`.
# =============================================================================

---
- name: Install Argo Events (event-driven automation)
  hosts: managers
  become: true
  gather_facts: false

  tasks:
    - name: "[argo-events-install] Assert component enabled"
      assert:
        that:
          - argo_events_enabled | default(false) | bool
        fail_msg: "argo-events is disabled (argo_events_enabled=false). Set argo_events_enabled: true in hosts-vars-override/ to install it."
      run_once: true
      tags: [always]

    - name: "[argo-events-pre-check] Validate target"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-pre-check.yaml"
      vars:
        dto_label_name: "argo-events-pre-check"
      tags: [always]

    - name: "[argo-events-pre-check] Forbid kube-system namespace"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-forbid-kube-system.yaml"
      vars:
        dto_label_name: "argo-events-pre-check"
        dto_target_namespace: "{{ argo_events_namespace }}"
      tags: [always]

    - name: "[argo-events-install-init] Verify Vault config"
      include_tasks: "{{ project_root }}/playbook-app/tasks/vault/tasks-vault-config-verify.yaml"
      vars:
        dto_label_name: "argo-events-install-init"
      tags: [always]

    - name: "[argo-events-install-init] Verify ESO config"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-eso-verify.yaml"
      vars:
        dto_label_name: "argo-events-install-init"
        dto_eso_secrets_list: "{{ eso_vault_integration_argo_events_secrets + (eso_vault_integration_argo_events_secrets_extra | default([])) }}"
        dto_eso_integration_object: "{{ eso_vault_integration_argo_events }}"
        dto_namespace: "{{ argo_events_namespace }}"
      tags: [always]

    # =========================================================================
    # STEP 1: CRDS (kubectl apply — CRD небольшие, лимит аннотации не грозит,
    # apply даёт идемпотентность и апгрейд при смене версии)
    # =========================================================================

    - name: "[argo-events-crds] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argo-events-crds"
        dto_chart_name: "crds"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argo-events/crds/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/crds"
      tags: [crds]

    - name: "[argo-events-crds] Install CRDs via kubectl"
      command: kubectl apply -f {{ remote_charts_dir }}/argo-events/crds/crds.yaml
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [crds]

    - name: "[argo-events-crds] Wait for CRDs"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-crds.yaml"
      vars:
        dto_label_name: "argo-events-crds"
        dto_crds_list: "{{ argo_events_crds_list }}"
      tags: [crds]

    # =========================================================================
    # STEP 2: PRE (NetworkPolicies + Issuer + ESO resources)
    # =========================================================================

    - name: "[argo-events-pre] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argo-events-pre"
        dto_chart_name: "pre"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argo-events/pre/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/pre"
      tags: [pre]

    - name: "[argo-events-pre] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argo-events-pre"
        dto_dir: "{{ remote_charts_dir }}/argo-events/pre"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argo_events_pre_helm_values | to_nice_yaml }}"
      tags: [pre]

    - name: "[argo-events-pre] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argo-events-pre"
        dto_release_name: "argo-events-pre"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/pre"
        dto_values_file_path: "{{ remote_charts_dir }}/argo-events/pre/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argo-events/pre-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argo-events/pre-k"
        dto_patches_list: "{{ argo_events_pre_kustomize_patches }}"
        dto_target_namespace: "{{ argo_events_namespace }}"
      tags: [pre]

    - name: "[argo-events-pre] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argo-events-pre"
        dto_helm_command: >
          helm upgrade --install argo-events-pre {{ remote_charts_dir }}/argo-events/pre-k
          --namespace {{ argo_events_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argo_events_pre_helm_timeout }}
      tags: [pre]

    # =========================================================================
    # STEP 3: INSTALL (vendored upstream manifest)
    # =========================================================================

    - name: "[argo-events-install] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argo-events-install"
        dto_chart_name: "install"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argo-events/install/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/install"
      tags: [install]

    - name: "[argo-events-install] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argo-events-install"
        dto_dir: "{{ remote_charts_dir }}/argo-events/install"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argo_events_install_helm_values | to_nice_yaml }}"
      tags: [install]

    # namespace_transform обязателен: upstream-манифест хардкодит
    # `namespace: argo-events` в metadata и в subjects ClusterRoleBinding.
    # Патчи пинят образ (в манифесте он помечен :latest) и добавляют
    # контроллеру порт metrics — апстрим его не объявляет.
    - name: "[argo-events-install] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argo-events-install"
        dto_release_name: "argo-events"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/install"
        dto_values_file_path: "{{ remote_charts_dir }}/argo-events/install/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argo-events/install-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argo-events/install-k"
        dto_patches_list: "{{ argo_events_install_kustomize_patches }}"
        dto_target_namespace: "{{ argo_events_namespace }}"
        dto_kustomize_apply_namespace_transform: true
      tags: [install]

    - name: "[argo-events-install] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argo-events-install"
        dto_helm_command: >
          helm upgrade --install argo-events {{ remote_charts_dir }}/argo-events/install-k
          --namespace {{ argo_events_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argo_events_install_helm_timeout }}
      tags: [install]

    - name: "[argo-events-install] Wait for rollout"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "argo-events-install"
        dto_rollout_namespace: "{{ argo_events_namespace }}"
        dto_rollout_timeout: "{{ argo_events_install_rollout_timeout }}"
        dto_rollout_resources_list: "{{ argo_events_install_rollout_resources }}"
      tags: [install]

    # =========================================================================
    # STEP 4: WEBHOOK (vendored validating admission webhook)
    # Гейтится argo_events_webhook_enabled. Вебхук сам выпускает себе
    # сертификат и сам регистрирует ValidatingWebhookConfiguration.
    # =========================================================================

    - name: "[argo-events-webhook] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argo-events-webhook"
        dto_chart_name: "webhook"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argo-events/webhook/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/webhook"
      when: argo_events_webhook_enabled | bool
      tags: [webhook]

    - name: "[argo-events-webhook] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argo-events-webhook"
        dto_dir: "{{ remote_charts_dir }}/argo-events/webhook"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argo_events_webhook_helm_values | to_nice_yaml }}"
      when: argo_events_webhook_enabled | bool
      tags: [webhook]

    - name: "[argo-events-webhook] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argo-events-webhook"
        dto_release_name: "argo-events-webhook"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/webhook"
        dto_values_file_path: "{{ remote_charts_dir }}/argo-events/webhook/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argo-events/webhook-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argo-events/webhook-k"
        dto_patches_list: "{{ argo_events_webhook_kustomize_patches }}"
        dto_target_namespace: "{{ argo_events_namespace }}"
        dto_kustomize_apply_namespace_transform: true
      when: argo_events_webhook_enabled | bool
      tags: [webhook]

    - name: "[argo-events-webhook] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argo-events-webhook"
        dto_helm_command: >
          helm upgrade --install argo-events-webhook {{ remote_charts_dir }}/argo-events/webhook-k
          --namespace {{ argo_events_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argo_events_webhook_helm_timeout }}
      when: argo_events_webhook_enabled | bool
      tags: [webhook]

    - name: "[argo-events-webhook] Wait for rollout"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "argo-events-webhook"
        dto_rollout_namespace: "{{ argo_events_namespace }}"
        dto_rollout_timeout: "{{ argo_events_webhook_rollout_timeout }}"
        dto_rollout_resources_list: "{{ argo_events_webhook_rollout_resources }}"
      when: argo_events_webhook_enabled | bool
      tags: [webhook]

    # =========================================================================
    # STEP 5: RBAC (ServiceAccounts + Roles + bindings)
    # Идёт перед cr: Sensor ссылается на ServiceAccount по имени.
    # =========================================================================

    - name: "[argo-events-rbac] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argo-events-rbac"
        dto_chart_name: "rbac"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argo-events/rbac/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/rbac"
      tags: [rbac]

    - name: "[argo-events-rbac] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argo-events-rbac"
        dto_dir: "{{ remote_charts_dir }}/argo-events/rbac"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argo_events_rbac_helm_values | to_nice_yaml }}"
      tags: [rbac]

    - name: "[argo-events-rbac] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argo-events-rbac"
        dto_release_name: "argo-events-rbac"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/rbac"
        dto_values_file_path: "{{ remote_charts_dir }}/argo-events/rbac/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argo-events/rbac-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argo-events/rbac-k"
        dto_patches_list: "{{ argo_events_rbac_kustomize_patches }}"
        dto_target_namespace: "{{ argo_events_namespace }}"
      tags: [rbac]

    - name: "[argo-events-rbac] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argo-events-rbac"
        dto_helm_command: >
          helm upgrade --install argo-events-rbac {{ remote_charts_dir }}/argo-events/rbac-k
          --namespace {{ argo_events_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argo_events_rbac_helm_timeout }}
      tags: [rbac]

    # =========================================================================
    # STEP 6: CR (EventBus + EventSources + Sensors)
    # StatefulSet шины создаёт контроллер асинхронно после появления CR —
    # tasks-wait-rollout.yaml ретраит до его появления.
    # =========================================================================

    - name: "[argo-events-cr] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argo-events-cr"
        dto_chart_name: "cr"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argo-events/cr/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/cr"
      tags: [cr]

    - name: "[argo-events-cr] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argo-events-cr"
        dto_dir: "{{ remote_charts_dir }}/argo-events/cr"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argo_events_cr_helm_values | to_nice_yaml }}"
      tags: [cr]

    - name: "[argo-events-cr] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argo-events-cr"
        dto_release_name: "argo-events-cr"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/cr"
        dto_values_file_path: "{{ remote_charts_dir }}/argo-events/cr/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argo-events/cr-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argo-events/cr-k"
        dto_patches_list: "{{ argo_events_cr_kustomize_patches }}"
        dto_target_namespace: "{{ argo_events_namespace }}"
      tags: [cr]

    - name: "[argo-events-cr] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argo-events-cr"
        dto_helm_command: >
          helm upgrade --install argo-events-cr {{ remote_charts_dir }}/argo-events/cr-k
          --namespace {{ argo_events_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argo_events_cr_helm_timeout }}
      tags: [cr]

    - name: "[argo-events-cr] Wait for rollout"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "argo-events-cr"
        dto_rollout_namespace: "{{ argo_events_namespace }}"
        dto_rollout_timeout: "{{ argo_events_cr_rollout_timeout }}"
        dto_rollout_resources_list: "{{ argo_events_cr_rollout_resources }}"
      tags: [cr]

    # =========================================================================
    # STEP 7: POST (PodMonitors)
    # =========================================================================

    - name: "[argo-events-post] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argo-events-post"
        dto_chart_name: "post"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/argo-events/post/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/post"
      tags: [post]

    - name: "[argo-events-post] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argo-events-post"
        dto_dir: "{{ remote_charts_dir }}/argo-events/post"
        dto_filename: "values-override.yaml"
        dto_content: "{{ argo_events_post_helm_values | to_nice_yaml }}"
      tags: [post]

    - name: "[argo-events-post] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "argo-events-post"
        dto_release_name: "argo-events-post"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-events/post"
        dto_values_file_path: "{{ remote_charts_dir }}/argo-events/post/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argo-events/post-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argo-events/post-k"
        dto_patches_list: "{{ argo_events_post_kustomize_patches }}"
        dto_target_namespace: "{{ argo_events_namespace }}"
      tags: [post]

    - name: "[argo-events-post] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argo-events-post"
        dto_helm_command: >
          helm upgrade --install argo-events-post {{ remote_charts_dir }}/argo-events/post-k
          --namespace {{ argo_events_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argo_events_post_helm_timeout }}
      tags: [post]

    # =========================================================================
    # VERIFICATION
    # =========================================================================

    - name: "[argo-events-verify] Verify Helm releases"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-helm.yaml"
      vars:
        dto_label_name: "argo-events-verify"
        dto_helm_namespace: "{{ argo_events_namespace }}"
      tags: [always]

    - name: "[argo-events-verify] Show pods in {{ argo_events_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-pods.yaml"
      vars:
        dto_label_name: "argo-events-verify"
        dto_pods_namespace: "{{ argo_events_namespace }}"
      tags: [always]

    - name: "[argo-events-verify] Show NetworkPolicies in {{ argo_events_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-network-policy.yaml"
      vars:
        dto_label_name: "argo-events-verify"
        dto_np_namespace: "{{ argo_events_namespace }}"
      tags: [always]

    - name: "[argo-events-verify] Show info"
      debug:
        msg:
          - "=============================================="
          - "ARGO EVENTS INSTALLATION COMPLETE"
          - "=============================================="
          - "Version: {{ argo_events_version }}"
          - "EventBus: {{ argo_events_eventbus_name }} (JetStream)"
          - ""
          - "Собственного UI у argo-events нет."
          - "Состояние объектов:"
          - "  kubectl -n {{ argo_events_namespace }} get eventbus,eventsources,sensors"
          - "Статус шины:"
          - "  kubectl -n {{ argo_events_namespace }} get eventbus {{ argo_events_eventbus_name }} -o yaml"
          - "=============================================="
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [always]

    - name: "[argo-events-verify] Installation complete"
      debug:
        msg: "argo-events-pre + argo-events + argo-events-webhook + argo-events-rbac + argo-events-cr + argo-events-post: OK"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [always]
