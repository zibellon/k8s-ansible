# =============================================================================
# METRICS-SERVER RESTART
# Restarts metrics-server to apply configuration changes
# =============================================================================
# Usage:
#   ansible-playbook -i hosts-vars/ -i hosts-vars-override/ playbook-app/metrics-server-restart.yaml
#
# This playbook performs graceful rolling restart of all components:
#   - Deployments from metrics_server_rollout_resources (hosts-vars/metrics-server.yaml)
# =============================================================================

- name: Restart metrics-server components
  hosts: managers
  become: true
  gather_facts: false

  tasks:
    - name: "[metrics-server-restart-pre-check] Validate target"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-pre-check.yaml"
      vars:
        dto_label_name: "metrics-server-restart-pre-check"

    # -------------------------------------------------------------------------
    # PRE-CHECK: Verify metrics-server is installed
    # -------------------------------------------------------------------------

    - name: "[metrics-server-restart] Check if metrics-server namespace exists"
      command: kubectl get namespace {{ metrics_server_namespace }}
      register: _local_namespace_check
      changed_when: false
      failed_when: false
      delegate_to: "{{ master_manager_fact }}"
      run_once: true

    - name: "[metrics-server-restart] Fail if metrics-server namespace not found"
      fail:
        msg: "metrics-server namespace '{{ metrics_server_namespace }}' not found. Install metrics-server first."
      when: _local_namespace_check.rc != 0
      run_once: true

    - name: "[metrics-server-restart] Show pods in {{ metrics_server_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-pods.yaml"
      vars:
        dto_label_name: "metrics-server-restart"
        dto_pods_namespace: "{{ metrics_server_namespace }}"

    # -------------------------------------------------------------------------
    # RESTART DEPLOYMENTS
    # -------------------------------------------------------------------------

    - name: "[metrics-server-restart] Restart metrics-server Deployments"
      command: kubectl rollout restart {{ item }} -n {{ metrics_server_namespace }}
      loop: "{{ metrics_server_rollout_resources }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true

    # -------------------------------------------------------------------------
    # WAIT FOR ROLLOUTS TO COMPLETE
    # -------------------------------------------------------------------------

    - name: "[metrics-server-restart] Wait for Deployment rollouts"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "metrics-server-restart"
        dto_rollout_namespace: "{{ metrics_server_namespace }}"
        dto_rollout_timeout: "{{ metrics_server_restart_rollout_timeout }}"
        dto_rollout_resources_list: "{{ metrics_server_rollout_resources }}"

    # -------------------------------------------------------------------------
    # VERIFY RESTART
    # -------------------------------------------------------------------------

    - name: "[metrics-server-verify] Show pods in {{ metrics_server_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-pods.yaml"
      vars:
        dto_label_name: "metrics-server-verify"
        dto_pods_namespace: "{{ metrics_server_namespace }}"

    - name: "[metrics-server-verify] Restart completed"
      debug:
        msg:
          - "=== metrics-server Restart Complete ==="
          - "All components have been restarted and are ready."
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
