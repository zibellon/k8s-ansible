# =============================================================================
# Install Teleport (upstream Helm chart teleport-cluster + local charts)
# Steps:
#   1. teleport/pre:       NetworkPolicies + cert-manager Issuer + Certificate прокси
#   2. teleport:           upstream chart (standalone, SQLite + файлы аудита на PVC auth,
#                          proxy multiplex, TLS прокси = секрет из шага 1)
#   3. teleport/post:      Traefik IngressRouteTCP (tls.passthrough) + PodMonitor
#   4. teleport/cfg:       роли + пользователи Teleport (CR оператора) + RBAC Kubernetes
#                          для их групп; проверка до apply и сверка с Teleport после
#
# Usage:
#   ansible-playbook -i hosts-vars/ -i hosts-vars-override/<cluster>/ playbook-app/teleport-install.yaml
#   ansible-playbook ... --tags pre
#   ansible-playbook ... --tags install
#   ansible-playbook ... --tags post
#   ansible-playbook ... --tags cfg
#
# Prerequisites:
#   - Cilium, LINSTOR (storage class для PVC auth), cert-manager, Traefik,
#     mon-system --tags crds (CRD PodMonitor для post)
#   - DNS teleport_domain (DNS-only) -> bastion-proxy (prod) / IP ноды (без бастиона)
#
# NOTE: teleport_cluster_name is immutable after first deploy.
#       Do NOT change it after the cluster is initialized.
# =============================================================================

---
- name: Install Teleport (official Helm chart, SQLite backend)
  hosts: managers
  become: true
  gather_facts: false

  vars:
    # Имена локальных фактов — единая точка объявления (вынос из хардкода)
    _local_teleport_helm_chart_source_key: "_local_teleport_helm_chart_source"
    _local_teleport_cfg_violations_key: "_local_teleport_cfg_violations"
    _local_teleport_cfg_roles_diff_key: "_local_teleport_cfg_roles_diff"
    _local_teleport_cfg_users_diff_key: "_local_teleport_cfg_users_diff"

  tasks:
    - name: "[teleport-install] Assert component enabled"
      assert:
        that:
          - teleport_enabled | default(false) | bool
        fail_msg: "teleport is disabled (teleport_enabled=false). Set teleport_enabled: true in hosts-vars-override/ to install/configure it."
      run_once: true
      tags: [always]

    - name: "[teleport-pre-check] Validate target"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-pre-check.yaml"
      vars:
        dto_label_name: "teleport-pre-check"
      tags: [always]

    - name: "[teleport-pre-check] Forbid kube-system namespace"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-forbid-kube-system.yaml"
      vars:
        dto_label_name: "teleport-pre-check"
        dto_target_namespace: "{{ teleport_namespace }}"
      tags: [always]

    # =========================================================================
    # STEP 1: INSTALL PRE (NetworkPolicies, Issuer, Certificate)
    # =========================================================================

    - name: "[teleport-pre] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "teleport-pre"
        dto_chart_name: "pre"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/teleport/pre/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/teleport/pre"
      tags: [pre]

    - name: "[teleport-pre] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "teleport-pre"
        dto_dir: "{{ remote_charts_dir }}/teleport/pre"
        dto_filename: "values-override.yaml"
        dto_content: "{{ teleport_pre_helm_values | to_nice_yaml }}"
      tags: [pre]

    - name: "[teleport-pre] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "teleport-pre"
        dto_release_name: "teleport-pre"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/teleport/pre"
        dto_values_file_path: "{{ remote_charts_dir }}/teleport/pre/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/teleport/pre-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/teleport/pre-k"
        dto_patches_list: "{{ teleport_pre_kustomize_patches }}"
        dto_target_namespace: "{{ teleport_namespace }}"
      tags: [pre]

    - name: "[teleport-pre] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "teleport-pre"
        dto_helm_command: >
          helm upgrade --install teleport-pre {{ remote_charts_dir }}/teleport/pre-k
          --namespace {{ teleport_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ teleport_pre_helm_timeout }}
      tags: [pre]

    # =========================================================================
    # STEP 2: INSTALL TELEPORT
    # =========================================================================

    # Под прокси (и predeploy-хук чарта) монтирует TLS-секрет как обязательный
    # том: без выпущенного сертификата helm --atomic откатится по таймауту.
    - name: "[teleport-install] Wait for proxy TLS secret"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-secret.yaml"
      vars:
        dto_label_name: "teleport-install"
        dto_wait_secret_name: "{{ teleport_tls_secret_name }}"
        dto_wait_secret_namespace: "{{ teleport_namespace }}"
      tags: [install]

    - name: "[teleport-install] Add Helm repository"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-add-helm-repo.yaml"
      vars:
        dto_label_name: "teleport-install"
        dto_helm_is_oci: "{{ teleport_helm_is_oci }}"
        dto_helm_url: "{{ teleport_helm_url }}"
        dto_helm_chart_version: "{{ teleport_helm_chart_version }}"
        dto_helm_repo_name: "{{ teleport_helm_repo_name }}"
        dto_helm_chart_name: "{{ teleport_helm_chart_name }}"
        dto_helm_chart_source_res_fact_name: "{{ _local_teleport_helm_chart_source_key }}"
      tags: [install]

    - name: "[teleport-install] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "teleport-install"
        dto_dir: "{{ remote_charts_dir }}/teleport/install"
        dto_filename: "values-override.yaml"
        dto_content: "{{ teleport_helm_values | to_nice_yaml }}"
      tags: [install]

    - name: "[teleport-install] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "teleport-install"
        dto_helm_command: >
          helm upgrade --install teleport {{ lookup('vars', _local_teleport_helm_chart_source_key) }}
          --namespace {{ teleport_namespace }}
          --create-namespace
          --values {{ remote_charts_dir }}/teleport/install/values-override.yaml
          --version {{ teleport_helm_chart_version }}
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ teleport_install_helm_timeout }}
      tags: [install]

    # =========================================================================
    # WAIT FOR TELEPORT CRDs (rendered by the operator subchart of release teleport)
    # =========================================================================

    - name: "[teleport-install] Wait for CRDs"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-crds.yaml"
      vars:
        dto_label_name: "teleport-install"
        dto_crds_list: "{{ teleport_crds_list }}"
      tags: [install]

    - name: "[teleport-install] Wait for rollout to be ready"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "teleport-install"
        dto_rollout_namespace: "{{ teleport_namespace }}"
        dto_rollout_timeout: "{{ teleport_install_rollout_timeout }}"
        dto_rollout_resources_list: "{{ teleport_install_rollout_resources }}"
      tags: [install]

    # =========================================================================
    # STEP 3: INSTALL POST CHART (IngressRouteTCP passthrough + PodMonitor)
    # =========================================================================

    - name: "[teleport-post] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "teleport-post"
        dto_chart_name: "post"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/teleport/post/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/teleport/post"
      tags: [post]

    - name: "[teleport-post] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "teleport-post"
        dto_dir: "{{ remote_charts_dir }}/teleport/post"
        dto_filename: "values-override.yaml"
        dto_content: "{{ teleport_post_helm_values | to_nice_yaml }}"
      tags: [post]

    - name: "[teleport-post] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "teleport-post"
        dto_release_name: "teleport-post"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/teleport/post"
        dto_values_file_path: "{{ remote_charts_dir }}/teleport/post/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/teleport/post-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/teleport/post-k"
        dto_patches_list: "{{ teleport_post_kustomize_patches }}"
        dto_target_namespace: "{{ teleport_namespace }}"
      tags: [post]

    - name: "[teleport-post] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "teleport-post"
        dto_helm_command: >
          helm upgrade --install teleport-post {{ remote_charts_dir }}/teleport/post-k
          --namespace {{ teleport_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ teleport_post_helm_timeout }}
      tags: [post]

    # =========================================================================
    # STEP 4: CFG (роли и пользователи Teleport + RBAC Kubernetes)
    # =========================================================================

    # Шаблоны чарта рендерят списки без проверок: ошибки здесь молчаливые
    # (группа без биндинга — нет прав) или роняют helm (дубликат имени).
    - name: "[teleport-cfg] Compute cfg violations"
      set_fact:
        "{{ _local_teleport_cfg_violations_key }}": >-
          {{ teleport_cfg_helm_values.roles
             | teleport_cfg_verify(teleport_cfg_helm_values.users,
                                   teleport_cfg_helm_values.rbacClusterRoles,
                                   teleport_cfg_helm_values.rbacClusterRoleBindings,
                                   teleport_cfg_helm_values.rbacRoleBindings,
                                   teleport_namespace) }}
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[teleport-cfg] Assert no cfg violations"
      assert:
        that:
          - lookup('vars', _local_teleport_cfg_violations_key) | length == 0
        fail_msg: |
          [teleport-cfg] verify failed ({{ lookup('vars', _local_teleport_cfg_violations_key) | length }} violations):
          {% for v in lookup('vars', _local_teleport_cfg_violations_key) %}
            - {{ v }}
          {% endfor %}
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    # Зачем рестарт — см. teleport_cfg_operator_rollout_resources (hosts-vars/teleport.yaml).
    - name: "[teleport-cfg] Restart Teleport operator"
      command: kubectl rollout restart {{ item }} -n {{ teleport_namespace }}
      loop: "{{ teleport_cfg_operator_rollout_resources }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[teleport-cfg] Wait for operator rollout"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "teleport-cfg"
        dto_rollout_namespace: "{{ teleport_namespace }}"
        dto_rollout_timeout: "{{ teleport_cfg_operator_rollout_timeout }}"
        dto_rollout_resources_list: "{{ teleport_cfg_operator_rollout_resources }}"
      tags: [cfg]

    - name: "[teleport-cfg] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "teleport-cfg"
        dto_chart_name: "cfg"
        dto_chart_local_src: "{{ project_root }}/playbook-app/charts/teleport/cfg/"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/teleport/cfg"
      tags: [cfg]

    - name: "[teleport-cfg] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "teleport-cfg"
        dto_dir: "{{ remote_charts_dir }}/teleport/cfg"
        dto_filename: "values-override.yaml"
        dto_content: "{{ teleport_cfg_helm_values | to_nice_yaml }}"
      tags: [cfg]

    - name: "[teleport-cfg] Build kustomize artifact"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-template-kustomize-build.yaml"
      vars:
        dto_label_name: "teleport-cfg"
        dto_release_name: "teleport-cfg"
        dto_chart_remote_dest: "{{ remote_charts_dir }}/teleport/cfg"
        dto_values_file_path: "{{ remote_charts_dir }}/teleport/cfg/values-override.yaml"
        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/teleport/cfg-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/teleport/cfg-k"
        dto_patches_list: "{{ teleport_cfg_kustomize_patches }}"
        dto_target_namespace: "{{ teleport_namespace }}"
      tags: [cfg]

    - name: "[teleport-cfg] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "teleport-cfg"
        dto_helm_command: >
          helm upgrade --install teleport-cfg {{ remote_charts_dir }}/teleport/cfg-k
          --namespace {{ teleport_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ teleport_cfg_helm_timeout }}
      tags: [cfg]

    # helm --wait не ждёт оператора, статус CR без observedGeneration — истина только в Teleport.
    # unowned (объект создан вне IaC) оператор не применит никогда — ожидание прерывается сразу.
    - name: "[teleport-cfg] Wait for operator: roles in Teleport match teleport_cfg_roles"
      command: kubectl exec -n {{ teleport_namespace }} {{ teleport_tctl_exec_target }} -- tctl get roles --format=json
      register: _local_teleport_cfg_live_roles
      until: >-
        _local_teleport_cfg_live_roles.rc == 0 and
        ((_local_teleport_cfg_live_roles.stdout | from_json | teleport_cfg_reconcile_diff(teleport_cfg_helm_values.roles, teleport_cfg_unmanaged_ignore_roles)).pending | length == 0 or
         (_local_teleport_cfg_live_roles.stdout | from_json | teleport_cfg_reconcile_diff(teleport_cfg_helm_values.roles, teleport_cfg_unmanaged_ignore_roles)).unowned | length > 0)
      retries: "{{ teleport_cfg_reconcile_wait.retries }}"
      delay: "{{ teleport_cfg_reconcile_wait.delay }}"
      changed_when: false
      failed_when: false
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[teleport-cfg] Compute roles diff"
      set_fact:
        "{{ _local_teleport_cfg_roles_diff_key }}": "{{ (_local_teleport_cfg_live_roles.stdout | from_json | teleport_cfg_reconcile_diff(teleport_cfg_helm_values.roles, teleport_cfg_unmanaged_ignore_roles)) if _local_teleport_cfg_live_roles.rc == 0 else {} }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[teleport-cfg] Assert roles converged"
      assert:
        that:
          - _local_teleport_cfg_live_roles.rc == 0
          - lookup('vars', _local_teleport_cfg_roles_diff_key).pending | length == 0
        fail_msg: |
          [teleport-cfg] roles in Teleport do not match teleport_cfg_roles:
          {% if _local_teleport_cfg_live_roles.rc != 0 %}
            tctl failed: {{ _local_teleport_cfg_live_roles.stderr }}
          {% else %}
            missing (оператор не применил): {{ lookup('vars', _local_teleport_cfg_roles_diff_key).missing }}
            stale (удалены из vars, ещё не удалены оператором): {{ lookup('vars', _local_teleport_cfg_roles_diff_key).stale }}
            unowned (созданы вне IaC — оператор их не трогает, удалить вручную через tctl): {{ lookup('vars', _local_teleport_cfg_roles_diff_key).unowned }}
          {% endif %}
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[teleport-cfg] Wait for operator: users in Teleport match teleport_cfg_users"
      command: kubectl exec -n {{ teleport_namespace }} {{ teleport_tctl_exec_target }} -- tctl get users --format=json
      register: _local_teleport_cfg_live_users
      until: >-
        _local_teleport_cfg_live_users.rc == 0 and
        ((_local_teleport_cfg_live_users.stdout | from_json | teleport_cfg_reconcile_diff(teleport_cfg_helm_values.users, teleport_cfg_unmanaged_ignore_users)).pending | length == 0 or
         (_local_teleport_cfg_live_users.stdout | from_json | teleport_cfg_reconcile_diff(teleport_cfg_helm_values.users, teleport_cfg_unmanaged_ignore_users)).unowned | length > 0)
      retries: "{{ teleport_cfg_reconcile_wait.retries }}"
      delay: "{{ teleport_cfg_reconcile_wait.delay }}"
      changed_when: false
      failed_when: false
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[teleport-cfg] Compute users diff"
      set_fact:
        "{{ _local_teleport_cfg_users_diff_key }}": "{{ (_local_teleport_cfg_live_users.stdout | from_json | teleport_cfg_reconcile_diff(teleport_cfg_helm_values.users, teleport_cfg_unmanaged_ignore_users)) if _local_teleport_cfg_live_users.rc == 0 else {} }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[teleport-cfg] Assert users converged"
      assert:
        that:
          - _local_teleport_cfg_live_users.rc == 0
          - lookup('vars', _local_teleport_cfg_users_diff_key).pending | length == 0
        fail_msg: |
          [teleport-cfg] users in Teleport do not match teleport_cfg_users:
          {% if _local_teleport_cfg_live_users.rc != 0 %}
            tctl failed: {{ _local_teleport_cfg_live_users.stderr }}
          {% else %}
            missing (оператор не применил): {{ lookup('vars', _local_teleport_cfg_users_diff_key).missing }}
            stale (удалены из vars, ещё не удалены оператором): {{ lookup('vars', _local_teleport_cfg_users_diff_key).stale }}
            unowned (созданы вне IaC — оператор их не трогает, удалить вручную через tctl): {{ lookup('vars', _local_teleport_cfg_users_diff_key).unowned }}
          {% endif %}
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    - name: "[teleport-cfg] Show objects not managed by IaC"
      debug:
        msg:
          - "Roles not from IaC (UI/tctl): {{ lookup('vars', _local_teleport_cfg_roles_diff_key).unmanaged }}"
          - "Users not from IaC (UI/tctl): {{ lookup('vars', _local_teleport_cfg_users_diff_key).unmanaged }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [cfg]

    # =========================================================================
    # VERIFICATION
    # =========================================================================

    - name: "[teleport-verify] Verify Helm releases"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-helm.yaml"
      vars:
        dto_helm_namespace: "{{ teleport_namespace }}"
        dto_label_name: "teleport-verify"
      tags: [always]

    - name: "[teleport-verify] Show pods in {{ teleport_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-pods.yaml"
      vars:
        dto_label_name: "teleport-verify"
        dto_pods_namespace: "{{ teleport_namespace }}"
      tags: [always]

    - name: "[teleport-verify] Show NetworkPolicies in {{ teleport_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-network-policy.yaml"
      vars:
        dto_label_name: "teleport-verify"
        dto_np_namespace: "{{ teleport_namespace }}"
      tags: [always]

    - name: "[teleport-verify] Show access info"
      debug:
        msg:
          - "=============================================="
          - "TELEPORT INSTALLATION COMPLETE"
          - "=============================================="
          - "Teleport UI:     https://{{ teleport_domain }}"
          - "tsh / kubectl:   tsh login --proxy={{ teleport_web_public_addr }} --user=<user>"
          - "                 tsh kube login {{ teleport_kube_cluster_name }}"
          - ""
          - "Invite link (once per user: {{ teleport_cfg_helm_values.users | map(attribute='name') | join(', ') }}):"
          - "  kubectl exec -n {{ teleport_namespace }} {{ teleport_tctl_exec_target }} -- tctl users reset <user>"
          - ""
          - "IMPORTANT: teleport_cluster_name is immutable."
          - "  Do NOT change it after first install."
          - "=============================================="
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [always]

    - name: "[teleport-verify] Installation complete"
      debug:
        msg: "teleport-pre + teleport + teleport-post + teleport-cfg: OK"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [always]
