# =============================================================================
# OUTLINE RESTART
# Restarts outline components to apply configuration changes
# =============================================================================
# Usage:
#   ansible-playbook -i hosts-vars/ -i hosts-vars-override/ playbook-app/outline-restart.yaml
#
# Three stages mirroring install (postgresql, redis, then app), each tagged so
# --tags <stage> restarts only that stage. Scaffolding runs under [always].
# =============================================================================

- name: Restart outline components
  hosts: managers
  become: true
  gather_facts: false

  tasks:
    - name: "[outline-restart-pre-check] Validate target"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-pre-check.yaml"
      vars:
        dto_label_name: "outline-restart-pre-check"
      tags: [always]

    - name: "[outline-restart] Check if outline namespace exists"
      command: kubectl get namespace {{ outline_namespace }}
      register: _local_namespace_check
      changed_when: false
      failed_when: false
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [always]

    - name: "[outline-restart] Fail if outline namespace not found"
      fail:
        msg: "outline namespace '{{ outline_namespace }}' not found. Install outline first."
      when: _local_namespace_check.rc != 0
      run_once: true
      tags: [always]

    - name: "[outline-restart] Show pods in {{ outline_namespace }} (before restart)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-pods.yaml"
      vars:
        dto_label_name: "outline-restart"
        dto_pods_namespace: "{{ outline_namespace }}"
      tags: [always]

    # -------------------------------------------------------------------------
    # RESTART postgresql (mirrors postgresql install stage)
    # -------------------------------------------------------------------------

    - name: "[outline-restart-postgresql] Restart outline postgresql"
      command: kubectl rollout restart {{ item }} -n {{ outline_namespace }}
      loop: "{{ outline_postgresql_rollout_resources }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [postgresql]

    - name: "[outline-restart-postgresql] Wait for postgresql rollout"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "outline-restart-postgresql"
        dto_rollout_namespace: "{{ outline_namespace }}"
        dto_rollout_timeout: "{{ outline_postgresql_restart_rollout_timeout }}"
        dto_rollout_resources_list: "{{ outline_postgresql_rollout_resources }}"
      tags: [postgresql]

    # -------------------------------------------------------------------------
    # RESTART redis (mirrors redis install stage)
    # -------------------------------------------------------------------------

    - name: "[outline-restart-redis] Restart outline redis"
      command: kubectl rollout restart {{ item }} -n {{ outline_namespace }}
      loop: "{{ outline_redis_rollout_resources }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [redis]

    - name: "[outline-restart-redis] Wait for redis rollout"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "outline-restart-redis"
        dto_rollout_namespace: "{{ outline_namespace }}"
        dto_rollout_timeout: "{{ outline_redis_restart_rollout_timeout }}"
        dto_rollout_resources_list: "{{ outline_redis_rollout_resources }}"
      tags: [redis]

    # -------------------------------------------------------------------------
    # RESTART app (mirrors install stage)
    # -------------------------------------------------------------------------

    - name: "[outline-restart-install] Restart outline app"
      command: kubectl rollout restart {{ item }} -n {{ outline_namespace }}
      loop: "{{ outline_install_rollout_resources }}"
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [install]

    - name: "[outline-restart-install] Wait for app rollout"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-wait-rollout.yaml"
      vars:
        dto_label_name: "outline-restart-install"
        dto_rollout_namespace: "{{ outline_namespace }}"
        dto_rollout_timeout: "{{ outline_install_restart_rollout_timeout }}"
        dto_rollout_resources_list: "{{ outline_install_rollout_resources }}"
      tags: [install]

    # -------------------------------------------------------------------------
    # VERIFY RESTART
    # -------------------------------------------------------------------------

    - name: "[outline-verify] Show pods in {{ outline_namespace }} (after restart)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-pods.yaml"
      vars:
        dto_label_name: "outline-verify"
        dto_pods_namespace: "{{ outline_namespace }}"
      tags: [always]

    - name: "[outline-verify] Restart completed"
      debug:
        msg:
          - "=== outline Restart Complete ==="
          - "Restarted components have been restarted and are ready."
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [always]
