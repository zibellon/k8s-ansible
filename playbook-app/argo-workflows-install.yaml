        dto_chart_remote_dest: "{{ remote_charts_dir }}/argo-workflows/cfg"
      tags: [cfg]

    - name: "[argo-workflows-cfg] Create values file"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-helm-values.yaml"
      vars:
        dto_label_name: "argo-workflows-cfg"
        dto_dir: "{{ remote_charts_dir }}/argo-workflows/cfg"
        dto_filename: "values-override.yaml"
