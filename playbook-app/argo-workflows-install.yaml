    - name: "[argo-workflows-verify] Show info"
      debug:
        msg:
          - "=============================================="
          - "ARGO WORKFLOWS INSTALLATION COMPLETE"
          - "=============================================="
          - "UI: https://{{ argo_workflows_ui_domain }}"
          - "Auth mode: {{ argo_workflows_server_auth_mode }}"
          - "CR namespace: {{ argo_workflows_cr_namespace }}"
          - ""
          - "Состояние объектов:"
          - "  kubectl -n {{ argo_workflows_cr_namespace }} get workflows,workflowtemplates,cronworkflows"
          - "=============================================="
      delegate_to: "{{ master_manager_fact }}"
      run_once: true
      tags: [always]

    - name: "[argo-workflows-verify] Installation complete"
      debug:
        msg: "argo-workflows-pre + argo-workflows-pre-cfg + argo-workflows + argo-workflows-post + argo-workflows-cfg: OK"
