        dto_kustomize_tmp_dir: "{{ remote_charts_dir }}/argo-workflows/cfg-k-tmp"
        dto_kustomize_final_dir: "{{ remote_charts_dir }}/argo-workflows/cfg-k"
        dto_patches_list: "{{ argo_workflows_cfg_kustomize_patches }}"
        dto_target_namespace: "{{ argo_workflows_namespace }}"
      tags: [cfg]

    - name: "[argo-workflows-cfg] Install via Helm (async)"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-helm-upgrade-async.yaml"
      vars:
        dto_label_name: "argo-workflows-cfg"
        dto_helm_command: >
          helm upgrade --install argo-workflows-cfg {{ remote_charts_dir }}/argo-workflows/cfg-k
          --namespace {{ argo_workflows_namespace }}
          --create-namespace
          --cleanup-on-fail
          --atomic
          --wait
          --wait-for-jobs
          --timeout {{ argo_workflows_cfg_helm_timeout }}
      tags: [cfg]

    # =========================================================================
    # VERIFICATION
    # =========================================================================

    - name: "[argo-workflows-verify] Verify Helm releases"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-helm.yaml"
      vars:
        dto_label_name: "argo-workflows-verify"
        dto_helm_namespace: "{{ argo_workflows_namespace }}"
      tags: [always]

    - name: "[argo-workflows-verify] Show pods in {{ argo_workflows_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-pods.yaml"
      vars:
        dto_label_name: "argo-workflows-verify"
        dto_pods_namespace: "{{ argo_workflows_namespace }}"
      tags: [always]

    - name: "[argo-workflows-verify] Show NetworkPolicies in {{ argo_workflows_namespace }}"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-k8s-list-network-policy.yaml"
      vars:
