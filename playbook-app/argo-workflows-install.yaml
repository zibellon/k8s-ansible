      tags: [post]

    # =========================================================================
    # STEP 6: CFG (executor + SSO RBAC + операторский RBAC + прикладные CR)
    # Всё, что не контроллер и не сервер. Идёт последней: SSO-ServiceAccount'ы
    # нужны только для входа в UI, а WorkflowTemplate и CronWorkflow ссылаются
    # на SA executor'а. Wait for rollout нет: рабочих нагрузок стадия не
    # порождает.
    # =========================================================================

    - name: "[argo-workflows-cfg] Copy chart to remote"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-copy-chart.yaml"
      vars:
        dto_label_name: "argo-workflows-cfg"
