---
# Vault namespace
namespace: ""

# DNS domain for internal service resolution
clusterDomain: ""

# Traefik namespace for ingress
traefik:
  namespace: ""
  instanceName: ""

# External Secrets namespace
externalSecrets:
  namespace: ""

# Vault ESO settings
eso:
  vaultServerUrl: ""
  saName: ""
  roleName: ""
  secretStoreName: ""
  kvEnginePath: ""
  secrets: []

# cert-manager Issuer — плоский объект {enabled, name, spec}
issuer:
  enabled: false
  name: ""
  spec: {}

# ESO resources global config
esoResourcesConfig:
  secretStoreRefreshInterval: 60
  externalSecretRefreshInterval: "1m"
  externalSecretRefreshPolicy: "Periodic"

# =============================================================================
# Common ports (used by NetworkPolicy templates)
# =============================================================================
dns:
  port: 53
apiserver:
  port: 6443
acmeSolver:
  port: 8089
external:
  httpPort: 80
  httpsPort: 443

# =============================================================================
# vault component ports
# =============================================================================
vault:
  apiPort: 8200  # Vault API + metrics (/v1/sys/metrics)

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
