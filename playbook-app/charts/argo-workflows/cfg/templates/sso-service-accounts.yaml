# =============================================================================
# SSO SERVICE ACCOUNTS (вход в UI через OIDC)
#   Каждый элемент — одна учётка доступа: ServiceAccount с аннотацией
#   workflows.argoproj.io/rbac-rule, его token-Secret и по привязке на каждый
#   элемент roles — {roleType, roleName, bindingType}, как accounts у Kargo.
#   Сами роли здесь НЕ создаются — их объявляют операторские списки rbacRoles
#   / rbacClusterRoles, а элемент только ссылается на них и выбирает привязку.
#   Все три поля обязательны:
#     roleType: Role, bindingType: RoleBinding        — Role в managed
#                                                       namespace;
#     roleType: ClusterRole, bindingType: RoleBinding — ClusterRole, права
#                                                       только внутри managed
#                                                       namespace;
#     roleType: ClusterRole,
#       bindingType: ClusterRoleBinding               — ClusterRole на весь
#                                                       кластер (например,
#                                                       чтение
#                                                       clusterworkflowtemplates
#                                                       для страницы UI).
#   Пропущенный bindingType и Role + ClusterRoleBinding — ошибка рендера.
#   Имя привязки — <name>-<roleName> (RoleBinding в managed namespace,
#   ClusterRoleBinding — cluster-scoped).
#   ⚠️ ClusterRoleBinding отдаёт права роли на ВЕСЬ кластер не только
#   пользователю: SA лежит в managed namespace, и его права получает каждый,
#   кто может создать там Workflow (под от этого SA) или прочитать его
#   token-Secret. Привязывать так только безопасные роли на чтение.
#
#   На КАЖДЫЙ запрос argo-server перебирает SA по убыванию precedence, берёт
#   первый, чьё правило истинно для claims сессии, и выполняет запрос токеном
#   этого SA — права пользователя = права ролей (Role/ClusterRole),
#   привязанных к SA. Ни одно правило не подошло — 403. Правка правила или
#   списка ролей действует на новые запросы сразу, без рестарта и без выхода
#   пользователя (уже открытые потоки UI — нет, см. ⚠️ Отзыв ниже).
#
#   Почему managed namespace: argo-server ищет SSO-SA (ssoNamespace) в
#   managed namespace, а не в своём, — и informer SA смотрит только туда.
#
#   Почему правило строит шаблон: expr компилирует правило в строгом режиме,
#   и голое имя отсутствующего claim'а — ошибка компиляции, которая обрывает
#   перебор: 403 получают все, кому не подошло правило выше по precedence,
#   даже если подошло бы правило ниже. get($env, '...') на отсутствующем
#   claim'е даёт false, а не ошибку. Пустой или забытый preferredUsernames
#   рендерится как [] — правило просто ложно (а не `in null`, которое не
#   компилируется). Не-список (строка) — ошибка рендера: `in "строка"` тоже
#   не компилируется. roles обязан быть списком {roleType, roleName,
#   bindingType} — все три обязательны; roleType — Role или ClusterRole,
#   bindingType — RoleBinding или ClusterRoleBinding (последний — только с
#   ClusterRole); иначе ошибка рендера. Role обязана быть объявлена
#   в rbacRoles этого namespace — опечатка в имени иначе дала бы молчаливый 403
#   (ClusterRole не проверяется). Пустой или пропущенный roles — учётка без
#   прав: правило совпадает, любой запрос 403.
#   ⚠️ Встроенные ClusterRole view/edit/admin не дают ни одного права на
#   объекты Argo Workflows: агрегирующие роли argo-aggregate-to-* есть только
#   в cluster-install апстрима, в namespace-install их нет. Учётка на view —
#   тот же молчаливый 403. Нужна своя Role (rbacRoles) или ClusterRole
#   (rbacClusterRoles).
#   ⚠️ Встроенные ClusterRole admin/edit дают доступ к Secret'ам namespace — с
#   ними SSO-пользователь прочитал бы token-Secret более сильной учётки.
#
#   Почему legacy token-Secret: выбрав SA, argo-server ходит в Kubernetes API
#   ТОКЕНОМ ЭТОГО SA, а берёт его из Secret'а (TokenRequest не использует).
#   Имя ищется по порядку: sa.secrets[0], аннотация SA
#   workflows.argoproj.io/service-account-token.name, затем
#   <sa>.service-account-token — у SA этого шаблона первых двух нет, поэтому
#   срабатывает третье. С Kubernetes 1.24 такие Secret'ы сами не
#   создаются: шаблон кладёт пустую оболочку, token-controller Kubernetes
#   дописывает в неё token. Без Secret'а вход проходит, но любой запрос — 403.
#   ⚠️ У token-Secret НИКОГДА нет data: — его заполняет token-controller;
#   helm не должен владеть data.
#
#   ⚠️ Право создавать Workflow в managed namespace = права администратора
#   этого namespace: под Workflow'а может работать от любого его SA и
#   примонтировать любой его Secret, включая token-Secret SSO-админа.
#   ⚠️ Отзыв: новые запросы получают 403 сразу, но открытые потоки UI,
#   сама сессия (до sessionExpiry) и скопированные токены живут дальше.
#   Полная процедура — ⚠️ ОТЗЫВ ДОСТУПА у argo_workflows_sso_service_accounts
#   в hosts-vars/argo-workflows.yaml.
# =============================================================================
{{- $nsRoles := list }}
{{- range .Values.rbacRoles }}
{{- if eq (toString (.namespace | default $.Values.managedNamespace)) (toString $.Values.managedNamespace) }}
{{- $nsRoles = append $nsRoles .name }}
{{- end }}
{{- end }}
{{- range $sa := .Values.ssoServiceAccounts }}
{{- $users := $sa.preferredUsernames | default list }}
{{- if not (kindIs "slice" $users) }}
{{- fail (printf "ssoServiceAccounts[%s].preferredUsernames must be a list" $sa.name) }}
{{- end }}
{{- $roles := $sa.roles | default list }}
{{- if not (kindIs "slice" $roles) }}
{{- fail (printf "ssoServiceAccounts[%s].roles must be a list of {roleType, roleName, bindingType}" $sa.name) }}
{{- end }}
{{- range $role := $roles }}
{{- if not (and (kindIs "map" $role) (has $role.roleType (list "Role" "ClusterRole")) $role.roleName) }}
{{- fail (printf "ssoServiceAccounts[%s].roles: each element must be {roleType: Role|ClusterRole, roleName: <name>, bindingType: RoleBinding|ClusterRoleBinding}" $sa.name) }}
{{- end }}
{{- $bindingType := $role.bindingType }}
{{- if not (has $bindingType (list "RoleBinding" "ClusterRoleBinding")) }}
{{- fail (printf "ssoServiceAccounts[%s].roles: %s — bindingType is required and must be RoleBinding or ClusterRoleBinding" $sa.name $role.roleName) }}
{{- end }}
{{- if and (eq $bindingType "ClusterRoleBinding") (ne $role.roleType "ClusterRole") }}
{{- fail (printf "ssoServiceAccounts[%s].roles: %s — bindingType ClusterRoleBinding requires roleType ClusterRole" $sa.name $role.roleName) }}
{{- end }}
{{- if and (eq $role.roleType "Role") (not (has $role.roleName $nsRoles)) }}
{{- fail (printf "ssoServiceAccounts[%s].roles: Role %s is not declared in rbacRoles for namespace %s" $sa.name $role.roleName $.Values.managedNamespace) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $.Values.managedNamespace }}
  annotations:
    workflows.argoproj.io/rbac-rule: {{ printf "get($env, 'preferred_username') in %s" (toJson $users) | quote }}
    workflows.argoproj.io/rbac-rule-precedence: {{ $sa.precedence | default 0 | toString | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sa.name }}.service-account-token
  namespace: {{ $.Values.managedNamespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $sa.name }}
type: kubernetes.io/service-account-token
{{- range $role := $roles }}
{{- $bindingType := $role.bindingType }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $bindingType }}
metadata:
  name: {{ $sa.name }}-{{ $role.roleName }}
  {{- if eq $bindingType "RoleBinding" }}
  namespace: {{ $.Values.managedNamespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $role.roleType }}
  name: {{ $role.roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa.name }}
    namespace: {{ $.Values.managedNamespace }}
{{- end }}
{{- end }}
