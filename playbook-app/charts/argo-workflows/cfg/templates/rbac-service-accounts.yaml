# =============================================================================
# ARGO WORKFLOWS SERVICE ACCOUNTS
#   Носители прав для подов Workflow'ов, которым мало executor'а (например,
#   resource-шаблоны, создающие объекты). Под указывается в Workflow через
#   spec.serviceAccountName. Namespace по умолчанию — managed namespace: SA
#   пода обязан жить в namespace самого Workflow'а.
# =============================================================================
{{- range $sa := .Values.rbacServiceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $sa.namespace | default $.Values.managedNamespace }}
  {{- with $sa.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
