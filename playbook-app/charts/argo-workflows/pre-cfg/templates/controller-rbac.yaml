# =============================================================================
# ПРАВА КОНТРОЛЛЕРА В ЧУЖОМ NAMESPACE
#   Рендерится всегда: контроллер всегда направлен в cr namespace через
#   --managed-namespace (env ARGO_MANAGED_NAMESPACE). Вендоренный Role
#   argo-role покрывает только его собственный namespace (lease, ConfigMap).
#
#   Объект ОБЯЗАТЕЛЬНЫЙ, поэтому отдельным шаблоном, а не элементом
#   операторских списков rbacRoles/rbacRoleBindings стадии cfg. Без прав
#   контроллер уходит в CrashLoopBackOff сразу после захвата lease:
#   initManagers получает 403 на LIST workflows, и это fatal. С НЕПОЛНЫМИ
#   правами хуже — WaitForCacheSync висит без таймаута, readinessProbe у
#   контроллера нет, а /healthz, пока нет поданных Workflow, отвечает 200,
#   поэтому helm --wait считает установку успешной, хотя ни один Workflow не
#   обрабатывается. Как только поданный Workflow ждёт без прогресса дольше
#   5 минут, /healthz отдаёт 500 и liveness перезапускает контроллер по кругу.
#   Потерять такой объект правкой override нельзя.
#
#   ⚠️ Объект ложится в ЧУЖОЙ namespace (crNamespace.name), а субъект живёт в
#   СВОЁМ (namespace) — это разные значения, и путать их нельзя: биндинг
#   указал бы на несуществующий SA, а для контроллера это то же самое, что
#   прав нет вовсе.
# =============================================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.controllerRbac.roleName }}
  namespace: {{ .Values.crNamespace.name }}
rules:
{{ toYaml .Values.controllerRbac.rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.controllerRbac.roleBindingName }}
  namespace: {{ .Values.crNamespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.controllerRbac.roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controllerRbac.saName }}
    namespace: {{ .Values.namespace }}
