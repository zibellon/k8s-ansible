---
# Namespace компонента. Здесь живут SA контроллера и argo-server — субъекты
# биндингов ниже.
namespace: "argo-workflows"

# CR namespace и обязательные права контроллера и argo-server в нём.
# Рендерятся ВСЕГДА: режима «всё в одном namespace» у компонента нет, пустое
# crNamespace.name или его совпадение с namespace — ошибка рендера.
# Подробности — в шапках templates/cr-namespace.yaml,
# templates/controller-rbac.yaml и templates/server-rbac.yaml.
# labels и annotations — метки и аннотации объекта Namespace. Опциональны:
# пустые не рендерятся.
crNamespace:
  name: "argo-workflows-cfg"
  labels: {}
  annotations: {}

controllerRbac:
  saName: "argo"
  roleName: "argo-workflows-controller"
  roleBindingName: "argo-workflows-controller"
  rules: []

serverRbac:
  saName: "argo-server"
  roleName: "argo-workflows-server"
  roleBindingName: "argo-workflows-server"
  rules: []

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
