# =============================================================================
# PODMONITOR FOR ARGO WORKFLOWS (Prometheus Operator)
#   Метрики workflow-controller с порта `metrics` (:9090, /metrics). Service
#   для метрик апстрим не создаёт, поэтому монитор — PodMonitor.
#
#   /metrics по умолчанию отдаётся по HTTPS с self-signed сертификатом,
#   который контроллер генерирует в памяти при старте, — отсюда scheme https
#   и insecureSkipVerify.
#
#   Реальные метрики отдаёт только лидер: не-лидер на том же порту отвечает
#   пустым 200, поэтому снимать все реплики безопасно.
#
#   argo-server не снимаем: его /metrics живёт на порту UI (:2746) и закрыт
#   аутентификацией.
# =============================================================================

{{- if .Values.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argo-workflows-controller
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: workflow-controller
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      interval: {{ .Values.podMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.podMonitor.scrapeTimeout | quote }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  selector:
    matchLabels:
      app: workflow-controller
{{- end }}
