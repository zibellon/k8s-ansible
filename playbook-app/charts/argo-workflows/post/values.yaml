---
# Namespace for resources (namespace argo-server и контроллера)
namespace: "argo-workflows"

# Ingress config (Traefik) — UI и API argo-server на одном домене.
ingressConfig:
  enabled: false
  domain: ""
  ingressClass: ""
  tlsEnabled: false
  tlsSecretName: ""
  vpnOnlyEnabled: false
  vpnIngressMiddlewares: ""

# cert-manager Certificate — плоский объект {enabled, name, spec}
certificateConfig:
  enabled: false
  name: ""
  spec: {}

traefik:
  namespace: ""
  entryPoints:
    web: ""
    websecure: ""

# Service argo-server (upstream install phase). Traefik ходит на него по
# HTTP: TLS argo-server выключен патчем install (ARGO_SECURE=false).
server:
  port: 2746

# PodMonitor контроллера для Prometheus (mon-system). Service для метрик
# апстрим не создаёт, поэтому метрики снимаются с подов напрямую по имени
# порта `metrics` (:9090).
podMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "15s"
  labels: {}

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
