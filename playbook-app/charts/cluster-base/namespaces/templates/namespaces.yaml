# =============================================================================
# CLUSTER NAMESPACES
#   Namespace'ы кластера. Элемент рендерится как есть — labels и annotations
#   берутся из него. Связей с другими объектами нет: чарт не знает, кто в этих
#   namespace'ах будет работать, права выдаются отдельно (cluster-base/rbac).
# =============================================================================
{{- range $ns := .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns.name }}
  {{- with $ns.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $ns.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
