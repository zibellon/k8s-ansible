# =============================================================================
# CLUSTER RBAC — ROLE BINDINGS (namespaced)
#   roleRef может указывать и на Role, и на ClusterRole — шаблон это не
#   проверяет. RoleBinding на ClusterRole ограничивает её права своим
#   namespace: это основной способ выдать доступ в конкретный namespace.
# =============================================================================
{{- range $rb := .Values.rbacRoleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rb.name }}
  namespace: {{ $rb.namespace }}
  {{- with $rb.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $rb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
{{ toYaml $rb.roleRef | indent 2 }}
subjects:
{{ toYaml $rb.subjects | indent 2 }}
{{- end }}
