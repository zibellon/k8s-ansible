---
namespace: "teleport"

# Роли (TeleportRoleV8) и пользователи (TeleportUser) — {name, labels?, annotations?, spec}.
# CR живут в namespace оператора; оператор применяет их в Teleport.
roles: []
users: []

# RBAC Kubernetes для групп из kubernetes_groups ролей. Элемент несёт полную
# спецификацию объекта; шаблон рендерит его как есть. Ключа namespace для
# RoleBinding в values нет: каждый элемент несёт свой (объекты уезжают в чужие namespace).
#   ClusterRole:         {name, labels?, annotations?, rules}
#   ClusterRoleBinding:  {name, labels?, annotations?, roleRef, subjects}
#   RoleBinding:         {name, namespace, labels?, annotations?, roleRef, subjects}
rbacClusterRoles: []
rbacClusterRoleBindings: []
rbacRoleBindings: []

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
