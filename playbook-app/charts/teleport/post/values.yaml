---
# Namespace
namespace: "teleport"

# Traefik IngressRouteTCP (tls.passthrough) — Teleport терминирует TLS сам.
# Правило = HostSNI(точные имена) || HostSNIRegexp(regexp); catch-all HostSNI(`*`) не используется.
ingressRouteTcpConfig:
  enabled: false
  ingressClass: ""
  entryPoint: ""
  hostSNIs: []
  hostSNIRegexps: []
  proxyProtocolVersion: 2

# Service прокси Teleport (рендерит upstream-чарт релиза teleport)
service:
  name: ""
  port: 443

# PodMonitor auth + proxy (порт diag)
podMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "15s"
  labels: {}
  selector: {}

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
