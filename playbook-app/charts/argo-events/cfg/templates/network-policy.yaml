# =============================================================================
# NETWORK POLICIES ПРИКЛАДНОГО NAMESPACE ARGO EVENTS
#
# Namespace совместного владения: часть объектов везёт ansible, часть — ArgoCD
# из git-ops. Политики по умолчанию за ansible, потому что namespace не должен
# существовать без deny-all ни секунды. Если оператор решит возить их из
# git-ops — выключает networkPolicies.enabled и берёт имена на себя.
#
# Между этим namespace и namespace контроллера трафика НЕТ ни в одну сторону:
# контроллер управляет подами только через apiserver, а адрес шины дочерний
# под получает в переменной окружения, проставленной при создании Deployment.
# Поэтому cross-namespace пар «egress отсюда + ingress туда» здесь нет.
# =============================================================================
{{- if .Values.networkPolicies.enabled }}

---
# Default deny all traffic in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# DNS for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: {{ .Values.dns.port }}
        - protocol: TCP
          port: {{ .Values.dns.port }}

---
# Весь трафик внутри namespace. ОБЯЗАТЕЛЬНА: через неё EventSource и Sensor
# ходят к NATS, а реплики JetStream собирают кворум между собой. Состав и
# порты дочерних подов задаются прикладными CR и заранее неизвестны, поэтому
# внутренний трафик открывается целиком.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-traffic
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}

---
# Исходящий к kube-apiserver для ВСЕХ подов namespace: EventSource типа
# resource держит на нём watch, Sensor с триггером k8s создаёт через него
# объекты. Отдельной политикой, потому что порт apiserver'а не покрывается
# правилом на 443/80 ниже.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: {{ .Values.apiserver.port }}

---
# Исходящий HTTP/HTTPS для ВСЕХ подов namespace.
#
# Селектор по метке здесь невозможен: триггеры типа k8s создают собственные
# объекты (например, Job с curl для отправки уведомления), и их поды не несут
# ни controller=eventsource-controller, ни controller=sensor-controller.
# Состав таких подов задаётся в прикладных CR, которые живут в git-ops, —
# селектор пришлось бы согласовывать между двумя репозиториями.
#
# Симптом при отсутствии политики невнятный: под не падает с отказом, а висит
# до таймаута клиента и уходит в backoffLimit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: {{ .Values.external.httpsPort }}
        - protocol: TCP
          port: {{ .Values.external.httpPort }}

---
# Allow Prometheus (mon-system) to scrape metrics.
# Port-only ingress (matches stakater-reloader allow-for-monitoring convention).
# Один порт покрывает EventSource, Sensor и exporter шины.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-for-monitoring
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.argoEvents.metricsPort }}
{{- end }}
