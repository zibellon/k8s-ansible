# =============================================================================
# ARGO EVENTS ROLES (namespaced)
#   Ограничивают права одним namespace. Типовой случай — EventSource типа
#   resource, который наблюдает объекты в namespace приложения.
#   Namespace берётся из элемента, а не из values: он может отличаться от
#   namespace компонента.
# =============================================================================
{{- range $role := .Values.rbacRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $role.name }}
  namespace: {{ $role.namespace }}
rules:
{{ toYaml $role.rules | indent 2 }}
{{- end }}
