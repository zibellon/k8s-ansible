# =============================================================================
# ПРАВА КОНТРОЛЛЕРА В ЭТОМ NAMESPACE
#   Контроллер живёт в namespace компонента, а реконсайлит CR здесь
#   (--namespaced --managed-namespace). Апстримный namespace-install.yaml
#   кладёт Role только рядом с контроллером — он молча предполагает, что
#   контроллер и CR в одном namespace. Для разнесённой схемы нужен второй
#   комплект, и это он.
#
#   Объект ОБЯЗАТЕЛЬНЫЙ: без него контроллер не видит здесь ничего и сыплет
#   Forbidden. Поэтому он отдельным шаблоном, а не элементом операторских
#   списков rbacRoles/rbacRoleBindings — оттуда его легко потерять правкой
#   override.
#
#   ⚠️ У фазы НЕ должен включаться kustomize namespace-transform: он
#   переписывает subjects[].namespace, и права уехали бы не тому SA.
# =============================================================================
{{- if .Values.controllerRbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.controllerRbac.roleName }}
  namespace: {{ .Values.namespace }}
rules:
{{ toYaml .Values.controllerRbac.rules | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.controllerRbac.roleBindingName }}
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.controllerRbac.roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controllerRbac.saName }}
    namespace: {{ .Values.controllerNamespace }}
{{- end }}
