# =============================================================================
# SENSORS
#   Каждый элемент принимает полный spec из inventory. Контроллер по каждому
#   CR создаёт Deployment. Триггерам k8s и argoWorkflow нужен ServiceAccount
#   с правами — он задаётся в spec.template.serviceAccountName и создаётся
#   фазой rbac.
# =============================================================================

{{- range .Values.sensors }}
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: {{ .name }}
  namespace: "{{ $.Values.namespace }}"
  {{- if .labels }}
  labels:
    {{- toYaml .labels | nindent 4 }}
  {{- end }}
  {{- if .annotations }}
  annotations:
    {{- toYaml .annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
