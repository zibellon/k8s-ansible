# =============================================================================
# EVENTBUSES
#   Шина, через которую EventSource доставляет события Sensor'ам. Контроллер
#   по каждому CR создаёт StatefulSet eventbus-<name>-js, его Service и секреты.
#
#   Список, а не одиночный объект: продукт допускает несколько шин в одном
#   namespace — EventSource и Sensor выбирают свою по имени через
#   spec.eventBusName (дефолт "default"), и ищут её в СВОЁМ namespace.
# =============================================================================

{{- range .Values.eventBuses }}
---
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: {{ .name }}
  namespace: "{{ $.Values.namespace }}"
  {{- if .labels }}
  labels:
    {{- toYaml .labels | nindent 4 }}
  {{- end }}
  {{- if .annotations }}
  annotations:
    {{- toYaml .annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
