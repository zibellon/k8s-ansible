# =============================================================================
# EVENTBUS (raw spec, rendered as-is from inventory)
#   Шина, через которую EventSource доставляет события Sensor'ам. Контроллер
#   по этому CR создаёт StatefulSet eventbus-<name>-js, его Service и секреты.
# =============================================================================

{{- if .Values.eventBus.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: {{ .Values.eventBus.name }}
  namespace: {{ .Values.namespace }}
  {{- if .Values.eventBus.labels }}
  labels:
    {{- toYaml .Values.eventBus.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.eventBus.annotations }}
  annotations:
    {{- toYaml .Values.eventBus.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .Values.eventBus.spec | nindent 2 }}
{{- end }}
