# =============================================================================
# EVENTSOURCES
#   Каждый элемент принимает полный spec из inventory. Контроллер по каждому
#   CR создаёт Deployment, а при наличии spec.service — ещё и Service
#   <name>-eventsource-svc.
# =============================================================================

{{- range .Values.eventSources }}
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: {{ .name }}
  namespace: "{{ $.Values.namespace }}"
  {{- if .labels }}
  labels:
    {{- toYaml .labels | nindent 4 }}
  {{- end }}
  {{- if .annotations }}
  annotations:
    {{- toYaml .annotations | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
