---
# Namespace
namespace: "argo-events"

# EventBus — шина событий. Namespaced: EventSource и Sensor ищут её в своём
# namespace. spec приходит из inventory целиком и рендерится как есть.
# labels и annotations опциональны (пустые/отсутствующие не добавляются), но
# ведут себя по-разному: метки контроллер переносит на StatefulSet шины и
# реагирует на их изменение реконсиляцией, а аннотации не читает никто —
# они полезны только внешним инструментам (ArgoCD, reloader, пометки).
eventBus:
  enabled: false
  name: "default"
  labels: {}
  annotations: {}
  spec: {}

# EventSources — каждый принимает ПОЛНЫЙ spec (operator-provided); template
# оборачивает metadata (name, namespace, + опционально labels и annotations —
# пустые/отсутствующие не добавляются).
eventSources: []
# - name: "webhook"
#   labels:                                          # optional
#     app.kubernetes.io/part-of: argo-events
#   annotations:                                     # optional
#     events.argoproj.io/leader-election: k8s
#   spec:
#     service:
#       ports:
#         - port: 12000
#           targetPort: 12000
#     webhook:
#       example:
#         port: "12000"
#         endpoint: /example
#         method: POST

# Sensors — каждый принимает ПОЛНЫЙ spec; правила те же, что у EventSources.
sensors: []
# - name: "log"
#   spec:
#     dependencies:
#       - name: webhook-dep
#         eventSourceName: webhook
#         eventName: example
#     triggers:
#       - template:
#           name: log-trigger
#           log: {}

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
