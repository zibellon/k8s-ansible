---
# Namespace
namespace: "argo-events"

# EventBuses — каждый элемент принимает ПОЛНЫЙ spec из inventory; template
# оборачивает только metadata. Список, а не одиночный объект: несколько шин в
# одном namespace допустимы, EventSource и Sensor выбирают свою по имени через
# spec.eventBusName (дефолт "default") и ищут её в СВОЁМ namespace.
# labels и annotations опциональны (пустые/отсутствующие не добавляются) и
# ведут себя по-разному: метки контроллер переносит на StatefulSet шины и
# реагирует на их изменение реконсиляцией, а аннотации не читает никто —
# они полезны только внешним инструментам (ArgoCD, reloader, пометки).
eventBuses: []
# - name: "default"
#   labels:                                          # optional
#     app.kubernetes.io/part-of: argo-events
#   spec:
#     jetstream:
#       version: "2.10.29"
#       replicas: 1
#       persistence:
#         storageClassName: "lnstr-major-local"
#         accessMode: ReadWriteOnce
#         volumeSize: "10Gi"
#       # ⚠️ streamConfig применяется РОВНО ОДИН РАЗ — при создании стрима, и
#       # создаёт его первый подключившийся EventSource или Sensor, а не
#       # контроллер шины: на существующем стриме новый конфиг НЕ применяется.
#       # replicas обязан быть согласован с числом реплик JetStream — при одной
#       # реплике глобальный дефолт 3 поток не создаст.
#       # ⚠️ maxBytes — ЧИСЛО В БАЙТАХ. Строка "6Gi" молча станет 0, а ноль
#       # сервер нормализует в -1, то есть в ОТСУТСТВИЕ лимита. Соседний maxAge
#       # строку принимает. 6 * 1024^3 = 6442450944.
#       streamConfig: |
#         replicas: 1
#         maxAge: 96h
#         maxBytes: 6442450944

# EventSources — каждый принимает ПОЛНЫЙ spec (operator-provided); template
# оборачивает metadata (name, namespace, + опционально labels и annotations —
# пустые/отсутствующие не добавляются).
eventSources: []
# - name: "webhook"
#   labels:                                          # optional
#     app.kubernetes.io/part-of: argo-events
#   annotations:                                     # optional
#     events.argoproj.io/leader-election: k8s
#   spec:
#     service:
#       ports:
#         - port: 12000
#           targetPort: 12000
#     webhook:
#       example:
#         port: "12000"
#         endpoint: /example
#         method: POST

# Sensors — каждый принимает ПОЛНЫЙ spec; правила те же, что у EventSources.
sensors: []
# - name: "log"
#   spec:
#     dependencies:
#       - name: webhook-dep
#         eventSourceName: webhook
#         eventName: example
#     triggers:
#       - template:
#           name: log-trigger
#           log: {}

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
