# =============================================================================
# PODMONITORS FOR ARGO EVENTS (Prometheus Operator)
#   Два монитора: контроллер и поды, которые он порождает по CR. Оба снимают
#   метрики с порта `metrics` (:7777). Под валидирующего вебхука метрик не
#   отдаёт и ни под один селектор не попадает.
# =============================================================================

{{- if .Values.podMonitor.controller.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argo-events-controller
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/component: controller-manager
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  podMetricsEndpoints:
    - port: metrics
      interval: {{ .Values.podMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.podMonitor.scrapeTimeout | quote }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  selector:
    matchLabels:
      app: controller-manager
{{- end }}

{{- if .Values.podMonitor.workloads.enabled }}
---
# Поды EventSource, Sensor и EventBus. Их состав меняется в рантайме вместе с
# CR, поэтому селектор задан по метке `controller`, которую проставляет
# контроллер, а не по именам конкретных объектов.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argo-events-workloads
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/component: workloads
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  podMetricsEndpoints:
    - port: metrics
      interval: {{ .Values.podMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.podMonitor.scrapeTimeout | quote }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  selector:
    matchExpressions:
      - key: controller
        operator: In
        values:
          - eventsource-controller
          - sensor-controller
          - eventbus-controller
{{- end }}
