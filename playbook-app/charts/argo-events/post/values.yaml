---
# Namespace for resources
namespace: "argo-events"

# PodMonitor'ы для Prometheus (mon-system). Service апстрим не создаёт ни для
# контроллера, ни для порождаемых подов, поэтому метрики снимаются с подов
# напрямую по имени порта `metrics` (:7777). interval, scrapeTimeout и labels
# общие для обоих мониторов.
podMonitor:
  controller:
    enabled: false
  workloads:
    enabled: false
  interval: "30s"
  scrapeTimeout: "15s"
  labels: {}

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
