---
# Namespace компонента. Здесь живёт SA контроллера — субъект биндинга ниже.
namespace: "argo-events"

# Managed namespace и обязательные права контроллера в нём. Оба объекта
# рендерятся ТОЛЬКО когда managedNamespace непуст И НЕ РАВЕН namespace: при
# равенстве namespace заводит --create-namespace самого install-релиза, а прав
# контроллеру хватает вендоренного Role argo-events-role. Подробности — в
# шапках templates/managed-namespace.yaml и templates/controller-rbac.yaml.
controllerRbac:
  managedNamespace: ""
  saName: "argo-events-sa"
  roleName: "argo-events-controller"
  roleBindingName: "argo-events-controller"
  rules: []

# Метки и аннотации объекта Namespace. Опциональны: пустые не рендерятся.
managedNamespaceLabels: {}
managedNamespaceAnnotations: {}

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
