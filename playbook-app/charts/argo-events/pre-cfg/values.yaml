---
# Namespace компонента. Здесь живёт SA контроллера — субъект биндинга ниже.
namespace: "argo-events"

# CR namespace и обязательные права контроллера в нём. Оба объекта
# рендерятся ТОЛЬКО когда crNamespace.name непуст И НЕ РАВЕН namespace: при
# равенстве namespace заводит --create-namespace самого install-релиза, а прав
# контроллеру хватает вендоренного Role argo-events-role. Подробности — в
# шапках templates/cr-namespace.yaml и templates/controller-rbac.yaml.
# labels и annotations — метки и аннотации объекта Namespace. Опциональны:
# пустые не рендерятся.
crNamespace:
  name: ""
  labels: {}
  annotations: {}

controllerRbac:
  saName: "argo-events-sa"
  roleName: "argo-events-controller"
  roleBindingName: "argo-events-controller"
  rules: []

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
