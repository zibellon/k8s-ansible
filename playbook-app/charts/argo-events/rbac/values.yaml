---
# Namespace
namespace: "argo-events"

# Пользовательские RBAC-объекты — пять независимых списков, элементы
# рендерятся как есть (raw). Связей между списками нет: SA может быть без
# биндинга, роль без SA, биндинг ссылаться на любую существующую роль.
# ServiceAccount:      {name, labels?, annotations?}   — в namespace компонента
# Role:                {name, namespace, rules}
# ClusterRole:         {name, rules}
# RoleBinding:         {name, namespace, roleRef, subjects}
# ClusterRoleBinding:  {name, roleRef, subjects}
rbacServiceAccounts: []
rbacRoles: []
rbacClusterRoles: []
rbacRoleBindings: []
rbacClusterRoleBindings: []

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
