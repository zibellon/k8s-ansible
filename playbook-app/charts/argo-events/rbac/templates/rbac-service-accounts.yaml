# =============================================================================
# ARGO EVENTS SERVICE ACCOUNTS
#   Носители прав для подов EventSource и Sensor. Под указывается в CR через
#   spec.template.serviceAccountName. Живут в namespace компонента.
# =============================================================================
{{- range $sa := .Values.rbacServiceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $.Values.namespace }}
  {{- with $sa.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
