# =============================================================================
# ARGO EVENTS CLUSTER ROLE BINDINGS
#   Связывают субъектов с кластерными ролями. Шаблон связей не проверяет.
# =============================================================================
{{- range $crb := .Values.rbacClusterRoleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $crb.name }}
roleRef:
{{ toYaml $crb.roleRef | indent 2 }}
subjects:
{{ toYaml $crb.subjects | indent 2 }}
{{- end }}
