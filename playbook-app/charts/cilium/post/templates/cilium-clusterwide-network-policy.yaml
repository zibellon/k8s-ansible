# =============================================================================
# CILIUM HOST FIREWALL - Base policy for all nodes
# Requires Cilium CRDs to be installed first
# =============================================================================

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-base
spec:
  nodeSelector:
    matchLabels: {}

  enableDefaultDeny:
    ingress: true
    egress: true

  ingress:
    # =========================================================================
    # Cluster internal traffic
    # =========================================================================
    - fromEntities:
        - cluster # All pods and nodes in the cluster
        - host # Localhost (same node)
        - health # Cilium health endpoints
        - remote-node # Other nodes in the cluster (explicit)

    # =========================================================================
    # SSH from external
    #   sshVpnOnlyEnabled: false - from world (default)
    #   sshVpnOnlyEnabled: true  - only from sshVpnCidrs (vpn_ips); an empty list
    #                              fails the render (nothing is applied)
    # =========================================================================
    {{- if not (kindIs "bool" .Values.sshVpnOnlyEnabled) }}
    {{- fail "sshVpnOnlyEnabled must be a boolean (true/false), not a string" }}
    {{- end }}
    {{- if and .Values.sshVpnOnlyEnabled (not .Values.sshVpnCidrs) }}
    {{- fail "sshVpnOnlyEnabled=true requires non-empty sshVpnCidrs (vpn_ips): SSH would be closed for everyone outside the cluster" }}
    {{- end }}
    {{- if .Values.sshVpnOnlyEnabled }}
    - fromCIDR:
      {{- toYaml .Values.sshVpnCidrs | nindent 6 }}
      toPorts:
        - ports:
            - port: "{{ .Values.external.sshPort }}"
              protocol: TCP
    {{- else }}
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "{{ .Values.external.sshPort }}"
              protocol: TCP
    {{- end }}

    # =========================================================================
    # ICMP for debugging
    # =========================================================================
    - fromEntities:
        - world
      icmps:
        - fields:
            - type: 8

    # =========================================================================
    # Allow incoming traffic from known cluster node IPs (for node join)
    # =========================================================================
    - fromCIDR:
      {{- toYaml .Values.nodeIpsList | nindent 6 }}

  egress:
    # =========================================================================
    # Cluster internal traffic (free)
    # =========================================================================
    - toEntities:
        - cluster # All pods and nodes in the cluster
        - host # Localhost (same node)
        - health # Cilium health endpoints
        - remote-node # Other nodes in the cluster (explicit)

    # =========================================================================
    # External traffic (HTTP, HTTPS, SSH, DNS, Mail)
    # =========================================================================
    - toEntities:
        - world
      toPorts:
        - ports:
            # Web
            - port: "{{ .Values.external.httpPort }}"
              protocol: TCP
            - port: "{{ .Values.external.httpsPort }}"
              protocol: TCP
            # SSH
            - port: "{{ .Values.external.sshPort }}"
              protocol: TCP
            # DNS
            - port: "{{ .Values.dns.port }}"
              protocol: UDP
            - port: "{{ .Values.dns.port }}"
              protocol: TCP
            # NTP (time sync)
            - port: "{{ .Values.external.ntpPort }}"
              protocol: UDP

    # =========================================================================
    # ICMP for debugging
    # =========================================================================
    - toEntities:
        - world
      icmps:
        - fields:
            - type: 8
    # =========================================================================
    # Allow outgoing traffic to known cluster node IPs (for node join)
    # =========================================================================
    - toCIDR:
      {{- toYaml .Values.nodeIpsList | nindent 6 }}
