# =============================================================================
# ARGOCD RBAC — SERVICE ACCOUNTS
#   Namespace берётся из элемента, а не из values: компонент по природе
#   многонамespace'ный и ключа namespace в values не имеет.
# =============================================================================
{{- range $sa := .Values.rbacServiceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $sa.namespace }}
  {{- with $sa.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
