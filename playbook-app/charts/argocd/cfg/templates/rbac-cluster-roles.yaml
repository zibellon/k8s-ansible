# =============================================================================
# ARGOCD RBAC — CLUSTER ROLES
#   Определение прав. Само по себе никого ничем не наделяет: права возникают
#   там, где на роль сослался RoleBinding (в пределах его namespace) или
#   ClusterRoleBinding (по всему кластеру).
# =============================================================================
{{- range $cr := .Values.rbacClusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cr.name }}
  {{- with $cr.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
{{ toYaml $cr.rules | indent 2 }}
{{- end }}
