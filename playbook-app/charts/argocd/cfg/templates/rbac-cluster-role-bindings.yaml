# =============================================================================
# ARGOCD RBAC — CLUSTER ROLE BINDINGS
#   Даёт права по всему кластеру. Шаблон связей не проверяет.
# =============================================================================
{{- range $crb := .Values.rbacClusterRoleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $crb.name }}
  {{- with $crb.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $crb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
{{ toYaml $crb.roleRef | indent 2 }}
subjects:
{{ toYaml $crb.subjects | indent 2 }}
{{- end }}
