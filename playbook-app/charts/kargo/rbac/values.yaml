---
# Namespace для ServiceAccount'ов — один на весь список (в отличие от
# cluster-base, где namespace берётся из элемента). Kargo матчит SA по
# аннотации claims в релизном namespace и в namespace'ах проектов.
namespace: ""

# Пользовательские RBAC-объекты — пять независимых списков, по одному на тип.
# Элемент несёт полную спецификацию объекта; шаблон рендерит его как есть,
# ничего не вычисляя. labels/annotations опциональны у всех пяти типов:
# отсутствующие блоки не рендерятся.
# Связей между списками нет: ServiceAccount может жить без биндинга, Role —
# без субъекта, биндинг — ссылаться на роль, созданную upstream-чартом.
#   ServiceAccount:      {name, namespace?, labels?, annotations?}  namespace по
#                        умолчанию .Values.namespace; в namespace проекта — ради
#                        фильтра «My Projects», см. templates/rbac-service-accounts.yaml
#   Role:                {name, namespace, labels?, annotations?, rules}
#   ClusterRole:         {name, labels?, annotations?, rules}
#   RoleBinding:         {name, namespace, labels?, annotations?, roleRef, subjects}
#   ClusterRoleBinding:  {name, labels?, annotations?, roleRef, subjects}
rbacServiceAccounts: []
rbacRoles: []
rbacClusterRoles: []
rbacClusterRoleBindings: []
rbacRoleBindings: []

# Сотрудники. Один элемент — один человек; SA с именем saName создаётся в
# КАЖДОМ namespace из namespaces. Подробности — templates/custom-users.yaml.
#   {saName, namespaces: [], labels?, annotations?}
customUsers: []

# «Вижу список проектов» — то, без чего UI не открывается вообще: ClusterRole +
# ClusterRoleBinding, субъектами которого автоматически становятся все
# customUsers (в релизном namespace). Рендерится только когда customUsers
# непуст. Правила задаются целиком из hosts-vars, чтобы их можно было
# переопределить. Подробности и ограничения —
# templates/ui-discovery-rbac-setup.yaml.
uiDiscoveryRBACSetup:
  name: "kargo-ui-discovery-rbac-setup"
  rules: []

# Проекты Kargo. Элемент порождает объект Project (templates/projects.yaml) и
# раздачу ролей в его namespace (templates/project-accounts.yaml). name — имя
# Project, оно же имя namespace; namespace заводится снаружи, из cluster-base.
# accounts можно опустить — проект без выданных доступов валиден. labels и
# annotations относятся только к объекту Project, на RoleBinding'и не влияют.
#   {name, labels?, annotations?, accounts?: [{saName, roleType: Role|ClusterRole, roleName}]}
projects: []

# Custom K8s objects to render (operator-side, default empty)
extraObjects: []
