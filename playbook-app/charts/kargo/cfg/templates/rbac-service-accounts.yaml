# =============================================================================
# KARGO USER SERVICE ACCOUNTS
#   Носители прав для OIDC-логинов: Kargo матчит SA по аннотации
#   rbac.kargo.akuity.io/claims и выполняет SubjectAccessReview от его имени.
#   Токен такого SA не выпускается — под ним никто не работает.
#   Элементы рендерятся как есть; связи с ролями здесь нет.
#
#   namespace опционален и по умолчанию равен релизному. Класть SA в namespace
#   ПРОЕКТА имеет смысл ради фильтра «My Projects» в UI: он показывает проект,
#   если у человека есть совпавший по клеймам SA в namespace с именем этого
#   проекта, и прав при этом не смотрит вовсе (list_projects_v1alpha1.go:174-186).
#   Права всё равно даёт RoleBinding, а не сам SA.
# =============================================================================
{{- range $sa := .Values.rbacServiceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $sa.namespace | default $.Values.namespace }}
  {{- with $sa.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
