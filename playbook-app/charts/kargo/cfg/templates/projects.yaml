# =============================================================================
# KARGO PROJECTS
#   Объект Project на каждый элемент projects. Cluster-scoped и без spec —
#   всё его содержимое это имя (в CRD на верхнем уровне только apiVersion,
#   kind, metadata и status).
#
#   Namespace того же имени с меткой kargo.akuity.io/project=true заводит этот
#   же релиз раньше Project'а (templates/project-namespaces.yaml). Без метки
#   admission-вебхук отвергает Project с 409.
#
#   Порядок внутри релиза значения не имеет: helm применяет неизвестные ему
#   kind'ы последними, то есть Project уедет после RoleBinding'ов. Биндинг,
#   сославшийся на ещё не созданную Role, начнёт действовать сам, когда
#   management-controller создаст роли при первом реконсайле Project'а.
#
#   ⚠️ Удаление элемента из projects удаляет namespace со всем содержимым:
#   Namespace в этом же релизе, его сносит helm. kargo.akuity.io/keep-namespace
#   от этого НЕ спасает — она защищает только от cleanupProject Kargo, когда
#   Project удалён в обход helm. helm.sh/resource-policy намеренно НЕ ставится:
#   удаление должно работать штатно, ответственность — на операторе.
#
#   labels опциональны и уходят только на Project, annotations — на Project и
#   namespace; на RoleBinding'и из accounts (templates/project-accounts.yaml)
#   не влияет ни то ни другое. Отсутствующий блок не рендерится.
# =============================================================================
{{- range $project := .Values.projects }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: {{ $project.name }}
  {{- with $project.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $project.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
