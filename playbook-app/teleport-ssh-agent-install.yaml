# =============================================================================
# Install Teleport SSH agent (systemd service on every manager + worker)
# Steps:
#   1. teleport_ssh_agent_version = версия работающего кластера; apt-репозиторий Teleport
#      + teleport=<teleport_ssh_agent_version> + apt-mark hold
#   2. /etc/teleport.yaml (одинаковый на всех нодах; токен подключения — из файла)
#   3. ноды, которых Teleport не видит, получают короткоживущий токен (один на прогон,
#      TTL teleport_ssh_agent_join_token_ttl) и перезапуск;
#      идентичность в data_dir НЕ стирается — повторный прогон ничего не меняет
#   4. проверка: каждая нода видна в Teleport ровно один раз и на teleport_ssh_agent_version
#
# Usage:
#   ansible-playbook -i hosts-vars/ -i hosts-vars-override/<cluster>/ playbook-app/teleport-ssh-agent-install.yaml
#   ansible-playbook ... --limit <node>
#
# Сброс идентичности ноды (стереть data_dir, удалить старую запись, подключить заново):
#   teleport_ssh_agent_reset_identity: true у хоста в hosts-vars-override/<cluster>/hosts.yaml,
#   прогон, затем вернуть false — пока true, каждый прогон сбрасывает ноду заново.
#
# Prerequisites:
#   - teleport-install.yaml (кластер Teleport запущен), DNS teleport_domain
# =============================================================================

---
- name: Install Teleport SSH Agent (systemd)
  hosts: managers:workers
  become: true
  gather_facts: false
  # Рестарт из handler не теряется, если прогон упал между notify и flush_handlers.
  force_handlers: true

  vars:
    # Имена локальных фактов — единая точка объявления (вынос из хардкода)
    _local_teleport_ssh_agent_join_key: "_local_teleport_ssh_agent_join"
    _local_teleport_ssh_agent_records_key: "_local_teleport_ssh_agent_records"

  tasks:
    - name: "[teleport-ssh-agent-install] Assert component enabled"
      assert:
        that:
          - teleport_enabled | default(false) | bool
        fail_msg: "teleport is disabled (teleport_enabled=false). Set teleport_enabled: true in hosts-vars-override/ to install it."
      run_once: true

    - name: "[teleport-ssh-agent-pre-check] Validate target"
      include_tasks: "{{ project_root }}/playbook-app/tasks/tasks-pre-check.yaml"
      vars:
        dto_label_name: "teleport-ssh-agent-pre-check"

    - name: "[teleport-ssh-agent-install] Read running cluster version"
      command: kubectl exec -n {{ teleport_namespace }} {{ teleport_tctl_exec_target }} -- teleport version --raw
      register: _local_teleport_ssh_agent_cluster_version
      changed_when: false
      delegate_to: "{{ master_manager_fact }}"
      run_once: true

    - name: "[teleport-ssh-agent-install] Assert agent version matches running cluster"
      assert:
        that:
          - _local_teleport_ssh_agent_cluster_version.stdout | trim == teleport_ssh_agent_version
        fail_msg: >-
          Cluster runs {{ _local_teleport_ssh_agent_cluster_version.stdout | trim }}, teleport_ssh_agent_version
          is {{ teleport_ssh_agent_version }}: they must be equal. Upgrade the cluster first (teleport-install.yaml).
      run_once: true

    # =========================================================================
    # STEP 1: PACKAGE
    # =========================================================================

    - name: "[teleport-ssh-agent-package] Detect Ubuntu codename"
      command: awk -F= '$1 == "VERSION_CODENAME" {print $2}' /etc/os-release
      register: _local_teleport_ssh_agent_codename
      changed_when: false

    - name: "[teleport-ssh-agent-package] Download Teleport apt key"
      get_url:
        url: "{{ teleport_ssh_agent_apt_key_url }}"
        dest: "{{ teleport_ssh_agent_apt_keyring }}"
        mode: "0644"

    - name: "[teleport-ssh-agent-package] Add Teleport apt repository"
      copy:
        dest: /etc/apt/sources.list.d/teleport.list
        content: |
          deb [signed-by={{ teleport_ssh_agent_apt_keyring }}] {{ teleport_ssh_agent_apt_repo_url }} {{ _local_teleport_ssh_agent_codename.stdout }} {{ teleport_ssh_agent_apt_channel }}
        mode: "0644"

    # Точный пин под apt-mark hold: смена версии в обе стороны (включая откат).
    - name: "[teleport-ssh-agent-package] Install teleport package"
      apt:
        name: "teleport={{ teleport_ssh_agent_version }}"
        state: present
        update_cache: true
        allow_change_held_packages: true
        allow_downgrade: true
      notify: Restart teleport

    - name: "[teleport-ssh-agent-package] Hold teleport version"
      command: apt-mark hold teleport
      changed_when: false

    # =========================================================================
    # STEP 2: CONFIG
    # =========================================================================

    - name: "[teleport-ssh-agent-reset] Stop teleport service"
      systemd:
        name: teleport
        state: stopped
      when: teleport_ssh_agent_reset_identity | bool

    - name: "[teleport-ssh-agent-reset] Remove node identity"
      file:
        path: "{{ teleport_ssh_agent_data_dir }}"
        state: absent
      when: teleport_ssh_agent_reset_identity | bool

    - name: "[teleport-ssh-agent-config] Create data directory"
      file:
        path: "{{ teleport_ssh_agent_data_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    # Путь конфига зашит в systemd-юнит пакета.
    - name: "[teleport-ssh-agent-config] Write teleport config"
      copy:
        dest: /etc/teleport.yaml
        mode: "0600"
        owner: root
        group: root
        content: |
          version: v3
          teleport:
            nodename: "{{ inventory_hostname }}"
            data_dir: {{ teleport_ssh_agent_data_dir }}
            proxy_server: {{ teleport_web_public_addr }}
            join_params:
              method: token
              token_name: {{ teleport_ssh_agent_join_token_path }}
            log:
              output: stderr
              severity: {{ teleport_ssh_agent_log_level }}
              format:
                output: json
          auth_service:
            enabled: false
          proxy_service:
            enabled: false
          ssh_service:
            enabled: true
            labels: {{ teleport_ssh_agent_node_labels | to_json }}
      notify: Restart teleport

    # =========================================================================
    # STEP 3: JOIN (только ноды, которых Teleport не видит)
    # =========================================================================

    - name: "[teleport-ssh-agent-join] List nodes registered in Teleport"
      command: kubectl exec -n {{ teleport_namespace }} {{ teleport_tctl_exec_target }} -- tctl nodes ls --format=json
      register: _local_teleport_ssh_agent_nodes
      changed_when: false
      delegate_to: "{{ master_manager_fact }}"
      run_once: true

    # Нода без heartbeat (новая, остановленная) или сброшенная получает токен. Токен
    # читается только при подключении: у подключённой ноды идентичность в data_dir.
    - name: "[teleport-ssh-agent-join] Decide whether the node needs to join"
      set_fact:
        "{{ _local_teleport_ssh_agent_join_key }}": >-
          {{ teleport_ssh_agent_reset_identity | bool
             or inventory_hostname not in (_local_teleport_ssh_agent_nodes.stdout | from_json | map(attribute='spec.hostname') | list) }}

    # Старая запись ноды висит в Teleport до TTL heartbeat (~15 мин) — дубль имени ломает tsh ssh.
    - name: "[teleport-ssh-agent-reset] Remove old node records"
      command: kubectl exec -n {{ teleport_namespace }} {{ teleport_tctl_exec_target }} -- tctl rm node/{{ item.metadata.name }}
      loop: "{{ _local_teleport_ssh_agent_nodes.stdout | from_json | selectattr('spec.hostname', 'equalto', inventory_hostname) | list }}"
      loop_control:
        label: "{{ item.spec.hostname }}"
      when: teleport_ssh_agent_reset_identity | bool
      delegate_to: "{{ master_manager_fact }}"

    - name: "[teleport-ssh-agent-join] Generate node join token"
      command: kubectl exec -n {{ teleport_namespace }} {{ teleport_tctl_exec_target }} -- tctl tokens add --type=node --ttl={{ teleport_ssh_agent_join_token_ttl }} --format=json
      register: _local_teleport_ssh_agent_token
      no_log: true
      when: ansible_play_hosts | map('extract', hostvars, _local_teleport_ssh_agent_join_key) | select | list | length > 0
      delegate_to: "{{ master_manager_fact }}"
      run_once: true

    - name: "[teleport-ssh-agent-join] Write join token"
      copy:
        dest: "{{ teleport_ssh_agent_join_token_path }}"
        content: "{{ (_local_teleport_ssh_agent_token.stdout | from_json).token }}"
        mode: "0600"
        owner: root
        group: root
      no_log: true
      when: lookup('vars', _local_teleport_ssh_agent_join_key)
      notify: Restart teleport

    - name: "[teleport-ssh-agent-join] Apply config and token changes"
      meta: flush_handlers

    - name: "[teleport-ssh-agent-join] Enable and start teleport service"
      systemd:
        name: teleport
        state: started
        enabled: true
        daemon_reload: true

    # =========================================================================
    # STEP 4: VERIFY
    # =========================================================================

    - name: "[teleport-ssh-agent-verify] Wait for every node to appear in Teleport exactly once on the target version"
      command: kubectl exec -n {{ teleport_namespace }} {{ teleport_tctl_exec_target }} -- tctl nodes ls --format=json
      register: _local_teleport_ssh_agent_nodes_after
      until: >-
        _local_teleport_ssh_agent_nodes_after.rc == 0 and
        (_local_teleport_ssh_agent_nodes_after.stdout | from_json | selectattr('spec.hostname', 'in', ansible_play_hosts)
         | map(attribute='spec.hostname') | sort == ansible_play_hosts | sort) and
        (_local_teleport_ssh_agent_nodes_after.stdout | from_json | selectattr('spec.hostname', 'in', ansible_play_hosts)
         | rejectattr('spec.version', 'equalto', teleport_ssh_agent_version) | list | length == 0)
      retries: "{{ teleport_ssh_agent_join_wait.retries }}"
      delay: "{{ teleport_ssh_agent_join_wait.delay }}"
      failed_when: false
      changed_when: false
      delegate_to: "{{ master_manager_fact }}"
      run_once: true

    - name: "[teleport-ssh-agent-verify] Collect node records of this play"
      set_fact:
        "{{ _local_teleport_ssh_agent_records_key }}": >-
          {{ (_local_teleport_ssh_agent_nodes_after.stdout | from_json | selectattr('spec.hostname', 'in', ansible_play_hosts) | list)
             if _local_teleport_ssh_agent_nodes_after.rc == 0 else [] }}
      run_once: true

    # Нода с идентичностью другого кластера Teleport (auth пересоздан) токен не читает и сама не подключится.
    - name: "[teleport-ssh-agent-verify] Assert every node joined exactly once on the target version"
      assert:
        that:
          - _local_teleport_ssh_agent_nodes_after.rc == 0
          - lookup('vars', _local_teleport_ssh_agent_records_key) | map(attribute='spec.hostname') | sort == ansible_play_hosts | sort
          - lookup('vars', _local_teleport_ssh_agent_records_key) | rejectattr('spec.version', 'equalto', teleport_ssh_agent_version) | list | length == 0
        fail_msg: >-
          tctl nodes ls rc={{ _local_teleport_ssh_agent_nodes_after.rc }} {{ _local_teleport_ssh_agent_nodes_after.stderr | trim }}.
          Missing: {{ ansible_play_hosts | difference(lookup('vars', _local_teleport_ssh_agent_records_key) | map(attribute='spec.hostname') | list) }}.
          Records per host (repeat = duplicate): {{ lookup('vars', _local_teleport_ssh_agent_records_key) | map(attribute='spec.hostname') | sort }}.
          Not on {{ teleport_ssh_agent_version }}: {{ lookup('vars', _local_teleport_ssh_agent_records_key)
          | rejectattr('spec.version', 'equalto', teleport_ssh_agent_version) | map(attribute='spec.hostname') | list }}.
          Missing or duplicate node (identity from another Teleport cluster, broken data_dir):
          set teleport_ssh_agent_reset_identity: true for it in hosts-vars-override/<cluster>/hosts.yaml and rerun.
      run_once: true

    - name: "[teleport-ssh-agent-verify] Installation complete"
      debug:
        msg: >-
          {% set reset = ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'teleport_ssh_agent_reset_identity') | map('bool'))
          | selectattr(1) | map(attribute=0) | list %}Teleport SSH agents joined: {{ ansible_play_hosts | join(', ') }}
          (newly joined: {{ ansible_play_hosts | map('extract', hostvars) | selectattr(_local_teleport_ssh_agent_join_key)
          | map(attribute='inventory_hostname') | join(', ') or 'none' }}).{% if reset %} Identity reset on {{ reset | join(', ') }}:
          set teleport_ssh_agent_reset_identity back to false.{% endif %}
      run_once: true

  handlers:
    - name: Restart teleport
      systemd:
        name: teleport
        state: restarted
        daemon_reload: true
