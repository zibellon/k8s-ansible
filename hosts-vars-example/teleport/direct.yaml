# =============================================================================
# Teleport напрямую, без внешнего прокси: accept_proxy выключен на всех трёх
# слушателях, иначе Teleport будет ждать заголовок proxy-protocol, которого
# никто не шлёт. teleport_domain ИММУТАБЕЛЕН после первого деплоя — он же
# clusterName; смена домена означает переустановку с потерей состояния.
# =============================================================================
all:
  vars:
    teleport_domain: "teleport.example.com"
    teleport_external_url: "https://teleport.example.com"

    teleport_data_storage_class: "lnstr-worker-multi-sync"
    teleport_data_storage_size: "4Gi"

    teleport_ssh_accept_proxy: false
    teleport_reverse_tunnel_accept_proxy: false
    teleport_kube_accept_proxy: false
