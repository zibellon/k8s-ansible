# =============================================================================
# Teleport за внешним HAProxy edge-прокси: TCP-слушатели (ssh, reverse tunnel,
# kube) получают трафик с заголовком proxy-protocol-v2, поэтому accept_proxy
# включён на всех трёх. Флаги обязаны совпадать с send-proxy-v2 на bastion:
# рассинхрон в любую сторону рвёт соединение молча.
# =============================================================================
all:
  vars:
    teleport_domain: "teleport.example.com"
    teleport_external_url: "https://teleport.example.com"

    teleport_data_storage_class: "lnstr-major-multi-sync"
    teleport_data_storage_size: "4Gi"

    teleport_ssh_accept_proxy: true
    teleport_reverse_tunnel_accept_proxy: true
    teleport_kube_accept_proxy: true
