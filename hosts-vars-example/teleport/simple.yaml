# =============================================================================
# Teleport на тестовом кластере: из пользователей только superadmin из базы.
# Публикация одинакова для DNS прямо на узел и для bastion-proxy: Traefik :443
# пропускает TLS насквозь (IngressRouteTCP passthrough), сертификат держит сам
# Teleport. teleport_domain ИММУТАБЕЛЕН после первого деплоя — он же clusterName
# и rp_id passkey; смена = переустановка с потерей состояния.
# =============================================================================
all:
  vars:
    teleport_enabled: true

    teleport_domain: "teleport.example.com"
    teleport_kube_cluster_name: "test-cluster"

    teleport_data_storage_class: "lnstr-major-local"
    teleport_data_storage_size: "1Gi"
