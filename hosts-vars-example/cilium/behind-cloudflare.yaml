# =============================================================================
# Hubble UI за Cloudflare: HTTPS терминируется на CDN, на origin приходит HTTP.
# Отсюда issuer/tls/certificate = false — сертификат на origin не нужен и ACME
# HTTP-01 через проксирующий CDN всё равно не пройдёт. UI закрыт VPN-мидлварью
# (CF-вариант). ipam pod CIDR mask задан явно под размер кластера.
# =============================================================================
all:
  vars:
    cilium_hubble_ui_ingress_class_name: "traefik-lb"
    cilium_cert_manager_issuer_enabled: false

    cilium_hubble_ui_domain: "hubble-ui.example.com"
    cilium_hubble_ui_ingress_enabled: true
    cilium_hubble_ui_ingress_tls_enabled: false
    cilium_hubble_ui_certificate_enabled: false
    cilium_hubble_ui_vpn_only_enabled: true

    cilium_helm_values_ipam_operator_pod_cidr_mask_size: 23
