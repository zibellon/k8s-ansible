# =============================================================================
# Hubble UI напрямую, TLS на origin: cert-manager выпускает сертификат по
# ACME HTTP-01, Traefik его отдаёт. У Hubble UI нет своей авторизации, поэтому
# в закрытых контурах его закрывают vpn_only_enabled: true.
# =============================================================================
all:
  vars:
    cilium_hubble_ui_ingress_class_name: "traefik-lb"
    cilium_cert_manager_issuer_enabled: true

    cilium_hubble_ui_domain: "hubble-ui.example.com"
    cilium_hubble_ui_ingress_enabled: true
    cilium_hubble_ui_ingress_tls_enabled: true
    cilium_hubble_ui_certificate_enabled: true
    cilium_hubble_ui_vpn_only_enabled: false
