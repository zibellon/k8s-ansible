# =============================================================================
# Внешний HAProxy edge-прокси перед кластером. l7_target_ip — узел с Traefik
# NodePort, l4_target_ip — узел или VIP для TCP-сервисов (gitlab-ssh, teleport).
# Диапазон L4-портов резервируется целиком сразу, чтобы не править конфиг на
# каждый новый TCP-сервис.
# =============================================================================
all:
  vars:
    bastion_proxy_haproxy_l7_target_ip: "203.0.113.23"
    bastion_proxy_haproxy_l4_target_ip: "203.0.113.23"
    bastion_proxy_haproxy_l4_range_start: 20000
    bastion_proxy_haproxy_l4_range_end: 22000
