# =============================================================================
# Сетевые параметры кластера. Задаются ОДИН раз до kubeadm init: pod_subnet и
# service_subnet после инициализации не меняются. Подсети не должны
# пересекаться ни между собой, ни с адресацией узлов.
# =============================================================================
all:
  vars:
    service_subnet: "10.4.0.0/18"
    pod_subnet: "10.2.0.0/15"
    cluster_dns_domain: "cluster.local"
    node_port_start: 1
    node_port_end: 50000
