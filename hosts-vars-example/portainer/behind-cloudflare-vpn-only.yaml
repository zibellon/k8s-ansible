# =============================================================================
# Portainer за Cloudflare и ОБЯЗАТЕЛЬНО за VPN: компонент несёт
# ClusterRoleBinding на cluster-admin, поэтому его UI — это фактически полный
# доступ к кластеру, и публиковать его в интернет нельзя даже с паролем.
# Origin отдаёт HTTP, TLS терминируется на CDN.
# =============================================================================
all:
  vars:
    portainer_enabled: true

    portainer_namespace: "portainer"
    portainer_ingress_class_name: "traefik-lb"
    portainer_cert_manager_issuer_enabled: false

    portainer_ui_domain: "portainer.example.com"
    portainer_ui_tls_secret_name: "cert-portainer"
    portainer_ui_ingress_enabled: true
    portainer_ui_ingress_tls_enabled: false
    portainer_ui_certificate_enabled: false
    portainer_ui_vpn_only_enabled: true

    portainer_storage_class: "lnstr-worker-multi-sync"
    portainer_storage_size: "1Gi"
