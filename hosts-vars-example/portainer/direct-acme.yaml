# =============================================================================
# Portainer — opt-in, напрямую с TLS на origin. portainer_trusted_origins по
# умолчанию равен portainer_ui_domain и ОБЯЗАН быть голым хостом без схемы и
# порта: невалидное значение роняет под на старте, а без флага UI за Traefik
# получает 403 на любых мутациях. Админ-пароль генерится при install и лежит в
# Vault ОТКРЫТЫМ текстом (eso-secret/portainer/admin-creds).
# =============================================================================
all:
  vars:
    portainer_enabled: true

    portainer_namespace: "portainer"
    portainer_ingress_class_name: "traefik-lb"
    portainer_cert_manager_issuer_enabled: true

    portainer_ui_domain: "portainer.example.com"
    portainer_ui_tls_secret_name: "cert-portainer"
    portainer_ui_ingress_enabled: true
    portainer_ui_ingress_tls_enabled: true
    portainer_ui_certificate_enabled: true
    portainer_ui_vpn_only_enabled: false

    portainer_storage_class: "lnstr-worker-multi-sync"
    portainer_storage_size: "1Gi"
