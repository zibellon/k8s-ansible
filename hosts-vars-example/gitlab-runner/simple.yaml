# =============================================================================
# GitLab Runner — opt-in компонент. Регистрационный токен в inventory НЕ
# кладут: он приезжает из Vault через ESO. S3-кэш заводится в
# seaweedfs-sync.yaml (identity gitlab-runner + бакет gitlab-runner-cache).
# =============================================================================
all:
  vars:
    gitlab_runner_enabled: true
