# =============================================================================
# Argo Rollouts — движок анализа для верификации Stage в Kargo. Ставится СТРОГО
# ПЕРЕД kargo: без CRD analysisruns/analysistemplates/clusteranalysistemplates
# Kargo тихо самоотключает интеграцию на старте и молча перестаёт верифицировать.
# Публичных точек входа у компонента нет вовсе — ни домена, ни Ingress, ни
# хранилища; наружу торчит только metrics-порт внутри кластера.
# =============================================================================
all:
  vars:
    argo_rollouts_enabled: true

    argo_rollouts_service_monitor_enabled: true
    argo_rollouts_service_monitor_interval: "30s"
    argo_rollouts_service_monitor_scrape_timeout: "15s"
