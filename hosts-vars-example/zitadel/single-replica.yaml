# =============================================================================
# ZITADEL на маленьком кластере: по одной реплике на оба деплоймента. TLS на
# origin ОБЯЗАТЕЛЕН при любой схеме — продукт требует ExternalSecure: true,
# поэтому Cloudflare оставляют в режиме DNS-only (gray cloud), а сертификат
# выпускает cert-manager. ExternalDomain выводится из zitadel_domain.
# =============================================================================
all:
  vars:
    zitadel_enabled: true

    zitadel_ingress_class_name: "traefik-lb"
    zitadel_cert_manager_issuer_enabled: true
    zitadel_vpn_only_enabled: false

    zitadel_domain: "auth.example.com"
    zitadel_ui_ingress_enabled: true
    zitadel_ui_ingress_tls_enabled: true
    zitadel_ui_certificate_enabled: true

    zitadel_admin_email: "zitadel-admin@example.com"

    zitadel_postgresql_storage_class: "lnstr-worker-multi-sync"
    zitadel_postgresql_storage_size: "1Gi"

    zitadel_helm_values_replica_count: 1
    zitadel_helm_values_login_replica_count: 1
