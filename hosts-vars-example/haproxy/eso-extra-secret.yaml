# =============================================================================
# Дополнительный ExternalSecret для haproxy: поля из Vault приезжают в k8s
# Secret целиком через dataFrom.extract. Шаблон одинаков для всех компонентов —
# меняются только имя, путь в Vault и переменная eso_vault_integration_<c>.
# =============================================================================
all:
  vars:
    eso_vault_integration_haproxy_secrets_extra:
      - external_secret_name: "haproxy-custom-secret"
        vault_path: "/haproxy/custom/creds"
        refresh_interval: "1m"
        body:
          target:
            name: "haproxy-custom-secret"
          dataFrom:
            - extract:
                key: "{{ eso_vault_integration_haproxy.kv_engine_path }}/data/haproxy/custom/creds"
