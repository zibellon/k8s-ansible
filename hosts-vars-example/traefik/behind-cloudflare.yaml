# =============================================================================
# Traefik dashboard за Cloudflare: HTTPS на CDN, origin отдаёт HTTP, поэтому
# issuer/tls/certificate выключены. У dashboard нет своей авторизации — он
# ОБЯЗАН быть за VPN allowlist, иначе панель маршрутизации кластера публична.
# =============================================================================
all:
  vars:
    traefik_dashboard_ingress_class_name: "traefik-lb"
    traefik_cert_manager_issuer_enabled: false

    traefik_dashboard_domain: "traefik-dashboard.example.com"
    traefik_dashboard_ingress_enabled: true
    traefik_dashboard_ingress_tls_enabled: false
    traefik_dashboard_certificate_enabled: false
    traefik_dashboard_vpn_only_enabled: true
