# =============================================================================
# Filestash — веб-клиент к S3, opt-in. Напрямую, TLS на origin через
# cert-manager. Админ-пароль генерится при install (seed-if-missing) и лежит в
# Vault eso-secret/filestash/app; S3-подключение добавляется руками в /admin
# после первого входа.
# =============================================================================
all:
  vars:
    filestash_enabled: true

    filestash_namespace: "filestash"
    filestash_ingress_class_name: "traefik-lb"
    filestash_cert_manager_issuer_enabled: true

    filestash_ui_domain: "filestash.example.com"
    filestash_ui_tls_secret_name: "cert-filestash"
    filestash_ui_ingress_enabled: true
    filestash_ui_ingress_tls_enabled: true
    filestash_ui_certificate_enabled: true
    filestash_ui_vpn_only_enabled: false

    filestash_storage_class: "lnstr-worker-multi-sync"
    filestash_storage_size: "1Gi"
