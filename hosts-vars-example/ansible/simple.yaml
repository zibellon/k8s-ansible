# =============================================================================
# Параметры подключения ansible: интерпретатор, приватный ключ для всех
# плейбуков и список публичных ключей, которые setup-ssh-keys.yaml разложит по
# узлам. Ключей в ssh_public_key_paths может быть несколько — по одному на
# инженера с доступом к кластеру.
# =============================================================================
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    ssh_public_key_paths:
      - "~/.ssh/id_ed25519.pub"
      - "~/.ssh/second-engineer-ed25519.pub"
