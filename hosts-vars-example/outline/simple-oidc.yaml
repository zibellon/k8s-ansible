# =============================================================================
# Outline — вики, opt-in, вход ТОЛЬКО через OIDC (локального логина нет).
# Первый вошедший становится админом, поэтому сразу после bootstrap стоит
# привязать passkey как break-glass. Браузер грузит вложения НАПРЯМУЮ в
# публичный S3-хост — server-side proxy у Outline нет, поэтому
# outline_s3_upload_bucket_url обязан быть доступен из интернета.
# SECRET_KEY генерится при install и НИКОГДА не ротируется.
# =============================================================================
all:
  vars:
    outline_enabled: true

    outline_ingress_class_name: "traefik-lb"
    outline_cert_manager_issuer_enabled: true

    outline_ui_domain: "wiki.example.com"
    outline_ui_tls_secret_name: "cert-outline"
    outline_ui_ingress_enabled: true
    outline_ui_ingress_tls_enabled: true
    outline_ui_certificate_enabled: true
    outline_ui_vpn_only_enabled: false

    outline_s3_upload_bucket_url: "https://s3.example.com"

    outline_oidc_enabled: true
    outline_oidc_name: "ZITADEL"
    outline_oidc_username_claim: "preferred_username"
    outline_oidc_scopes: "openid profile email offline_access urn:zitadel:iam:org:id:000000000000000000"
