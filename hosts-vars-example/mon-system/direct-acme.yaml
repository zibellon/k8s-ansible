# =============================================================================
# Стек наблюдаемости напрямую, TLS на origin через cert-manager. Grafana имеет
# свою авторизацию и остаётся публичной; Prometheus и Alertmanager собственной
# авторизации НЕ имеют — их закрывают VPN allowlist'ом. retention_size держат
# заметно ниже размера тома: WAL и компакция требуют запаса.
# =============================================================================
all:
  vars:
    mon_system_prometheus_operator_enabled: true
    mon_system_prometheus_enabled: true
    mon_system_alertmanager_enabled: true
    mon_system_node_exporter_enabled: true
    mon_system_ksm_enabled: true
    mon_system_loki_enabled: true
    mon_system_vector_enabled: true
    mon_system_grafana_enabled: true

    mon_system_ingress_class_name: "traefik-lb"
    mon_system_cert_manager_issuer_enabled: true

    mon_system_grafana_domain: "grafana.example.com"
    mon_system_grafana_external_url: "https://grafana.example.com"
    mon_system_grafana_ingress_enabled: true
    mon_system_grafana_ingress_tls_enabled: true
    mon_system_grafana_certificate_enabled: true
    mon_system_grafana_vpn_only_enabled: false

    mon_system_grafana_postgresql_storage_class: "lnstr-worker-multi-sync"
    mon_system_grafana_postgresql_storage_size: "1Gi"

    mon_system_prometheus_domain: "prometheus.example.com"
    mon_system_prometheus_external_url: "https://prometheus.example.com"
    mon_system_prometheus_ingress_enabled: true
    mon_system_prometheus_ingress_tls_enabled: true
    mon_system_prometheus_certificate_enabled: true
    mon_system_prometheus_vpn_only_enabled: true

    mon_system_prometheus_spec_storage_class: "lnstr-worker-multi-sync"
    mon_system_prometheus_spec_storage_size: "4Gi"
    mon_system_prometheus_spec_retention: "3d"
    mon_system_prometheus_spec_retention_size: "2GiB"

    mon_system_alertmanager_domain: "alertmanager.example.com"
    mon_system_alertmanager_external_url: "https://alertmanager.example.com"
    mon_system_alertmanager_ingress_enabled: true
    mon_system_alertmanager_ingress_tls_enabled: true
    mon_system_alertmanager_certificate_enabled: true
    mon_system_alertmanager_vpn_only_enabled: true

    mon_system_alertmanager_spec_storage_class: "lnstr-worker-multi-sync"
    mon_system_alertmanager_spec_storage_size: "1Gi"
