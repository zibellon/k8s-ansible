all:
  vars:
    external_secrets_namespace: "external-secrets"
    # ESO resources global config (SecretStore + ExternalSecret)
    eso_resources_config:
      secret_store_refresh_interval: 60   # int (секунды); SecretStoreSpec.refreshInterval
      external_secret_refresh_interval: "1m"  # string (Golang Duration); ExternalSecretSpec.refreshInterval (default, per-secret override через refresh_interval)
      external_secret_refresh_policy: "Periodic"  # ExternalSecretSpec.refreshPolicy
    # ---
    # ---
    # Helm timeouts
    external_secrets_pre_helm_timeout: "5m"
    # extraObjects (operator-side, default empty) — добавление произвольных K8s resources
    external_secrets_pre_extra_objects: []
    # Pre-phase kustomize patches (operator-side customization, default empty)
    external_secrets_pre_kustomize_patches: []
    # Pre-phase values (NetworkPolicies chart)
    external_secrets_pre_helm_values:
      namespace: "{{ external_secrets_namespace }}"
      extraObjects: "{{ external_secrets_pre_extra_objects }}"
    # ---
    # ---
    external_secrets_install_helm_timeout: "5m"
    external_secrets_rollout_timeout: "300s"
    # Restart-phase rollout wait timeout (external-secrets-restart.yaml) — independent from install
    external_secrets_restart_rollout_timeout: "300s"
    # Deployments waited on after install and restarted by external-secrets-restart.yaml
    external_secrets_rollout_resources:
      - deployment.apps/external-secrets
      - deployment.apps/external-secrets-webhook
      - deployment.apps/external-secrets-cert-controller
    # CRDs waited on after the official chart install (chart-version-coupled)
    external_secrets_crds_list:
      - crd/externalsecrets.external-secrets.io
      - crd/clustersecretstores.external-secrets.io
      - crd/secretstores.external-secrets.io
      - crd/clusterexternalsecrets.external-secrets.io
      - crd/pushsecrets.external-secrets.io
      - crd/clusterpushsecrets.external-secrets.io
      - crd/acraccesstokens.generators.external-secrets.io
      - crd/cloudsmithaccesstokens.generators.external-secrets.io
      - crd/clustergenerators.generators.external-secrets.io
      - crd/ecrauthorizationtokens.generators.external-secrets.io
      - crd/fakes.generators.external-secrets.io
      - crd/gcraccesstokens.generators.external-secrets.io
      - crd/generatorstates.generators.external-secrets.io
      - crd/githubaccesstokens.generators.external-secrets.io
      - crd/grafanas.generators.external-secrets.io
      - crd/mfas.generators.external-secrets.io
      - crd/passwords.generators.external-secrets.io
      - crd/quayaccesstokens.generators.external-secrets.io
      - crd/sshkeys.generators.external-secrets.io
      - crd/stssessiontokens.generators.external-secrets.io
      - crd/uuids.generators.external-secrets.io
      - crd/vaultdynamicsecrets.generators.external-secrets.io
      - crd/webhooks.generators.external-secrets.io
    # Helm repository - источник chart (переопределить в hosts-vars-override/ для airgap)
    external_secrets_helm_is_oci: false
    external_secrets_helm_url: "https://charts.external-secrets.io"
    external_secrets_helm_repo_name: "external-secrets"
    external_secrets_helm_chart_name: "external-secrets"
    external_secrets_helm_chart_version: "2.5.0"
    # Replica counts (SCALE) — controller, webhook, cert-controller.
    external_secrets_helm_values_replica_count: 1
    external_secrets_helm_values_webhook_replica_count: 1
    external_secrets_helm_values_cert_controller_replica_count: 1
    # --- round-3 blocks (extracted from external_secrets_helm_values) ---
    external_secrets_helm_values_webhook:
      tolerations: []
      nodeSelector: {}
      affinity: {}
      replicaCount: "{{ external_secrets_helm_values_webhook_replica_count }}"
      resources: {}
      metrics:
        listen:
          port: 8080
        service:
          enabled: true
          port: 8080
    external_secrets_helm_values_cert_controller:
      tolerations: []
      nodeSelector: {}
      affinity: {}
      replicaCount: "{{ external_secrets_helm_values_cert_controller_replica_count }}"
      resources: {}
      metrics:
        listen:
          port: 8080
        service:
          enabled: true
          port: 8080
    external_secrets_helm_values_extra_args:
      client-burst: 200
      # concurrent: 10 # Говорит, что тут есть конфликт с другим параметром
      enable-managed-secrets-caching: "false"
      store-requeue-interval: "1m0s"
    # ---------
    # Helm chart values
    external_secrets_helm_values:
      concurrent: 10
      tolerations: []
      metrics:
        listen:
          port: 8080
        service:
          enabled: true
          port: 8080
      nodeSelector: {}
      affinity: {}
      replicaCount: "{{ external_secrets_helm_values_replica_count }}"
      resources: {}
      webhook: "{{ external_secrets_helm_values_webhook }}"
      certController: "{{ external_secrets_helm_values_cert_controller }}"
      extraArgs: "{{ external_secrets_helm_values_extra_args }}"
      serviceMonitor:
        enabled: true
        renderMode: "alwaysRender"
        interval: "30s"
        scrapeTimeout: "25s"
        additionalLabels: {}
