all:
  vars:
    # fail2ban — security daemon, защита от brute-force.
    # Каждый item рендерится в /etc/fail2ban/jail.d/<filename>. Filename ОБЯЗАН
    # начинаться с "ansible-" (для auto-cleanup). Оператор для смены full-replace'ит
    # массив через override-inventory (любой файл в hosts-vars-override/). Применяется playbook-system/prepare-linux-pkgs.yaml (FAIL2BAN phase).
    # ignoreip: localhost + адреса VPN (vpn_ips) никогда не банятся — на узлах
    # (здесь) и на bastion (bastion_proxy_haproxy_fail2ban_jail). При SSH "только
    # VPN" весь вход идёт с этих адресов, бан закрыл бы хост для всей команды.
    # Пустой vpn_ips -> ignoreip = 127.0.0.1/8 ::1. Смена файла на узлах =
    # restart fail2ban, без reboot.
    fail2ban_jail_d_files:
      - filename: ansible-defaults.conf
        content: |
          [DEFAULT]
          bantime  = 1h
          findtime = 10m
          maxretry = 5
          backend  = systemd
          ignoreip = {{ (['127.0.0.1/8', '::1'] + vpn_ips) | join(' ') }}
      - filename: ansible-sshd.conf
        content: |
          [sshd]
          enabled = true
          port    = ssh
          filter  = sshd
          logpath = %(sshd_log)s

    # sshd hardening — drop-ins в /etc/ssh/sshd_config.d/.
    # Каждый item: {filename, content}. Filename ОБЯЗАН начинаться с "00-ansible-"
    # (для auto-cleanup). Оператор для смены набора full-replace'ит массив через
    # override-inventory (любой файл в hosts-vars-override/). Применяется playbook-system/prepare-linux-pkgs.yaml (SSHD phase).
    # Префикс 00-: sshd читает sshd_config.d/*.conf по алфавиту и берёт ПЕРВОЕ
    # значение параметра. 00-ansible-* читается раньше 50-cloud-init.conf образа
    # (cloud-init пишет туда PasswordAuthentication yes по ssh_pwauth из user-data).
    # Вход только по ключу проверяется плейбуком по итогу (sshd -T) независимо
    # от содержимого массива.
    # PerSourcePenaltyExemptList: localhost + vpn_ips не получают штрафов OpenSSH
    # (PerSourcePenalties, OpenSSH 9.8+): вся команда входит с одного адреса VPN,
    # и неудачные попытки одного человека иначе блокировали бы вход всем.
    # Сети — только адресом сети (127.0.0.0/8, не 127.0.0.1/8): иначе sshd -t падает.
    sshd_config_d_files:
      - filename: 00-ansible-hardening.conf
        content: |
          # Ansible-managed sshd hardening — disable password auth, keys only.
          PasswordAuthentication no
          PermitEmptyPasswords no
          KbdInteractiveAuthentication no
          PerSourcePenaltyExemptList {{ (['127.0.0.0/8', '::1'] + vpn_ips) | join(',') }}
