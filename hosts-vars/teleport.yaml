all:
  vars:
    # Флаг компонента (default false, opt-in): guard в teleport-install.yaml, teleport-restart.yaml и teleport-ssh-agent-install.yaml.
    teleport_enabled: false

    # ------

    teleport_namespace: "teleport"
    # Идентичность кластера. teleport_domain = clusterName = webauthn rp_id —
    # НЕИЗМЕНЯЕМ после первого деплоя (смена = переустановка с потерей состояния).
    teleport_domain: "teleport-k8s-v2.drawapp.ru"
    teleport_cluster_name: "{{ teleport_domain }}"
    # Имя Kubernetes-кластера внутри Teleport (tsh kube ls, контексты kubeconfig) и его метки
    # (по ним роли матчат кластер через kubernetes_labels).
    teleport_kube_cluster_name: "drawapp-k8s-v2"
    teleport_kube_cluster_labels: {}
    # Один публичный адрес на всё (multiplex): Web UI, tsh, kubectl, агенты нод.
    teleport_web_public_addr: "{{ teleport_cluster_name }}:443"
    # Порты (фиксированы чартом): web 3080 — proxy (Service 443 -> 3080); diag 3000 — auth + proxy (/metrics).
    teleport_web_port: 3080
    teleport_diag_port: 3000
    teleport_tls_secret_name: "cert-teleport"
    teleport_ingress_class_name: "traefik-lb"

    # ------
    # ------
    # ------

    teleport_acme_issuer_name: "teleport-acme"
    teleport_acme_private_key_name: "teleport-acme-account-key"
    teleport_acme_server: "https://acme-v02.api.letsencrypt.org/directory"
    teleport_acme_email: "some-email-123@gmail.com"
    teleport_acme_solvers:
      - http01:
          ingress:
            ingressClassName: "traefik-lb"
            ingressTemplate:
              metadata:
                annotations:
                  "kubernetes.io/ingress.class": "traefik-lb"
                  "traefik.ingress.kubernetes.io/router.entrypoints": "web"
            podTemplate:
              metadata:
                labels:
                  app.kubernetes.io/name: acme-solver
                  app.kubernetes.io/instance: traefik-lb
                  app.kubernetes.io/component: acme-http01-solver
                  app.kubernetes.io/managed-by: cert-manager

    teleport_cert_manager_issuer_enabled: true
    teleport_cert_manager_issuer:
      enabled: "{{ teleport_cert_manager_issuer_enabled }}"
      name: "{{ teleport_acme_issuer_name }}"
      spec:
        acme:
          server: "{{ teleport_acme_server }}"
          email: "{{ teleport_acme_email }}"
          privateKeySecretRef:
            name: "{{ teleport_acme_private_key_name }}"
          solvers: "{{ teleport_acme_solvers }}"

    # ------
    # ------
    # ------

    # Сертификат прокси — плоский объект {enabled, name, spec}. TLS терминирует сам Teleport
    # (passthrough), под прокси монтирует секрет как обязательный том — поэтому Certificate
    # живёт в pre, а install ждёт секрет. enabled=false: секрет кладётся заранее вручную.
    teleport_proxy_certificate_enabled: true
    teleport_proxy_certificate:
      enabled: "{{ teleport_proxy_certificate_enabled }}"
      name: "{{ teleport_tls_secret_name }}"
      spec:
        secretName: "{{ teleport_tls_secret_name }}"
        dnsNames:
          - "{{ teleport_domain }}"
        issuerRef:
          name: "{{ teleport_acme_issuer_name }}"
          kind: "Issuer"

    # Traefik IngressRouteTCP на websecure, tls.passthrough: Traefik не расшифровывает TLS,
    # Teleport терминирует его сам (mTLS + ALPN для tsh, kubectl и агентов).
    # Только точные SNI и regexp — НЕ HostSNI(`*`). HTTP IngressRoute с Host() этого же домена
    # на websecure перехватит SNI у TCP-роутера (приоритет Traefik) — такого быть не должно.
    teleport_ingress_route_tcp_enabled: true
    teleport_ingress_route_tcp_config:
      enabled: "{{ teleport_ingress_route_tcp_enabled }}"
      ingressClass: "{{ teleport_ingress_class_name }}"
      entryPoint: "{{ traefik_websecure_entrypoint }}"
      # Web UI, tsh login, агенты — домен; нативный kubectl — kube-teleport-proxy-alpn.<домен>.
      hostSNIs:
        - "{{ teleport_domain }}"
        - "kube-teleport-proxy-alpn.{{ teleport_domain }}"
      # tsh ssh/ls (gRPC) — <hex(clusterName)>.teleport.cluster.local; клиенты по identity-файлу — teleport.cluster.local.
      hostSNIRegexps:
        - '^(.+\.)?teleport\.cluster\.local$'
      # Traefik -> Teleport: PROXY v2 с реальным IP клиента (у Teleport proxyProtocol "on").
      proxyProtocolVersion: 2

    # ---
    # --- PHASE: pre ---
    # Timeouts
    teleport_pre_helm_timeout: "5m"
    # extraObjects (operator-side, default empty) — добавление произвольных K8s resources
    teleport_pre_extra_objects: []
    # Pre-phase kustomize patches (operator-side customization, default empty)
    teleport_pre_kustomize_patches: []
    # Pre-phase values (NetworkPolicies + Issuer + Certificate)
    teleport_pre_helm_values:
      namespace: "{{ teleport_namespace }}"
      traefik:
        namespace: "{{ traefik_namespace }}"
        instanceName: "traefik-{{ traefik_namespace }}"
      teleport:
        webPort: "{{ teleport_web_port }}"
        diagPort: "{{ teleport_diag_port }}"
      issuer: "{{ teleport_cert_manager_issuer }}"
      certificateConfig: "{{ teleport_proxy_certificate }}"
      extraObjects: "{{ teleport_pre_extra_objects }}"
    # ---
    # --- PHASE: install ---
    teleport_install_helm_timeout: "10m"
    teleport_install_rollout_timeout: "300s"
    # Restart-phase rollout wait timeout (teleport-restart.yaml) — independent from install
    teleport_install_restart_rollout_timeout: "300s"
    # Deployments waited on after install and restarted by teleport-restart.yaml
    teleport_install_rollout_resources:
      - deployment.apps/teleport-auth
      - deployment.apps/teleport-proxy
      - deployment.apps/teleport-operator
    # CRDs waited on after install — рендерит сабчарт оператора релиза teleport (chart-version-coupled)
    teleport_crds_list:
      - crd/teleportaccesslists.resources.teleport.dev
      - crd/teleportaccessmonitoringrulesv1.resources.teleport.dev
      - crd/teleportappsv3.resources.teleport.dev
      - crd/teleportautoupdateconfigsv1.resources.teleport.dev
      - crd/teleportautoupdateversionsv1.resources.teleport.dev
      - crd/teleportbotsv1.resources.teleport.dev
      - crd/teleportdatabasesv3.resources.teleport.dev
      - crd/teleportgithubconnectors.resources.teleport.dev
      - crd/teleportinferencemodels.resources.teleport.dev
      - crd/teleportinferencepolicies.resources.teleport.dev
      - crd/teleportinferencesecrets.resources.teleport.dev
      - crd/teleportlocksv2.resources.teleport.dev
      - crd/teleportloginrules.resources.teleport.dev
      - crd/teleportoidcconnectors.resources.teleport.dev
      - crd/teleportoktaimportrules.resources.teleport.dev
      - crd/teleportopenssheiceserversv2.resources.teleport.dev
      - crd/teleportopensshserversv2.resources.teleport.dev
      - crd/teleportprovisiontokens.resources.teleport.dev
      - crd/teleportretrievalmodelsv1.resources.teleport.dev
      - crd/teleportroles.resources.teleport.dev
      - crd/teleportrolesv6.resources.teleport.dev
      - crd/teleportrolesv7.resources.teleport.dev
      - crd/teleportrolesv8.resources.teleport.dev
      - crd/teleportsamlconnectors.resources.teleport.dev
      - crd/teleportsamlidpserviceprovidersv1.resources.teleport.dev
      - crd/teleportscopedroleassignmentsv1.resources.teleport.dev
      - crd/teleportscopedrolesv1.resources.teleport.dev
      - crd/teleportscopedtokensv1.resources.teleport.dev
      - crd/teleporttrustedclustersv2.resources.teleport.dev
      - crd/teleportusers.resources.teleport.dev
      - crd/teleportworkloadidentitiesv1.resources.teleport.dev
    # Helm repository - источник chart (переопределить в hosts-vars-override/ для airgap)
    teleport_helm_is_oci: false
    teleport_helm_url: "https://charts.releases.teleport.dev"
    teleport_helm_repo_name: "teleport"
    teleport_helm_chart_name: "teleport-cluster"
    teleport_helm_chart_version: "18.11.4"
    # SQLite + файлы аудита на одном RWO PVC auth (LINSTOR) — поэтому auth ровно 1 реплика.
    teleport_data_storage_class: "lnstr-major-local"
    teleport_data_storage_size: "10Gi"
    # ВАЖНО: tag для teleport-distroless / teleport-operator НЕ задаётся —
    # teleport-cluster chart автоматически подставляет appVersion (= teleport_helm_chart_version)
    # через helper {{ include "teleport-cluster.version" . }}.
    # Т.е. обновление версии Teleport = bump teleport_helm_chart_version.
    # Аудит — файлы на PVC auth (поиск в Web UI работает). Teleport их НИКОГДА не удаляет:
    # sidecar раз в час удаляет суточные файлы старше teleport_audit_retention_days суток.
    # Каталог = <точка монтирования PVC в чарте (фиксирована upstream)>/<subpath>; sidecar монтирует
    # только subpath — к SQLite-базе и ключам auth у него доступа нет.
    teleport_auth_data_dir: "/var/lib/teleport"
    teleport_audit_events_subpath: "audit/events"
    teleport_audit_events_dir: "{{ teleport_auth_data_dir }}/{{ teleport_audit_events_subpath }}"
    teleport_audit_retention_days: 14
    teleport_audit_retention_image: "docker.io/busybox:1.36"
    teleport_audit_retention_container:
      name: "audit-retention"
      image: "{{ teleport_audit_retention_image }}"
      command: ["/bin/sh", "-c"]
      # find -mtime +N = возраст >= N+1 суток, отсюда N-1. trap + wait: sh как PID 1 не держит
      # SIGTERM весь terminationGracePeriod (auth — Recreate, это прямой простой).
      args:
        - >-
          trap 'exit 0' TERM INT;
          while true; do
          find {{ teleport_audit_events_dir }} -type f -name '*.log' -mtime +{{ teleport_audit_retention_days | int - 1 }} -delete;
          sleep 3600 & wait $!;
          done
      volumeMounts:
        - name: "data"
          mountPath: "{{ teleport_audit_events_dir }}"
          subPath: "{{ teleport_audit_events_subpath }}"
    # --- Operator-overridable blocks (extracted from teleport_helm_values) ---
    teleport_helm_values_chart_mode: standalone
    # multiplex: всё на одном 443 (TLS routing по ALPN/SNI).
    teleport_helm_values_proxy_listener_mode: multiplex
    # "on": Teleport требует PROXY-заголовок (его ставит Traefik ServersTransportTCP). Только строкой в кавычках.
    teleport_helm_values_proxy_protocol: "on"
    # Запись сессий выключена (SSH и kube). Только строкой в кавычках: голое off станет false.
    teleport_helm_values_session_recording: "off"
    # Локальные пользователи; второй фактор обязателен (в v18 отключить нельзя): OTP или passkey.
    teleport_helm_values_authentication:
      type: local
      localAuth: true
      secondFactors: ["otp", "webauthn"]
    teleport_helm_values_auth:
      # Ровно 1 реплика: SQLite и файлы аудита на одном RWO PVC (HA auth требует Postgres).
      highAvailability:
        replicaCount: 1
      teleportConfig:
        teleport:
          storage:
            type: sqlite
            sync: NORMAL
            journal: WAL
            audit_events_uri:
              - "file://{{ teleport_audit_events_dir }}"
      extraContainers:
        - "{{ teleport_audit_retention_container }}"
    # Прокси без состояния — 2 реплики (чарт разрешает >1 при tls.existingSecretName).
    teleport_helm_values_proxy:
      highAvailability:
        replicaCount: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
    teleport_helm_values_operator:
      enabled: true
      tolerations: []
      nodeSelector: {}
      affinity: {}
      resources: {}
    # --- round-4 blocks (extracted from teleport_helm_values) ---
    teleport_helm_values_persistence:
      enabled: true
      storageClassName: "{{ teleport_data_storage_class }}"
      volumeSize: "{{ teleport_data_storage_size }}"
    # ---------
    teleport_helm_values:
      clusterName: "{{ teleport_cluster_name }}"
      kubeClusterName: "{{ teleport_kube_cluster_name }}"
      labels: "{{ teleport_kube_cluster_labels }}"
      chartMode: "{{ teleport_helm_values_chart_mode }}"
      proxyListenerMode: "{{ teleport_helm_values_proxy_listener_mode }}"
      publicAddr:
        - "{{ teleport_web_public_addr }}"
      proxyProtocol: "{{ teleport_helm_values_proxy_protocol }}"
      sessionRecording: "{{ teleport_helm_values_session_recording }}"
      authentication: "{{ teleport_helm_values_authentication }}"
      tls:
        existingSecretName: "{{ teleport_tls_secret_name }}"
      persistence: "{{ teleport_helm_values_persistence }}"
      auth: "{{ teleport_helm_values_auth }}"
      proxy: "{{ teleport_helm_values_proxy }}"
      operator: "{{ teleport_helm_values_operator }}"
      log:
        format: json
      service:
        type: ClusterIP
      # PodMonitor — в стадии post (паттерн репо), не в upstream-чарте.
      podMonitor:
        enabled: false
      tolerations: []
      nodeSelector: {}
      affinity: {}
      resources: {}
      ingress:
        enabled: false
    # ---
    # --- PHASE: post ---
    teleport_post_helm_timeout: "5m"
    # Service прокси (имя = релиз teleport, порт 443 -> 3080)
    teleport_web_service_name: "teleport"
    teleport_web_service_port: 443
    # PodMonitor auth + proxy (порт diag)
    teleport_pod_monitor_enabled: true
    teleport_pod_monitor_interval: "30s"
    teleport_pod_monitor_scrape_timeout: "15s"
    teleport_pod_monitor_labels: {}
    teleport_pod_monitor_selector:
      app.kubernetes.io/name: teleport-cluster
      app.kubernetes.io/instance: teleport
    # extraObjects (operator-side, default empty) — добавление произвольных K8s resources
    teleport_post_extra_objects: []
    # Post-phase kustomize patches (operator-side customization, default empty)
    teleport_post_kustomize_patches: []
    # Post-phase values (IngressRouteTCP + ServersTransportTCP + PodMonitor)
    teleport_post_helm_values:
      namespace: "{{ teleport_namespace }}"
      ingressRouteTcpConfig: "{{ teleport_ingress_route_tcp_config }}"
      service:
        name: "{{ teleport_web_service_name }}"
        port: "{{ teleport_web_service_port }}"
      podMonitor:
        enabled: "{{ teleport_pod_monitor_enabled }}"
        interval: "{{ teleport_pod_monitor_interval }}"
        scrapeTimeout: "{{ teleport_pod_monitor_scrape_timeout }}"
        labels: "{{ teleport_pod_monitor_labels }}"
        selector: "{{ teleport_pod_monitor_selector }}"
      extraObjects: "{{ teleport_post_extra_objects }}"
    # ---
    # --- PHASE: cfg (роли и пользователи Teleport + RBAC Kubernetes для их групп) ---
    # Роли и пользователи — CR оператора Teleport (TeleportRoleV8 / TeleportUser) в namespace teleport.
    # Полная синхронизация: элемент убран из списков -> helm удаляет CR -> оператор удаляет объект
    # в Teleport (у пользователя — вместе с паролем и MFA). Пароль не декларативен: первый вход —
    # по ссылке `tctl users reset <user>`. Права в Kubernetes даёт не Teleport, а RBAC на группу из
    # kubernetes_groups роли (Teleport ходит в apiserver через impersonation).
    teleport_cfg_helm_timeout: "5m"
    # Группа Kubernetes полного доступа (ClusterRoleBinding -> ClusterRole cluster-admin).
    teleport_cfg_kube_admin_group: "teleport:cluster-admin"
    # Роли (TeleportRoleV8). Имя не должно совпадать с preset-ролью Teleport (access, editor, ...).
    # logins = traits.logins пользователя: агент создаёт OS-пользователя при входе и удаляет его
    # после завершения сессии (insecure-drop), sudo без пароля. У такого пользователя нет домашнего
    # каталога (HOME=/); группа с тем же именем, уже существующая на ноде, блокирует вход.
    teleport_cfg_roles:
      # Полный доступ, включая управление Teleport (роли, пользователи, токены).
      - name: superadmin
        labels: {}
        annotations: {}
        spec:
          allow:
            rules:
              - resources: ["*"]
                verbs: ["*"]
            logins: ["{% raw %}{{internal.logins}}{% endraw %}"]
            node_labels:
              "*": "*"
            host_sudoers: ["ALL=(ALL) NOPASSWD: ALL"]
            kubernetes_labels:
              "*": "*"
            kubernetes_groups: ["{{ teleport_cfg_kube_admin_group }}"]
            kubernetes_resources:
              - kind: "*"
                api_group: "*"
                namespace: "*"
                name: "*"
                verbs: ["*"]
          options:
            max_session_ttl: 12h0m0s
            create_host_user_mode: insecure-drop
            create_host_user_default_shell: /bin/bash
      # kubectl cluster-admin + SSH с sudo, без прав на ресурсы Teleport через tsh/UI. Фактически тоже
      # админ Teleport: cluster-admin даёт exec в под teleport-auth, а tctl там — встроенный Admin.
      - name: admin
        labels: {}
        annotations: {}
        spec:
          allow:
            logins: ["{% raw %}{{internal.logins}}{% endraw %}"]
            node_labels:
              "*": "*"
            host_sudoers: ["ALL=(ALL) NOPASSWD: ALL"]
            kubernetes_labels:
              "*": "*"
            kubernetes_groups: ["{{ teleport_cfg_kube_admin_group }}"]
            kubernetes_resources:
              - kind: "*"
                api_group: "*"
                namespace: "*"
                name: "*"
                verbs: ["*"]
          options:
            max_session_ttl: 12h0m0s
            create_host_user_mode: insecure-drop
            create_host_user_default_shell: /bin/bash
    teleport_cfg_roles_extra: []
    # Пользователи (TeleportUser). traits.logins — имя OS-пользователя на нодах.
    teleport_cfg_users:
      - name: superadmin
        labels: {}
        annotations: {}
        spec:
          roles: [superadmin]
          traits:
            logins: [superadmin]
    teleport_cfg_users_extra: []
    # RBAC Kubernetes для групп из kubernetes_groups. Объекты в cluster scope / чужих namespace —
    # имя только с префиксом teleport-managed-* (playbook-conventions.md §17.12).
    #   ClusterRole:         {name, labels?, annotations?, rules}
    #   ClusterRoleBinding:  {name, labels?, annotations?, roleRef, subjects}
    #   RoleBinding:         {name, namespace, labels?, annotations?, roleRef, subjects}
    teleport_cfg_rbac_cluster_roles: []
    teleport_cfg_rbac_cluster_roles_extra: []
    teleport_cfg_rbac_cluster_role_bindings:
      - name: teleport-managed-cluster-admin
        labels: {}
        annotations: {}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - apiGroup: rbac.authorization.k8s.io
            kind: Group
            name: "{{ teleport_cfg_kube_admin_group }}"
    teleport_cfg_rbac_cluster_role_bindings_extra: []
    teleport_cfg_rbac_role_bindings: []
    teleport_cfg_rbac_role_bindings_extra: []
    # Перед apply оператор перезапускается: на старте он применяет ВСЕ CR (исправляет дрейф,
    # сделанный в UI/tctl) и получает свежий сертификат. Результат проверяется в самом Teleport.
    teleport_cfg_operator_rollout_resources:
      - deployment.apps/teleport-operator
    teleport_cfg_operator_rollout_timeout: "300s"
    # tctl внутри пода auth (встроенная Admin-идентичность, без RBAC и MFA)
    teleport_tctl_exec_target: "deployment/teleport-auth"
    teleport_cfg_reconcile_wait:
      retries: 30
      delay: 5
    # Объекты не из IaC, которые не надо показывать в отчёте (bootstrap upstream-чарта).
    teleport_cfg_unmanaged_ignore_roles: ["operator"]
    teleport_cfg_unmanaged_ignore_users: []
    # extraObjects (operator-side, default empty) — добавление произвольных K8s resources
    teleport_cfg_extra_objects: []
    # Cfg-phase kustomize patches (operator-side customization, default empty)
    teleport_cfg_kustomize_patches: []
    # Cfg-phase values (Teleport Operator CRs + RBAC Kubernetes)
    teleport_cfg_helm_values:
      namespace: "{{ teleport_namespace }}"
      roles: "{{ teleport_cfg_roles + teleport_cfg_roles_extra }}"
      users: "{{ teleport_cfg_users + teleport_cfg_users_extra }}"
      rbacClusterRoles: "{{ teleport_cfg_rbac_cluster_roles + teleport_cfg_rbac_cluster_roles_extra }}"
      rbacClusterRoleBindings: "{{ teleport_cfg_rbac_cluster_role_bindings + teleport_cfg_rbac_cluster_role_bindings_extra }}"
      rbacRoleBindings: "{{ teleport_cfg_rbac_role_bindings + teleport_cfg_rbac_role_bindings_extra }}"
      extraObjects: "{{ teleport_cfg_extra_objects }}"

    # ---------
    # SSH-AGENT (systemd на managers:workers — teleport-ssh-agent-install.yaml)
    # ---------

    # Версия агента = версия работающего кластера (сверяется с подом auth; агент новее auth
    # кластер не примет). Обновление: сначала teleport-install.yaml, потом агенты.
    teleport_ssh_agent_version: "18.11.4"
    # apt-репозиторий Teleport (Community-пакет teleport). Канал = stable/v<мажор teleport_ssh_agent_version>,
    # меняется вместе с версией.
    teleport_ssh_agent_apt_key_url: "https://apt.releases.teleport.dev/gpg"
    teleport_ssh_agent_apt_keyring: "/etc/apt/keyrings/teleport-archive-keyring.asc"
    teleport_ssh_agent_apt_repo_url: "https://apt.releases.teleport.dev/ubuntu"
    teleport_ssh_agent_apt_channel: "stable/v18"
    # Идентичность ноды (сертификаты, host_uuid). Повторный прогон её НЕ стирает.
    teleport_ssh_agent_data_dir: "/var/lib/teleport"
    # Файл с токеном подключения: пишется только для нод, которых Teleport не видит;
    # Teleport читает его лишь в момент подключения.
    teleport_ssh_agent_join_token_path: "/etc/teleport-join-token"
    teleport_ssh_agent_join_token_ttl: "15m"
    teleport_ssh_agent_log_level: "INFO"
    # Статические метки ноды (матчинг node_labels в ролях); per-host значения — в hosts.yaml.
    teleport_ssh_agent_node_labels: {}
    # Ожидание, пока каждая нода появится в Teleport
    teleport_ssh_agent_join_wait:
      retries: 30
      delay: 10
    # Деструктивно: стереть идентичность ноды и подключить заново. Ставится per-host в hosts.yaml;
    # пока true, каждый прогон сбрасывает ноду заново — после сброса вернуть false.
    teleport_ssh_agent_reset_identity: false
