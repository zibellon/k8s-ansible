all:
  vars:
    # Vault (HashiCorp) — managed by bank-vaults operator
    # Operator: oci://ghcr.io/bank-vaults/helm-charts/vault-operator
    # Vault CR: playbook-app/charts/vault/cr/
    # 1 namespace = 1 SA + 1 SecretStore (для ESO)
    # sa_name - это название ServiceAccount (который будет создан в этом namespace)
    # role_name - это название Role (Внутри Vault - auth/kubernetes/role/${role_name})
    # secret_store_name - это название SecretStore (который будет создан в этом namespace)
    # ---
    # secrets - это массив ExternalSecret (который будет создан в этом namespace)
    # name - это название ExternalSecret
    # target_secret - это название секрета в Kubernetes (который будет создан в этом namespace)
    # vault_path - это full path в Vault
    # refresh_interval - опциональное переопределение интервала (иначе используется eso_resources_config.external_secret_refresh_interval)
    # ---------
    vault_namespace: "vault"

    vault_internal_url: "http://vault.{{ vault_namespace }}.svc.{{ cluster_dns_domain }}:8200"

    vault_ui_domain: "vault-k8s-v2.drawapp.ru"
    vault_ui_https_secret_name: "cert-vault-ui"
    vault_ui_vpn_only_enabled: false
    vault_ui_ingress_class_name: "traefik-lb"

    # ------
    # ------
    # ------

    vault_acme_issuer_name: "vault-acme"
    vault_acme_private_key_name: "vault-acme-account-key"
    vault_acme_server: "https://acme-v02.api.letsencrypt.org/directory"
    vault_acme_email: "some-email-123@gmail.com"
    vault_acme_solvers:
      - http01:
          ingress:
            ingressClassName: "traefik-lb"
            ingressTemplate:
              metadata:
                annotations:
                  "kubernetes.io/ingress.class": "traefik-lb"
                  "traefik.ingress.kubernetes.io/router.entrypoints": "web"
            podTemplate:
              metadata:
                labels:
                  app.kubernetes.io/name: acme-solver
                  app.kubernetes.io/instance: traefik-lb
                  app.kubernetes.io/component: acme-http01-solver
                  app.kubernetes.io/managed-by: cert-manager
    vault_cert_manager_issuer_enabled: true
    vault_cert_manager_issuer:
      enabled: "{{ vault_cert_manager_issuer_enabled }}"
      name: "{{ vault_acme_issuer_name }}"
      spec:
        acme:
          server: "{{ vault_acme_server }}"
          email: "{{ vault_acme_email }}"
          privateKeySecretRef:
            name: "{{ vault_acme_private_key_name }}"
          solvers: "{{ vault_acme_solvers }}"

    # ------
    # ------
    # ------

    vault_ui_ingress_enabled: true
    vault_ui_ingress_tls_enabled: true
    vault_ui_certificate_enabled: true
    vault_ui_ingress_config:
      enabled: "{{ vault_ui_ingress_enabled }}"
      domain: "{{ vault_ui_domain }}"
      ingressClass: "{{ vault_ui_ingress_class_name }}"
      tlsEnabled: "{{ vault_ui_ingress_tls_enabled }}"
      tlsSecretName: "{{ vault_ui_https_secret_name }}"
      vpnOnlyEnabled: "{{ vault_ui_vpn_only_enabled }}"
      vpnIngressMiddlewares: "{{ vpn_ingress_middlewares }}"
    # cert-manager Certificate (per-domain) — плоский объект {enabled, name, spec}.
    # Полный raw spec → issuer указывается через spec.issuerRef (любой Issuer/ClusterIssuer).
    vault_ui_certificate:
      enabled: "{{ vault_ui_certificate_enabled }}"
      name: "{{ vault_ui_https_secret_name }}"
      spec:
        secretName: "{{ vault_ui_https_secret_name }}"
        dnsNames:
          - "{{ vault_ui_domain }}"
        issuerRef:
          name: "{{ vault_acme_issuer_name }}"
          kind: "Issuer"

    vault_creds_host_path: "/etc/kubernetes/vault-unseal.json"
    # Temp-file with new unseal keys + root token, written during vault-rotate.yaml
    # between `vault operator rekey` and K8s Secret replace. Enables resume on crash.
    # Format: same JSON as vault_creds_host_path. Deleted at end of successful rotate.
    vault_rekey_temp_file_path: "/etc/kubernetes/vault-rekey-in-progress.json"

    # Prometheus metrics port (Vault API)
    vault_prometheus_port: 8200 # NOT CHANGE
    # Prometheus ServiceMonitor
    vault_service_monitor_enabled: true
    vault_service_monitor_interval: "30s"
    vault_service_monitor_scrape_timeout: "10s"
    vault_service_monitor_additional_labels: {}

    vault_rollout_timeout: "300s"
    # Restart-phase rollout wait timeouts (vault-restart.yaml, per stage)
    vault_operator_restart_rollout_timeout: "300s"
    vault_cr_restart_rollout_timeout: "300s"
    # Deployment waited on after the vault-operator install stage
    vault_operator_rollout_resources:
      - deployment.apps/vault-operator
    # CRD waited on after the vault-operator install stage (version-coupled)
    vault_operator_crds_list:
      - crd/vaults.vault.banzaicloud.com
    # StatefulSet waited on after the vault-cr install stage
    vault_cr_rollout_resources:
      - statefulset.apps/vault

    # === SECTION: OIDC / SSO (ZITADEL) ===
    # Человеческий вход в Vault UI через ZITADEL. Включается ТОЛЬКО в
    # hosts-vars-override/<cluster>/vault.yaml и ТОЛЬКО после того, как ZITADEL поднят,
    # Application заведён и client_secret положен в сам Vault (eso-secret/vault/oidc).
    # Порядок bootstrap: Vault(OIDC=false) -> ZITADEL -> Application -> секрет -> Vault(OIDC=true).
    vault_oidc_enabled: false
    # userpass — legacy человеческий вход. false = УДАЛЕНИЕ метода: он пропадает и из
    # vault_spec_auth, и из purgeUnmanagedConfig.exclude, поэтому purge отключает mount
    # userpass вместе со всеми ручными юзерами и паролями.
    # ВНИМАНИЕ: после false единственный break-glass — root token из K8s Secret
    # vault_unsealer_secret_name / файла vault_creds_host_path.
    vault_userpass_enabled: true

    vault_oidc_issuer: "https://{{ zitadel_domain }}"
    # clientID — НЕ секрет; реальное значение задаётся в hosts-vars-override/.
    vault_oidc_client_id: ""
    # Путь mount'а auth-метода. Он же group-aliases[].mountpath и сегмент в UI redirect URI.
    vault_oidc_mount_path: "oidc"
    # Имя OIDC-роли; оно же default_role (вход из UI без ввода имени роли).
    vault_oidc_role_name: "default"
    # Claim, по которому Vault определяет и пользователя, и его группу.
    # ZITADEL preferred_username = полный loginName <login>@<org-domain>.
    vault_oidc_user_claim: "preferred_username"
    vault_oidc_groups_claim: "preferred_username"
    # scopes БЕЗ "openid" — Vault добавляет его сам.
    # org-pin "urn:zitadel:iam:org:id:<orgId>" добавляется в hosts-vars-override/.
    vault_oidc_scopes:
      - profile
      - email
    vault_oidc_token_ttl: "1h"
    vault_oidc_token_max_ttl: "4h"
    # true пишет полный набор claim'ов в лог Vault. Только для отладки, НЕ держать в prod.
    vault_oidc_verbose_logging: false
    vault_oidc_ui_redirect_uri: "https://{{ vault_ui_domain }}/ui/vault/auth/{{ vault_oidc_mount_path }}/oidc/callback"
    vault_oidc_cli_redirect_uri: "http://localhost:8250/oidc/callback"
    vault_oidc_allowed_redirect_uris:
      - "{{ vault_oidc_ui_redirect_uri }}"
      - "{{ vault_oidc_cli_redirect_uri }}"
    # Имя env-переменной, которую bank-vaults CONFIGURER подставляет в oidc_client_secret
    # через ${ .Env.<name> }. Инъекция — spec.envsConfig (НЕ vaultEnvsConfig).
    vault_oidc_client_secret_env_name: "VAULT_OIDC_CLIENT_SECRET"
    # Имя поля и в Vault KV, и в материализованном K8s Secret.
    vault_oidc_secret_key_client_secret: "clientSecret"

    # === SECTION 2: ESO ===
    # Vault — ОДНОВРЕМЕННО источник ESO и (при vault_oidc_enabled=true) его потребитель:
    # oidc client secret лежит в самом Vault (eso-secret/vault/oidc) и материализуется
    # ESO в K8s Secret в namespace vault, откуда попадает в spec.envsConfig конфигурера.
    # SA + SecretStore рендерятся ВСЕГДА (как у остальных pre-чартов);
    # ExternalSecret — только при vault_oidc_enabled=true (иначе Vault-путь ещё пуст).
    eso_vault_integration_vault:
      sa_name: "eso-main"
      role_name: "vault.eso-main"
      secret_store_name: "eso-main.vault"
      kv_engine_path: "eso-secret"

    # OIDC client secret — заполняется оператором вручную:
    #   vault kv put eso-secret/vault/oidc clientSecret=<...>
    vault_secret_oidc_creds:
      external_secret_name: "eso-vault-oidc-creds"
      vault_path: "/vault/oidc"
      body:
        target:
          name: "vault-oidc-creds"
        dataFrom:
          - extract:
              key: "{{ eso_vault_integration_vault.kv_engine_path }}/data/vault/oidc"

    # OIDC-секрет попадает в список ТОЛЬКО при vault_oidc_enabled=true
    eso_vault_integration_vault_secrets: "{{ [vault_secret_oidc_creds] if vault_oidc_enabled | bool else [] }}"

    eso_vault_integration_vault_secrets_extra: []

    # === SECTION 3 ===
    # --- PHASE: pre ---
    vault_pre_helm_timeout: "2m"
    # extraObjects (operator-side, default empty) — добавление произвольных K8s resources
    vault_pre_extra_objects: []
    # Pre-phase kustomize patches (operator-side customization, default empty)
    vault_pre_kustomize_patches: []
    # Pre-phase values (ESO Resources + NetworkPolicies chart)
    vault_pre_helm_values:
      namespace: "{{ vault_namespace }}"
      traefik:
        namespace: "{{ traefik_namespace }}"
        instanceName: "traefik-{{ traefik_namespace }}"
      externalSecrets:
        namespace: "{{ external_secrets_namespace }}"
      eso:
        vaultServerUrl: "{{ vault_internal_url }}"
        saName: "{{ eso_vault_integration_vault.sa_name }}"
        roleName: "{{ eso_vault_integration_vault.role_name }}"
        secretStoreName: "{{ eso_vault_integration_vault.secret_store_name }}"
        kvEnginePath: "{{ eso_vault_integration_vault.kv_engine_path }}"
        secrets: "{{ eso_vault_integration_vault_secrets + (eso_vault_integration_vault_secrets_extra | default([])) }}"
      esoResourcesConfig:
        secretStoreRefreshInterval: "{{ eso_resources_config.secret_store_refresh_interval }}"
        externalSecretRefreshInterval: "{{ eso_resources_config.external_secret_refresh_interval }}"
        externalSecretRefreshPolicy: "{{ eso_resources_config.external_secret_refresh_policy }}"
      issuer: "{{ vault_cert_manager_issuer }}"
      extraObjects: "{{ vault_pre_extra_objects }}"

    # --- PHASE: operator ---
    vault_operator_helm_timeout: "5m"
    # Helm repository (OCI) - адрес chart bank-vaults/vault-operator (переопределить в hosts-vars-override/ для airgap)
    vault_operator_helm_is_oci: true
    vault_operator_helm_url: "oci://ghcr.io/bank-vaults/helm-charts/vault-operator"
    vault_operator_helm_chart_version: "1.24.0"
    # Operator Helm values (bank-vaults operator chart)
    vault_operator_helm_values:
      tolerations: []
      nodeSelector: {}
      affinity: {}
      resources: {}

    # --- PHASE: cr ---
    vault_cr_helm_timeout: "5m"
    # Vault server image (полный URI:tag — handwritten chart pattern).
    # Используется в vault_spec.image (попадает в Vault CR → читается bank-vaults operator).
    # Для AirGap оператор переопределяет в hosts-vars-override/vault.yaml.
    vault_image: "docker.io/hashicorp/vault:1.21.4"
    # Vault unseal (bank-vaults operator stores keys in K8s Secret)
    # secretShares / secretThreshold map directly to unsealConfig.secretShares / secretThreshold in Vault CR
    # bank-vaults defaults: 5 / 3 — always set explicitly to avoid surprises
    vault_key_shares: 3
    vault_key_threshold: 2
    # K8s Secret created by bank-vaults unsealer
    vault_unsealer_secret_name: "vault-unseal-keys"
    # Vault Kubernetes Auth
    vault_kubernetes_host: "https://kubernetes.default.svc:443"
    vault_auth_kubernetes_roles_default_ttl: "1h"

    # ---------
    # VAULT POLICIES
    # bank-vaults externalConfig format: name + rules (HCL)
    # ---------
    vault_policies:
      # ---------
      # ESO: Traefik
      # ---------
      - name: traefik.eso-main
        rules: |
          path "eso-secret/data/traefik/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/traefik/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: HAProxy
      # ---------
      - name: haproxy.eso-main
        rules: |
          path "eso-secret/data/haproxy/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/haproxy/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: Longhorn
      # ---------
      - name: longhorn.eso-main
        rules: |
          path "eso-secret/data/longhorn/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/longhorn/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: SeaweedFS
      # ---------
      - name: seaweedfs.eso-main
        rules: |
          path "eso-secret/data/seaweedfs/*"     { capabilities = ["read", "list"] }
          path "eso-secret/metadata/seaweedfs/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: GitLab
      # ---------
      - name: gitlab.eso-main
        rules: |
          path "eso-secret/data/gitlab/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/gitlab/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: GitLab Runner
      # ---------
      - name: gitlab-runner.eso-main
        rules: |
          path "eso-secret/data/gitlab-runner/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/gitlab-runner/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: ZITADEL
      # ---------
      - name: zitadel.eso-main
        rules: |
          path "eso-secret/data/zitadel/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/zitadel/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: ArgoCD
      # ---------
      - name: argocd.eso-main
        rules: |
          path "eso-secret/data/argocd/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/argocd/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: mon-system
      # ---------
      - name: mon-system.eso-main
        rules: |
          path "eso-secret/data/mon-system/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/mon-system/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: Filestash
      # ---------
      - name: filestash.eso-main
        rules: |
          path "eso-secret/data/filestash/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/filestash/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: Outline
      # ---------
      - name: outline.eso-main
        rules: |
          path "eso-secret/data/outline/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/outline/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: Kargo
      # ---------
      - name: kargo.eso-main
        rules: |
          path "eso-secret/data/kargo/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/kargo/*" { capabilities = ["read", "list"] }
      # ---------
      # ESO: Vault (self) — OIDC client secret для человеческого OIDC-логина.
      # Vault одновременно источник и потребитель ESO (см. SECTION 2).
      # ---------
      - name: vault.eso-main
        rules: |
          path "eso-secret/data/vault/*" { capabilities = ["read", "list"] }
          path "eso-secret/metadata/vault/*" { capabilities = ["read", "list"] }
      # ---------
      # Vault Admin — ПОЛНАЯ admin-политика (почти-root). Назначается человеку-админу
      # (логин userpass в vault-ui), чтобы не сидеть под root-token в повседневке.
      # Отличие от root: подчиняется ACL (аудит + можно отозвать), НЕ обходит политики.
      # Пара root-only операций (sys/generate-root, sys/rekey) требует кворума unseal-ключей
      # в любом случае. path "*" + sudo = доступ ко всем путям и sudo-эндпоинтам.
      # ---------
      - name: vault-admin
        rules: |
          path "*" {
            capabilities = ["create", "read", "update", "delete", "list", "sudo"]
          }
      # ------
      # user-self-service — self-сервис обычных userpass-юзеров.
      # Политика ОДНА на всех (шаблон сам подставляет ник); привязка к юзеру — вручную в UI.
      # ВАЖНО: {% raw %}…{% endraw %} обязателен — внутри Vault-шаблоны {{identity.*}};
      # без raw Ansible/Jinja2 их вычислит (identity undefined) и политика сломается.
      # accessor = mount userpass (`vault read -field=accessor sys/auth/userpass`),
      # стабилен пока userpass не пересоздан; на другом кластере — свой.
      # - name: user-self-service
      #   rules: |
      #     {% raw %}
      #     path "auth/userpass/users/{{identity.entity.aliases.auth_userpass_bf406839.name}}/password" { capabilities = ["update"] }
      #     path "auth/token/lookup-self" { capabilities = ["read"] }
      #     path "auth/token/renew-self"  { capabilities = ["update"] }
      #     path "auth/token/revoke-self" { capabilities = ["update"] }
      #     path "sys/capabilities-self" { capabilities = ["update"] }
      #     path "identity/entity/id/{{identity.entity.id}}" { capabilities = ["read"] }
      #     {% endraw %}

      # ------
      # ---Examples. Path: eso-secret/some-ns-123/app
      # ------
      # vasya — read-only
      # - name: user-vasya
      #   rules: |
      #     path "eso-secret/metadata" { capabilities = ["list"] }

      #     path "eso-secret/metadata/some-ns-123" { capabilities = ["list"] }
      #     path "eso-secret/metadata/some-ns-123/app" { capabilities = ["list"] }

      #     path "eso-secret/data/some-ns-123/app/*"     { capabilities = ["read"] }
      #     path "eso-secret/metadata/some-ns-123/app/*" { capabilities = ["read", "list"] }
      # ------
      # ------
      # petua — read-write (без удаления)
      # - name: user-petua
      #   rules: |
      #     path "eso-secret/metadata" { capabilities = ["list"] }

      #     path "eso-secret/metadata/some-ns-123" { capabilities = ["list"] }
      #     path "eso-secret/metadata/some-ns-123/app" { capabilities = ["list"] }

      #     path "eso-secret/data/some-ns-123/app/*"     { capabilities = ["create", "read", "update", "patch"] }
      #     path "eso-secret/metadata/some-ns-123/app/*" { capabilities = ["read", "list"] }
      # ------
      # ------
      # dima — read-write + soft-delete (обратимое)
      # - name: user-dima
      #   rules: |
      #     path "eso-secret/metadata" { capabilities = ["list"] }

      #     path "eso-secret/metadata/some-ns-123" { capabilities = ["list"] }
      #     path "eso-secret/metadata/some-ns-123/app" { capabilities = ["list"] }

      #     path "eso-secret/data/some-ns-123/app/*"     { capabilities = ["create", "read", "update", "patch", "delete"] }
      #     path "eso-secret/delete/some-ns-123/app/*"   { capabilities = ["update"] }
      #     path "eso-secret/undelete/some-ns-123/app/*" { capabilities = ["update"] }
      #     path "eso-secret/metadata/some-ns-123/app/*" { capabilities = ["read", "list"] }
      # ------
      # ------
      # gleb — read-write + hard-delete (необратимое)
      # - name: user-gleb
      #   rules: |
      #     path "eso-secret/metadata" { capabilities = ["list"] }

      #     path "eso-secret/metadata/some-ns-123" { capabilities = ["list"] }
      #     path "eso-secret/metadata/some-ns-123/app" { capabilities = ["list"] }

      #     path "eso-secret/data/some-ns-123/app/*"     { capabilities = ["create", "read", "update", "patch", "delete"] }
      #     path "eso-secret/delete/some-ns-123/app/*"   { capabilities = ["update"] }
      #     path "eso-secret/undelete/some-ns-123/app/*" { capabilities = ["update"] }
      #     path "eso-secret/destroy/some-ns-123/app/*"  { capabilities = ["update"] }
      #     path "eso-secret/metadata/some-ns-123/app/*" { capabilities = ["read", "list", "delete"] }
      # ------
      # ------
      # ---Examples. Path: eso-secret/some-ns-123
      # ------
      # vasya — read-only
      # - name: user-vasya
      #   rules: |
      #     path "eso-secret/metadata" { capabilities = ["list"] }

      #     path "eso-secret/metadata/some-ns-123" { capabilities = ["list"] }

      #     path "eso-secret/data/some-ns-123/*"     { capabilities = ["read"] }
      #     path "eso-secret/metadata/some-ns-123/*" { capabilities = ["read", "list"] }
      # ------
      # ------
      # petua — read-write (без удаления)
      # - name: user-petua
      #   rules: |
      #     path "eso-secret/metadata" { capabilities = ["list"] }
      #     path "eso-secret/metadata/some-ns-123" { capabilities = ["list"] }

      #     path "eso-secret/data/some-ns-123/*"     { capabilities = ["create", "read", "update", "patch"] }
      #     path "eso-secret/metadata/some-ns-123/*" { capabilities = ["read", "list"] }
      # ------
      # ------
      # dima — read-write + soft-delete (обратимое)
      # - name: user-dima
      #   rules: |
      #     path "eso-secret/metadata" { capabilities = ["list"] }
      #     path "eso-secret/metadata/some-ns-123" { capabilities = ["list"] }

      #     path "eso-secret/data/some-ns-123/*"     { capabilities = ["create", "read", "update", "patch", "delete"] }
      #     path "eso-secret/delete/some-ns-123/*"   { capabilities = ["update"] }
      #     path "eso-secret/undelete/some-ns-123/*" { capabilities = ["update"] }
      #     path "eso-secret/metadata/some-ns-123/*" { capabilities = ["read", "list"] }
      # ------
      # ------
      # gleb — read-write + hard-delete (необратимое)
      # - name: user-gleb
      #   rules: |
      #     path "eso-secret/metadata" { capabilities = ["list"] }
      #     path "eso-secret/metadata/some-ns-123" { capabilities = ["list"] }

      #     path "eso-secret/data/some-ns-123/*"     { capabilities = ["create", "read", "update", "patch", "delete"] }
      #     path "eso-secret/delete/some-ns-123/*"   { capabilities = ["update"] }
      #     path "eso-secret/undelete/some-ns-123/*" { capabilities = ["update"] }
      #     path "eso-secret/destroy/some-ns-123/*"  { capabilities = ["update"] }
      #     path "eso-secret/metadata/some-ns-123/*" { capabilities = ["read", "list", "delete"] }
      # ------
      # ------

    vault_policies_extra: []

    # ---------
    # VAULT ROLES
    # bank-vaults externalConfig format: bound_service_account_names/namespaces + policies + ttl
    # ---------
    vault_auth_kubernetes_roles:
      # ---------
      # ESO: Traefik
      # ---------
      - name: traefik.eso-main
        bound_service_account_namespaces: traefik-lb
        bound_service_account_names: eso-main
        policies:
          - traefik.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: HAProxy
      # ---------
      - name: haproxy.eso-main
        bound_service_account_namespaces: haproxy-lb
        bound_service_account_names: eso-main
        policies:
          - haproxy.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: Longhorn
      # ---------
      - name: longhorn.eso-main
        bound_service_account_namespaces: longhorn-system
        bound_service_account_names: eso-main
        policies:
          - longhorn.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: SeaweedFS
      # ---------
      - name: seaweedfs.eso-main
        bound_service_account_namespaces: seaweedfs
        bound_service_account_names: eso-main
        policies:
          - seaweedfs.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: Filestash
      # ---------
      - name: filestash.eso-main
        bound_service_account_namespaces: filestash
        bound_service_account_names: eso-main
        policies:
          - filestash.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: GitLab
      # ---------
      - name: gitlab.eso-main
        bound_service_account_namespaces: gitlab
        bound_service_account_names: eso-main
        policies:
          - gitlab.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: GitLab Runner
      # ---------
      - name: gitlab-runner.eso-main
        bound_service_account_namespaces: gitlab-runner
        bound_service_account_names: eso-main
        policies:
          - gitlab-runner.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: ZITADEL
      # ---------
      - name: zitadel.eso-main
        bound_service_account_namespaces: zitadel
        bound_service_account_names: eso-main
        policies:
          - zitadel.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: ArgoCD
      # ---------
      - name: argocd.eso-main
        bound_service_account_namespaces: argocd
        bound_service_account_names: eso-main
        policies:
          - argocd.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: mon-system
      # ---------
      - name: mon-system.eso-main
        bound_service_account_namespaces: mon-system
        bound_service_account_names: eso-main
        policies:
          - mon-system.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: Outline
      # ---------
      - name: outline.eso-main
        bound_service_account_namespaces: outline
        bound_service_account_names: eso-main
        policies:
          - outline.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: Kargo
      # ---------
      - name: kargo.eso-main
        bound_service_account_namespaces: kargo
        bound_service_account_names: eso-main
        policies:
          - kargo.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"
      # ---------
      # ESO: Vault (self)
      # ---------
      - name: vault.eso-main
        bound_service_account_namespaces: vault
        bound_service_account_names: eso-main
        policies:
          - vault.eso-main
        ttl: "{{ vault_auth_kubernetes_roles_default_ttl }}"

    vault_auth_kubernetes_roles_extra: []

    # ---------
    # VAULT OIDC — declarative auth method + identity records
    # bank-vaults пишет ВЕРБАТИМ: config -> auth/<path>/config, каждый role -> auth/<path>/role/<name>.
    # oidc_client_secret НЕ в git: "${ .Env.X }" — шаблон bank-vaults, его резолвит
    # configurer из spec.envsConfig (см. vault_spec_envs_config ниже).
    # token_policies у роли НЕ задаём: персональные политики приезжают через external
    # group (groups_claim -> group-alias -> group.policies).
    # ---------
    vault_oidc_config:
      oidc_discovery_url: "{{ vault_oidc_issuer }}"
      oidc_client_id: "{{ vault_oidc_client_id }}"
      oidc_client_secret: "${ .Env.{{ vault_oidc_client_secret_env_name }} }"
      default_role: "{{ vault_oidc_role_name }}"
    vault_oidc_roles:
      - name: "{{ vault_oidc_role_name }}"
        role_type: oidc
        user_claim: "{{ vault_oidc_user_claim }}"
        groups_claim: "{{ vault_oidc_groups_claim }}"
        oidc_scopes: "{{ vault_oidc_scopes }}"
        allowed_redirect_uris: "{{ vault_oidc_allowed_redirect_uris }}"
        token_ttl: "{{ vault_oidc_token_ttl }}"
        token_max_ttl: "{{ vault_oidc_token_max_ttl }}"
        verbose_oidc_logging: "{{ vault_oidc_verbose_logging }}"
    vault_oidc_roles_extra: []
    # ---------
    # VAULT IDENTITY — external groups + group-aliases.
    # bank-vaults НЕ умеет декларативные identity ENTITIES. Привязка «человек -> политика»:
    # claim preferred_username -> group-alias.name -> group -> group.policies.
    # На человека РОВНО 3 записи: policy user-<name> + group + group-alias; все три —
    # в hosts-vars-override/<cluster>/vault.yaml, база пустая.
    # groups[].type ОБЯЗАН быть "external" (иначе bank-vaults падает).
    # group-aliases[].mountpath — дружественный путь ("oidc"), accessor резолвится сам.
    # Форма записи:
    #   vault_groups_extra:
    #     - name: "vault-user-boris-mus"
    #       type: external
    #       policies: ["user-boris-mus"]
    #       metadata:
    #         source: "zitadel"
    #   vault_group_aliases_extra:
    #     - name: "boris-mus@cluster-tools.1520.tech"   # ровно значение preferred_username
    #       mountpath: "oidc"
    #       group: "vault-user-boris-mus"
    # ---------
    vault_groups: []
    vault_groups_extra: []
    vault_group_aliases: []
    vault_group_aliases_extra: []

    # ---------
    # VAULT SPEC
    # Full Vault CR spec — edit here to change image, storage, unseal params, etc.
    # Dynamic refs kept only for values that differ per environment.
    # --- Operator-overridable sub-blocks (extracted from vault_spec) ---
    vault_spec_auth_kubernetes:
      type: kubernetes
      config:
        kubernetes_host: "{{ vault_kubernetes_host }}"
      roles: "{{ vault_auth_kubernetes_roles + (vault_auth_kubernetes_roles_extra | default([])) }}"
    # userpass — человеческий логин в vault-ui (метод «Username & Password»).
    # Включаем ТОЛЬКО метод; пользователей заводим вручную через UI/CLI и НЕ держим в конфиге
    # (пароли не в git; при vault_userpass_enabled=true auth исключён из purgeUnmanagedConfig
    # → ручные юзеры/пароли не затираются).
    vault_spec_auth_userpass:
      type: userpass
    # oidc — человеческий логин через ZITADEL (см. секцию VAULT OIDC выше).
    vault_spec_auth_oidc:
      type: oidc
      path: "{{ vault_oidc_mount_path }}"
      config: "{{ vault_oidc_config }}"
      roles: "{{ vault_oidc_roles + (vault_oidc_roles_extra | default([])) }}"
    # Выключенный метод не пустой, а ОТСУТСТВУЕТ в списке → purgeUnmanagedConfig
    # отключает его mount в Vault (встроенный token/ purge не трогает).
    # Операторские дополнительные auth-методы (ldap, github, ...) — hosts-vars-override/.
    vault_spec_auth_extra: []
    vault_spec_auth: >-
      {{ [vault_spec_auth_kubernetes]
         + ([vault_spec_auth_userpass] if vault_userpass_enabled | bool else [])
         + ([vault_spec_auth_oidc] if vault_oidc_enabled | bool else [])
         + (vault_spec_auth_extra | default([])) }}
    vault_spec_secrets:
      - path: secret
        type: kv
        description: General secrets
        options:
          version: 2
      - path: eso-secret
        type: kv
        description: ESO secrets
        options:
          version: 2
    vault_spec_volume_claim_templates:
      - metadata:
          name: vault-data
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: lnstr-major-local
          resources:
            requests:
              storage: 2Gi
    vault_spec_volume_mounts:
      - name: vault-data
        mountPath: /vault/data
    # --- round-4 blocks (extracted from vault_spec) ---
    vault_spec_unseal_config:
      options:
        secretShares: "{{ vault_key_shares }}"
        secretThreshold: "{{ vault_key_threshold }}"
      kubernetes:
        secretNamespace: "{{ vault_namespace }}"
        secretName: "{{ vault_unsealer_secret_name }}"
    vault_spec_config:
      api_addr: "http://vault.{{ vault_namespace }}.svc.{{ cluster_dns_domain }}:8200"
      cluster_addr: "http://vault.{{ vault_namespace }}.svc.{{ cluster_dns_domain }}:8201"
      storage:
        raft:
          path: /vault/data
      listener:
        tcp:
          address: "[::]:8200"
          cluster_address: "[::]:8201"
          tls_disable: true
          telemetry:
            unauthenticated_metrics_access: "true"
      ui: true
      disable_mlock: true
      telemetry:
        prometheus_retention_time: "120s"
        disable_hostname: true
    vault_spec_vault_envs_config:
      - name: VAULT_ADDR
        value: "http://127.0.0.1:8200"
    # envsConfig — env для ВСЕХ bank-vaults pod'ов, включая CONFIGURER, который резолвит
    # ${ .Env.X } в externalConfig. НЕ vaultEnvsConfig (тот идёт только в vault-контейнер).
    # optional: true — если ESO ещё не материализовал Secret, pod всё равно стартует.
    # ВНИМАНИЕ: непустой envsConfig меняет podTemplate StatefulSet'а → rolling restart Vault.
    vault_spec_envs_config_oidc:
      - name: "{{ vault_oidc_client_secret_env_name }}"
        valueFrom:
          secretKeyRef:
            name: "{{ vault_secret_oidc_creds.body.target.name }}"
            key: "{{ vault_oidc_secret_key_client_secret }}"
            optional: true
    vault_spec_envs_config_extra: []
    vault_spec_envs_config: >-
      {{ (vault_spec_envs_config_oidc if vault_oidc_enabled | bool else [])
         + (vault_spec_envs_config_extra | default([])) }}
    # purgeUnmanagedConfig — строгий git-ops: всё, чего нет в конфиге, удаляется.
    # Гранулярность bank-vaults = СЕКЦИЯ (7 флагов), per-method исключений НЕТ и не нужно:
    # purge гасит только mount'ы, которых НЕТ в конфиге — объявленные (kubernetes/userpass/
    # oidc/_extra) и встроенный token/ вычитаются из кандидатов (auth_methods.go:486-497).
    # Ручные userpass-юзеры не удаляются никогда: per-user purge в bank-vaults отсутствует.
    # Юзеры исчезнут только вместе с mount'ом при vault_userpass_enabled: false.
    vault_purge_unmanaged_enabled: true
    vault_purge_unmanaged_exclude:
      audit: false
      auth: false
      groups: false
      group-aliases: false
      plugins: false
      policies: false
      secrets: false
    vault_spec_purge_unmanaged_config:
      enabled: "{{ vault_purge_unmanaged_enabled | bool }}"
      exclude: "{{ vault_purge_unmanaged_exclude }}"
    # groups/group-aliases — ключи есть всегда, наполняются из hosts-vars-override/.
    # Ключ 'group-aliases' ДЕФИСНЫЙ — опечатка роняет весь configurer (ErrorUnused: true).
    vault_spec_external_config:
      purgeUnmanagedConfig: "{{ vault_spec_purge_unmanaged_config }}"
      policies: "{{ vault_policies + (vault_policies_extra | default([])) }}"
      auth: "{{ vault_spec_auth }}"
      secrets: "{{ vault_spec_secrets }}"
      groups: "{{ vault_groups + (vault_groups_extra | default([])) }}"
      group-aliases: "{{ vault_group_aliases + (vault_group_aliases_extra | default([])) }}"
    # ---------
    vault_spec:
      size: 1
      serviceAccount: vault
      image: "{{ vault_image }}"
      unsealConfig: "{{ vault_spec_unseal_config }}"
      config: "{{ vault_spec_config }}"
      # Добавляем переменные окружения здесь
      vaultEnvsConfig: "{{ vault_spec_vault_envs_config }}"
      # ---
      envsConfig: "{{ vault_spec_envs_config }}"
      externalConfig: "{{ vault_spec_external_config }}"
      volumeClaimTemplates: "{{ vault_spec_volume_claim_templates }}"
      volumeMounts: "{{ vault_spec_volume_mounts }}"
      resources:
        vault: {}
        bankVaults: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    # extraObjects (operator-side, default empty) — добавление произвольных K8s resources
    vault_cr_extra_objects: []
    # CR-phase kustomize patches (operator-side customization, default empty)
    vault_cr_kustomize_patches: []
    # CR-phase values (Vault Custom Resource chart)
    # vault_spec использует inline merge vault_policies/vault_auth_kubernetes_roles + extras;
    # validation выполняется через tasks-vault-config-verify.yaml.
    vault_cr_helm_values:
      namespace: "{{ vault_namespace }}"
      vaultSpec: "{{ vault_spec }}"
      extraObjects: "{{ vault_cr_extra_objects }}"

    # --- PHASE: post ---
    vault_post_helm_timeout: "2m"
    # extraObjects (operator-side, default empty) — добавление произвольных K8s resources
    vault_post_extra_objects: []
    # Post-phase kustomize patches (operator-side customization, default empty)
    vault_post_kustomize_patches: []
    # Post-phase values (Ingress chart)
    vault_post_helm_values:
      namespace: "{{ vault_namespace }}"
      ingressConfig: "{{ vault_ui_ingress_config }}"
      certificateConfig: "{{ vault_ui_certificate }}"
      traefik:
        namespace: "{{ traefik_namespace }}"
        entryPoints:
          web: "{{ traefik_web_entrypoint }}"
          websecure: "{{ traefik_websecure_entrypoint }}"
      extraObjects: "{{ vault_post_extra_objects }}"
