all:
  vars:
    # =========================================================================
    # Argo Events — событийный слой кластера: EventSource принимает события
    # (Kubernetes API, webhook'и внешних сервисов), EventBus их переносит,
    # Sensor исполняет триггеры. Официального helm-чарта у продукта нет —
    # ставится вендоренным install.yaml (как argocd и argo-rollouts).
    #
    # Контроллер ставится NAMESPACED и по умолчанию видит CR только в своём
    # собственном namespace. Направить его в другой namespace можно переменной
    # argo_events_cr_namespace ниже.
    # Собственного UI у argo-events нет.
    # =========================================================================

    # Component enable flag (default false, opt-in): guards install start.
    argo_events_enabled: false

    # Namespace КОНТРОЛЛЕРА. Совпадает с тем, что захардкожен в upstream-
    # манифесте (metadata.namespace + subjects[].namespace в RoleBinding).
    argo_events_namespace: "argo-events"

    # ------
    # CR NAMESPACE — куда смотрит контроллер.
    # Пусто (дефолт) — апстримное поведение: --namespaced без
    # --managed-namespace, контроллер видит CR в своём собственном namespace,
    # и там ему хватает Role из вендоренного манифеста. Доделывать нечего.
    #
    # Задано — к манифесту контроллера подмешивается патч с --managed-namespace,
    # и контроллер смотрит ТУДА ВМЕСТО своего namespace: флаг принимает ровно
    # одно значение, списка namespace у продукта нет. Непустая строка и есть
    # признак включения, отдельного тумблера нет.
    #
    # ⚠️ Namespace и обязательные права контроллера в нём заводит стадия
    # pre-cfg самого компонента — потому она и идёт ПЕРЕД install. В
    # cluster-base этот namespace объявлять НЕЛЬЗЯ: получится второй
    # владелец объекта. Содержимое namespace — забота оператора.
    # ------
    argo_events_cr_namespace: ""
    # Метки и аннотации объекта Namespace. Пустые не рендерятся.
    argo_events_cr_namespace_labels: {}
    argo_events_cr_namespace_annotations: {}

    # ------
    # Порты (из upstream-исходников, менять нельзя без смены версии).
    # ------
    argo_events_metrics_port: 7777
    argo_events_health_port: 8081
    argo_events_webhook_port: 443

    # ------
    # Версия и образ. В upstream-манифесте образ помечен :latest — плавающий тег
    # в проде недопустим, поэтому пиним явно kustomize-патчами ниже. Пин нужен и
    # в image, и в env ARGO_EVENTS_IMAGE: из второго контроллер порождает поды
    # EventSource/Sensor/EventBus. Вендоренные манифесты лежат в
    # charts/argo-events/{crds,install,webhook}/ и обновляются вручную вместе
    # с этой переменной.
    # ------
    argo_events_version: "v1.9.11"
    argo_events_image: "quay.io/argoproj/argo-events:{{ argo_events_version }}"
    # Апстрим ставит Always под плавающий тег; тег мы пиним, поэтому IfNotPresent.
    argo_events_image_pull_policy: "IfNotPresent"

    # ------
    # ПРАВА КОНТРОЛЛЕРА В CR NAMESPACE.
    # Апстримный namespace-install.yaml кладёт Role только рядом с контроллером —
    # он предполагает, что контроллер и CR в одном namespace, и для штатного
    # режима этого достаточно. Когда контроллер направлен в другой namespace,
    # ему нужен там свой комплект; его рендерит стадия pre-cfg, и именно поэтому
    # она идёт ПЕРЕД install: без этих прав контроллер уходит в CrashLoop.
    # Локальный Role апстрима НЕ трогается ни в одном из режимов.
    # ------
    # Имя SA задано апстримом, менять нельзя без смены версии манифеста.
    argo_events_controller_sa_name: "argo-events-sa"
    argo_events_controller_cr_ns_role_name: "argo-events-controller"
    argo_events_controller_cr_ns_role_binding_name: "argo-events-controller"
    # Полный апстримный набор: в cr-namespace контроллер создаёт и удаляет
    # дочерние Deployment/StatefulSet/Service/ConfigMap/Secret/PVC и правит
    # статусы CR. Урезать здесь нечего — это ровно то, что он делает.
    argo_events_controller_cr_ns_role_rules:
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "patch"]
      - apiGroups: ["coordination.k8s.io"]
        resources: ["leases"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["argoproj.io"]
        resources:
          - sensors
          - sensors/finalizers
          - sensors/status
          - eventsources
          - eventsources/finalizers
          - eventsources/status
          - eventbus
          - eventbus/finalizers
          - eventbus/status
        verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]
      - apiGroups: [""]
        resources: ["pods", "pods/exec", "configmaps", "services", "persistentvolumeclaims"]
        verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["create", "get", "update", "list", "patch", "delete"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

    # ------
    # PHASE: crds (kubectl apply — CRD маленькие, лимит аннотации не грозит)
    # ------
    argo_events_crds_list:
      - crd/eventbus.argoproj.io
      - crd/eventsources.argoproj.io
      - crd/sensors.argoproj.io

    # ------
    # ESO integration. Каркас поднимается всегда (SecretStore + SA), список
    # секретов пустой — реальные пути добавляются в hosts-vars-override/
    # через eso_vault_integration_argo_events_secrets_extra по мере появления
    # источников, требующих токенов.
    # ------
    eso_vault_integration_argo_events:
      sa_name: "eso-main"
      role_name: "argo-events.eso-main"
      secret_store_name: "eso-main.vault"
      kv_engine_path: "eso-secret"

    eso_vault_integration_argo_events_secrets: []

    eso_vault_integration_argo_events_secrets_extra: []

    # ------
    # cert-manager Issuer. Ingress'ов у компонента пока нет, поэтому тумблер
    # выключен: обвязка лежит готовой и включается вместе с появлением домена
    # для webhook-источника. Solver-политики рендерятся по этому же объекту.
    # ------
    argo_events_cert_manager_issuer_enabled: false
    argo_events_acme_issuer_name: "argo-events-acme"
    argo_events_acme_private_key_name: "argo-events-acme-account-key"
    argo_events_acme_server: "https://acme-v02.api.letsencrypt.org/directory"
    argo_events_acme_email: "some-email-123@gmail.com"
    argo_events_acme_solvers:
      - http01:
          ingress:
            ingressClassName: "traefik-lb"
            ingressTemplate:
              metadata:
                annotations:
                  "kubernetes.io/ingress.class": "traefik-lb"
                  "traefik.ingress.kubernetes.io/router.entrypoints": "web"
            podTemplate:
              metadata:
                labels:
                  app.kubernetes.io/name: acme-solver
                  app.kubernetes.io/instance: traefik-lb
                  app.kubernetes.io/component: acme-http01-solver
                  app.kubernetes.io/managed-by: cert-manager
    argo_events_cert_manager_issuer:
      enabled: "{{ argo_events_cert_manager_issuer_enabled }}"
      name: "{{ argo_events_acme_issuer_name }}"
      spec:
        acme:
          server: "{{ argo_events_acme_server }}"
          email: "{{ argo_events_acme_email }}"
          privateKeySecretRef:
            name: "{{ argo_events_acme_private_key_name }}"
          solvers: "{{ argo_events_acme_solvers }}"

    # ------
    # PHASE: pre (NetworkPolicies + Issuer + ESO resources)
    # ------
    argo_events_pre_helm_timeout: "5m"
    argo_events_pre_extra_objects: []
    argo_events_pre_kustomize_patches: []
    argo_events_pre_helm_values:
      namespace: "{{ argo_events_namespace }}"
      externalSecrets:
        namespace: "{{ external_secrets_namespace }}"
      traefik:
        namespace: "{{ traefik_namespace }}"
        instanceName: "traefik-{{ traefik_namespace }}"
      argoEvents:
        metricsPort: "{{ argo_events_metrics_port }}"
        webhookPort: "{{ argo_events_webhook_port }}"
      eso:
        vaultServerUrl: "{{ vault_internal_url }}"
        saName: "{{ eso_vault_integration_argo_events.sa_name }}"
        roleName: "{{ eso_vault_integration_argo_events.role_name }}"
        secretStoreName: "{{ eso_vault_integration_argo_events.secret_store_name }}"
        kvEnginePath: "{{ eso_vault_integration_argo_events.kv_engine_path }}"
        secrets: "{{ eso_vault_integration_argo_events_secrets + (eso_vault_integration_argo_events_secrets_extra | default([])) }}"
      esoResourcesConfig:
        secretStoreRefreshInterval: "{{ eso_resources_config.secret_store_refresh_interval }}"
        externalSecretRefreshInterval: "{{ eso_resources_config.external_secret_refresh_interval }}"
        externalSecretRefreshPolicy: "{{ eso_resources_config.external_secret_refresh_policy }}"
      issuer: "{{ argo_events_cert_manager_issuer }}"
      extraObjects: "{{ argo_events_pre_extra_objects }}"

    # ------
    # PHASE: install (вендоренный upstream-манифест + kustomize)
    # ------
    argo_events_install_helm_timeout: "5m"
    argo_events_install_rollout_timeout: "300s"
    # Restart-phase rollout wait timeout (argo-events-restart.yaml)
    argo_events_install_restart_rollout_timeout: "300s"
    argo_events_install_rollout_resources:
      - deployment.apps/controller-manager
      - deployment.apps/events-webhook
    argo_events_install_extra_objects: []
    # Базовые патчи на оба вендоренных Deployment'а. У контроллера пин образа
    # нужен в двух местах (image + env ARGO_EVENTS_IMAGE — из второго он
    # порождает дочерние поды) и добавляется порт метрик: апстрим ports у него
    # не объявляет, без этого PodMonitor не найдёт цель. containerPort
    # намеренно без кавычек: нужен int, не строка.
    argo_events_kustomize_patches_base:
      - target:
          kind: Deployment
          name: controller-manager
        patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: controller-manager
          spec:
            template:
              spec:
                containers:
                  - name: controller-manager
                    image: "{{ argo_events_image }}"
                    imagePullPolicy: "{{ argo_events_image_pull_policy }}"
                    env:
                      - name: ARGO_EVENTS_IMAGE
                        value: "{{ argo_events_image }}"
                    ports:
                      - name: metrics
                        containerPort: {{ argo_events_metrics_port }}
      - target:
          kind: Deployment
          name: events-webhook
        patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: events-webhook
          spec:
            template:
              spec:
                containers:
                  - name: webhook
                    image: "{{ argo_events_image }}"
                    imagePullPolicy: "{{ argo_events_image_pull_policy }}"
    # Операторское расширение (hosts-vars-override/): ресурсы, nodeSelector,
    # tolerations и прочее прикладываются сюда отдельными патчами.
    # Подмешивается в патчи install ТОЛЬКО при непустом argo_events_cr_namespace.
    # ⚠️ args — []string без patchMergeKey: strategic merge ЗАМЕНЯЕТ список
    # целиком, поэтому апстримные элементы перечислены заново. Потерять
    # `controller` — под падает сразу; потерять `--namespaced` — контроллер тихо
    # становится cluster-wide и упирается в отсутствие ClusterRole.
    argo_events_cr_namespace_patch:
      target:
        kind: Deployment
        name: controller-manager
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: controller-manager
        spec:
          template:
            spec:
              containers:
                - name: controller-manager
                  args:
                    - controller
                    - --namespaced
                    - --managed-namespace={{ argo_events_cr_namespace }}
    argo_events_install_kustomize_patches_extra: []
    argo_events_install_kustomize_patches: >-
      {{ argo_events_kustomize_patches_base
         + ([argo_events_cr_namespace_patch] if argo_events_cr_namespace | length > 0 else [])
         + argo_events_install_kustomize_patches_extra }}
    # Helm values для KUSTOMIZE_WRAPPER install phase — только extraObjects wiring
    argo_events_install_helm_values:
      extraObjects: "{{ argo_events_install_extra_objects }}"

    # ------
    # PHASE: pre-cfg (cr namespace + обязательные права контроллера в нём)
    # Стадия идёт ПЕРЕД install и без kustomize namespace-трансформера: он
    # переименовал бы объект Namespace и переписал чужой metadata.namespace.
    # Положить это ПОСЛЕ install тоже нельзя — без прав в cr-namespace
    # кэш контроллера не синхронизируется и процесс завершается за
    # CacheSyncTimeout, причём отказ отложенный: readiness это healthz.Ping.
    # При пустом argo_events_cr_namespace или его равенстве
    # argo_events_namespace стадия рендерит ноль объектов.
    # ------
    argo_events_pre_cfg_helm_timeout: "5m"
    argo_events_pre_cfg_extra_objects: []
    argo_events_pre_cfg_kustomize_patches: []
    argo_events_pre_cfg_helm_values:
      namespace: "{{ argo_events_namespace }}"
      crNamespace:
        name: "{{ argo_events_cr_namespace }}"
        labels: "{{ argo_events_cr_namespace_labels }}"
        annotations: "{{ argo_events_cr_namespace_annotations }}"
      controllerRbac:
        saName: "{{ argo_events_controller_sa_name }}"
        roleName: "{{ argo_events_controller_cr_ns_role_name }}"
        roleBindingName: "{{ argo_events_controller_cr_ns_role_binding_name }}"
        rules: "{{ argo_events_controller_cr_ns_role_rules }}"
      extraObjects: "{{ argo_events_pre_cfg_extra_objects }}"

    # ------
    # PHASE: cfg (операторский RBAC + EventBus + EventSource + Sensor)
    # ------
    # Шины этого namespace. Список: несколько шин в одном namespace допустимы,
    # EventSource и Sensor выбирают свою по имени через spec.eventBusName
    # (дефолт "default"). Пусто = ни одной шины, отдельного тумблера нет.
    #
    # Профиль в примере ниже — lite: одна реплика JetStream. HA-профиль
    # (3 реплики + streamConfig.replicas: 3) задаётся в hosts-vars-override/ —
    # обе величины меняются ТОЛЬКО ВМЕСТЕ: глобальный дефолт
    # streamConfig.replicas в апстримном ConfigMap равен 3, и поток с кворумом 3
    # на одной реплике не создастся.
    #
    # metadata шины: метки контроллер переносит на её StatefulSet и реагирует на
    # их изменение реконсиляцией; аннотации он не читает вовсе — они нужны
    # только внешним инструментам (ArgoCD, reloader, пометки).
    #
    # ⚠️ streamConfig ПРИМЕНЯЕТСЯ РОВНО ОДИН РАЗ — при СОЗДАНИИ стрима. Стрим
    # создаёт первый подключившийся EventSource или Sensor (source_jetstream.go:27
    # / sensor_jetstream.go:50 -> Init -> CreateStream), а не контроллер шины. На
    # уже существующем стриме CreateStream выходит сразу: "No need to create
    # Stream as it already exists" (jetstream.go:122-125) — новый конфиг НЕ
    # применяется. Менять maxAge/maxBytes безболезненно можно только пока
    # прикладных объектов нет; позже потребуется удалить стрим вручную.
    #
    # ⚠️ maxBytes — ЧИСЛО В БАЙТАХ, НЕ СТРОКА. Значение читается viper'ом через
    # GetInt64 (jetstream.go:161), и привычное "6Gi" молча превратится в 0, а
    # ноль сервер нормализует в -1, то есть в ОТСУТСТВИЕ лимита (проверено на
    # живом NATS 2.10). Соседний maxAge строку принимает — он читается через
    # GetDuration. Два ключа рядом с разными правилами, легко перепутать.
    #
    # Откуда числа примера. Через шину едут УВЕДОМЛЕНИЯ, и хранить их неделю
    # незачем: если потребитель лежал дольше, старые сообщения слать уже не надо
    # — отсюда 96h. Watch за Application льёт порядка 340 МБ в сутки (объект
    # ~20 КБ, около 36 приложений, status переписывается на каждом reconcile
    # контроллера ArgoCD), то есть на этом окне ожидается порядка 1.4 ГБ.
    # Потолок 6 GiB из тома 10 GiB — четырёхкратный запас к оценке; оставшиеся
    # 4 GiB под состояние консьюмеров, K/V-бакеты сенсоров (в JetStream они тоже
    # стримы и лежат в том же сторе) и метаданные. По достижении лимита
    # JetStream вытесняет САМОЕ СТАРОЕ (discard: DiscardOld по умолчанию), а не
    # отклоняет новое: потерять позавчерашнее уведомление не жалко, перестать
    # принимать новые — нельзя. 6 * 1024^3 = 6442450944.
    # ------
    argo_events_event_buses: []
    # - name: "default"
    #   labels: {}
    #   annotations: {}
    #   spec:
    #     jetstream:
    #       version: "2.10.29"
    #       replicas: 1
    #       persistence:
    #         storageClassName: "lnstr-major-local"
    #         accessMode: ReadWriteOnce
    #         volumeSize: "10Gi"
    #       streamConfig: |
    #         replicas: 1
    #         maxAge: 96h
    #         maxBytes: 6442450944
    # Списки прикладных объектов: элемент — {name, labels?, annotations?, spec},
    # spec рендерится как есть.
    #
    # ⚠️ ПУСТЫ НАМЕРЕННО, И ТАКИМИ ДОЛЖНЫ ОСТАВАТЬСЯ. Прикладные EventSource и
    # Sensor живут в git-ops репозитории — продукт
    # argocd-client/products-no-envs/deploy-notify в 1520-tech-infra, — по тому
    # же разделу, что у mon-system: оператора ставит ansible, а его CR
    # (AlertmanagerConfig, PrometheusRule) лежат в продукте system-observer.
    #
    # Заполнить эти списки означает завести ВТОРОГО владельца на те же объекты:
    # helm-релиз argo-events-cr и ArgoCD начнут переписывать их друг за другом.
    # Если понадобился новый поток — он заводится в git-ops, а не здесь.
    argo_events_event_sources: []
    argo_events_sensors: []
    # Пять независимых сырых списков операторских RBAC-объектов; связей между
    # ними нет. EventSource типа resource требует SA с list/watch на
    # наблюдаемый ресурс, Sensor с k8s- или argoWorkflow-триггером — SA с
    # create/update на целевой ресурс.
    # SA:                  {name, annotations?, labels?}
    # Role / ClusterRole:  {name, rules}
    # RoleBinding:         {name, namespace, roleRef, subjects}
    # ClusterRoleBinding:  {name, roleRef, subjects}
    argo_events_rbac_service_accounts: []
    argo_events_rbac_roles: []
    argo_events_rbac_cluster_roles: []
    argo_events_rbac_role_bindings: []
    argo_events_rbac_cluster_role_bindings: []
    argo_events_cfg_helm_timeout: "5m"
    argo_events_cfg_rollout_timeout: "600s"
    # StatefulSet шины создаёт контроллер асинхронно после появления CR —
    # tasks-wait-rollout.yaml ретраит до его появления. Одна запись на каждую
    # шину из argo_events_event_buses: "statefulset.apps/eventbus-<name>-js".
    # Пусто, пока шин нет: ждать нечего.
    argo_events_cfg_rollout_resources: []
    argo_events_cfg_extra_objects: []
    argo_events_cfg_kustomize_patches: []
    argo_events_cfg_helm_values:
      namespace: "{{ argo_events_namespace }}"
      rbacServiceAccounts: "{{ argo_events_rbac_service_accounts }}"
      rbacRoles: "{{ argo_events_rbac_roles }}"
      rbacClusterRoles: "{{ argo_events_rbac_cluster_roles }}"
      rbacRoleBindings: "{{ argo_events_rbac_role_bindings }}"
      rbacClusterRoleBindings: "{{ argo_events_rbac_cluster_role_bindings }}"
      eventBuses: "{{ argo_events_event_buses }}"
      eventSources: "{{ argo_events_event_sources }}"
      sensors: "{{ argo_events_sensors }}"
      extraObjects: "{{ argo_events_cfg_extra_objects }}"

    # ------
    # PHASE: post (PodMonitor'ы)
    # Service апстрим не создаёт ни для контроллера, ни для дочерних подов,
    # поэтому метрики снимаются двумя PodMonitor'ами, а не ServiceMonitor'ом.
    # ------
    argo_events_post_helm_timeout: "5m"
    argo_events_pod_monitor_controller_enabled: true
    argo_events_pod_monitor_workloads_enabled: true
    argo_events_pod_monitor_interval: "30s"
    argo_events_pod_monitor_scrape_timeout: "15s"
    argo_events_pod_monitor_labels: {}
    argo_events_post_extra_objects: []
    argo_events_post_kustomize_patches: []
    argo_events_post_helm_values:
      namespace: "{{ argo_events_namespace }}"
      podMonitor:
        controller:
          enabled: "{{ argo_events_pod_monitor_controller_enabled }}"
        workloads:
          enabled: "{{ argo_events_pod_monitor_workloads_enabled }}"
        interval: "{{ argo_events_pod_monitor_interval }}"
        scrapeTimeout: "{{ argo_events_pod_monitor_scrape_timeout }}"
        labels: "{{ argo_events_pod_monitor_labels }}"
