# =============================================================================
#  ЭКСПЛУАТАЦИЯ
# =============================================================================
#  Каталог версий продукта (что прошло стенды):
#      kargo get freight --project my-casino
#
#  Ручной шаг по стенду (там, где авто выключено):
#      kargo promote --project my-bank --freight <rc> --stage qa
#
#  Раскатка ОДНОМУ клиенту:
#      kargo promote --project my-casino --freight <rc> --stage prod-vasya
#
#  Раскатка ВСЕМ клиентам продукта (создаст MR каждому, параллельно):
#      kargo promote --project my-casino --freight <rc> --downstream-from pre-prod
#
#  Откат клиента:
#      kargo promote --project my-casino --freight <старый-rc> --stage prod-vasya
#
#  Отменить зависший промоушен (MR в GitLab закрыть отдельно, Kargo его не трогает):
#      kargo promote --project my-casino --name <promotion> --abort
# =============================================================================
