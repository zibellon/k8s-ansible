# =============================================================================
#  ПРОДУКТ: my-casino          FLOW: полная автоматика до prod
# =============================================================================
#   dev       auto  + push        (SHORT_SHA)
#   qa        auto  + push        (rc)
#   qa2       auto  + push        (rc)
#   pre-prod  auto  + push        (rc)     ← вся середина едет сама
#   prod-*    MANUAL + MR         (v1.3.0 + digest)
#
#   Клиенты: vasya, petya, dima
#   Повесили tag v1.3.0-rc1 → груз создан → сам доехал до pre-prod.
#   Дальше человек выбирает груз и катит клиентам через MR.
# =============================================================================
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: my-casino
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: my-casino
  namespace: my-casino
spec:
  promotionPolicies:
  - stageSelector: { name: dev }
    autoPromotionEnabled: true
  - stageSelector: { name: qa }
    autoPromotionEnabled: true
  - stageSelector: { name: qa2 }
    autoPromotionEnabled: true
  - stageSelector: { name: pre-prod }
    autoPromotionEnabled: true
  # prod-* — политик НЕТ → только ручной promote

# --- источники образов -------------------------------------------------------
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata: { name: dev, namespace: my-casino }
spec:
  interval: 5m0s
  freightCreationPolicy: Automatic
  subscriptions:
  - image:
      repoURL: registry.aaa/my-casino
      imageSelectionStrategy: NewestBuild
      allowTagsRegexes: ['^[0-9a-f]{7,40}$']            # только SHORT_SHA
      discoveryLimit: 20
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata: { name: release, namespace: my-casino }
spec:
  interval: 5m0s
  freightCreationPolicy: Automatic
  subscriptions:
  - image:
      repoURL: registry.aaa/my-casino
      imageSelectionStrategy: NewestBuild               # Freight на каждый rc-билд
      allowTagsRegexes: ['^v[0-9]+\.[0-9]+\.[0-9]+-rc\.?[0-9]+$']   # ТОЛЬКО rc
      discoveryLimit: 50

# --- наши стенды -------------------------------------------------------------
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata: { name: dev, namespace: my-casino }
spec:
  requestedFreight:
  - origin: { kind: Warehouse, name: dev }
    sources: { direct: true }
  promotionTemplate:
    spec:
      steps:
      - task: { name: promote-direct, kind: ClusterPromotionTask }
        as: promo
        vars:
        - { name: gitopsRepo,   value: https://gitlab.aaa/gitops/stands.git }
        - { name: productPath,  value: my-casino }
        - { name: imageRepo,    value: registry.aaa/my-casino }
        - { name: targetBranch, value: env/dev }
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata: { name: qa, namespace: my-casino }
spec:
  requestedFreight:
  - origin: { kind: Warehouse, name: release }
    sources: { direct: true }
  promotionTemplate:
    spec:
      steps:
      - task: { name: promote-direct, kind: ClusterPromotionTask }
        as: promo
        vars:
        - { name: gitopsRepo,   value: https://gitlab.aaa/gitops/stands.git }
        - { name: productPath,  value: my-casino }
        - { name: imageRepo,    value: registry.aaa/my-casino }
        - { name: targetBranch, value: env/qa }
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata: { name: qa2, namespace: my-casino }
spec:
  requestedFreight:
  - origin: { kind: Warehouse, name: release }
    sources: { stages: [qa] }
  promotionTemplate:
    spec:
      steps:
      - task: { name: promote-direct, kind: ClusterPromotionTask }
        as: promo
        vars:
        - { name: gitopsRepo,   value: https://gitlab.aaa/gitops/stands.git }
        - { name: productPath,  value: my-casino }
        - { name: imageRepo,    value: registry.aaa/my-casino }
        - { name: targetBranch, value: env/qa2 }
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata: { name: pre-prod, namespace: my-casino }
spec:
  requestedFreight:
  - origin: { kind: Warehouse, name: release }
    sources: { stages: [qa2] }
  promotionTemplate:
    spec:
      steps:
      - task: { name: promote-direct, kind: ClusterPromotionTask }
        as: promo
        vars:
        - { name: gitopsRepo,   value: https://gitlab.aaa/gitops/stands.git }
        - { name: productPath,  value: my-casino }
        - { name: imageRepo,    value: registry.aaa/my-casino }
        - { name: targetBranch, value: env/pre-prod }

# --- прод клиентов (manual + MR) ---------------------------------------------
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata: { name: prod-vasya, namespace: my-casino }
spec:
  requestedFreight:
  - origin: { kind: Warehouse, name: release }
    sources: { stages: [pre-prod] }
  promotionTemplate:
    spec:
      steps:
      - task: { name: promote-client-mr, kind: ClusterPromotionTask }
        as: promo
        vars:
        - { name: gitopsRepo,  value: https://gitlab.aaa/gitops/client-vasya.git }
        - { name: productPath, value: my-casino }
        - { name: imageRepo,   value: registry.aaa/my-casino }
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata: { name: prod-petya, namespace: my-casino }
spec:
  requestedFreight:
  - origin: { kind: Warehouse, name: release }
    sources: { stages: [pre-prod] }
  promotionTemplate:
    spec:
      steps:
      - task: { name: promote-client-mr, kind: ClusterPromotionTask }
        as: promo
        vars:
        - { name: gitopsRepo,  value: https://gitlab.aaa/gitops/client-petya.git }
        - { name: productPath, value: my-casino }
        - { name: imageRepo,   value: registry.aaa/my-casino }
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata: { name: prod-dima, namespace: my-casino }
spec:
  requestedFreight:
  - origin: { kind: Warehouse, name: release }
    sources: { stages: [pre-prod] }
  promotionTemplate:
    spec:
      steps:
      - task: { name: promote-client-mr, kind: ClusterPromotionTask }
        as: promo
        vars:
        - { name: gitopsRepo,  value: https://gitlab.aaa/gitops/client-dima.git }
        - { name: productPath, value: my-casino }
        - { name: imageRepo,   value: registry.aaa/my-casino }
